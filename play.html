<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f3b"><title>応援歌で遊ぶ | 応援歌BASE</title><link rel="stylesheet" href="play.css?v=20261021-r152"></head><body>
<header><a class="button secondary" href="index.html">◀戻る</a><nav aria-label="応援歌で遊ぶ"><button data-mode="quiz">応援歌クイズ</button><button data-mode="lyricsquiz">歌詞クイズ</button><a class="button secondary" href="index.html#homeLyricsSearch">歌詞検索</a><button data-mode="compare">聴き比べ</button></nav></header>
<main><div class="eyebrow">OUENKA BASE / PLAY</div><h1 id="pageTitle">応援歌クイズ</h1><p id="catalogStatus" role="status">登録された応援歌を読み込んでいます…</p><button id="reloadCatalog" class="secondary" hidden>もう一度読み込む</button>
<section id="quizPanel" class="panel"><p class="lead" id="quizLead">応援歌を聴いて、選手を当てよう。</p><label style="max-width:360px">クイズの種類<select id="quizKind"><option value="audio">応援歌クイズ（音を聴く）</option><option value="lyrics">歌詞クイズ（歌詞を見る）</option></select></label><div class="filters"><label>球団<select id="quizTeam"></select></label><label>対象<select id="quizActive"><option value="all">現役・現在未使用</option><option value="active">現役のみ</option><option value="ob">現在未使用のみ</option></select></label></div><div id="quizAudioSettings"><div class="filters"><label>長さの単位<select id="quizUnit"><option value="seconds">秒で指定</option><option value="bars">小節で指定</option></select></label><label id="quizSecondsField">聴ける長さ<select id="quizSeconds"><option value="10">10秒</option><option value="5">5秒・むずかしい</option><option value="20">20秒・じっくり</option></select></label><label id="quizBarsField" hidden>聴ける小節数<select id="quizBars"><option value="1">1小節</option><option value="2">2小節</option><option value="4">4小節</option><option value="8">8小節</option><option value="16">16小節</option></select></label><label>出題位置<select id="quizExcerpt"><option value="random">曲の途中から</option><option value="start">曲の最初から</option><option value="custom" id="quizCustomOption" hidden>開始小節を指定</option></select></label><label id="quizStartBarField" hidden>開始小節<input id="quizStartBar" type="number" min="1" max="128" step="1" value="1"></label></div><p id="quizBarsHint" class="muted" hidden>170 BPM・4拍子の音源基準で、小節の頭から出題します。曲末を超える場合は残りの小節数になります。</p></div><div id="quizLyricsSettings" hidden><div class="filters"><label>表示する歌詞<select id="quizLyricLines"><option value="2">2行</option><option value="1">1行・むずかしい</option><option value="all">全文</option></select></label></div><p class="muted">登録名と一致する選手名は伏せて出題します。歌詞が未登録の曲は出題しません。</p></div><button id="quizStart">10問に挑戦</button><div id="quizGame" hidden><div class="scorebar"><strong id="quizProgress"></strong><span id="quizScore"></span></div><blockquote id="quizLyricPrompt" class="quiz-lyric-prompt" hidden></blockquote><div class="toolbar"><span id="quizAudioControls"><button id="quizReplay">▶ もう一度聴く</button><button id="quizStop" class="secondary">■ 停止</button></span><button id="quizSkip" class="secondary">この問題をスキップ</button></div><p id="quizListenStatus" role="status"></p><div id="quizChoices" class="choices"></div><div id="quizAnswer" role="status"></div><button id="quizAnswerPlay" class="secondary" hidden>▶ 正解の応援歌を聴く</button><button id="quizNext" hidden>次の問題</button></div><div id="quizResult" hidden></div><p id="quizBest" class="muted"></p></section>
<section id="comparePanel" class="panel" hidden><p class="lead">同じ選手の別バージョンや、移籍前後の応援歌を聴き比べ。</p><label>選手名・ふりがな<input id="compareQuery" type="search" placeholder="選手名を入力" autocomplete="off"></label><div id="compareCandidates" class="toolbar"></div><p id="compareStatus" role="status"></p><div id="compareVersions" class="comparison"></div></section>
<p id="audioStatus" role="status" aria-live="polite"></p><div id="playTransport"></div>
</main><script src="audio-recovery.js?v=20261020-r133"></script><script src="ouenka-transport.js?v=20261020-r133"></script><script src="ouenka-favorites.js?v=20261020-r136"></script><script src="team-colors.js?v=20261021-r148"></script><script src="ouenka-medley-core.js?v=20261021-r150"></script><script src="quiz-rules.js?v=20261021-r152"></script><script src="play-audio.js?v=20261021-r152"></script><script src="playlist-share.js?v=20261021-r150"></script><script src="play.js?v=20261021-r152"></script></body></html>
