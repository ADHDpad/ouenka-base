<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>公開前チェックリスト</title><script src="creator-password.js"></script><script src="review-store.js?v=3"></script><script src="ouenka-medley-core.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script><script src="site-theme.js"></script><link rel="stylesheet" href="site-theme.css"><style>body{font:16px system-ui;margin:0;background:#eef3f7;color:#10283c}header{background:var(--site-bar-background,#071d33);color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}main{max-width:850px;margin:auto;padding:16px}section,article{background:white;border-radius:12px;padding:16px;margin:12px 0;border:1px solid #d4dce4}button,a.action{font:inherit;padding:10px 14px;border:0;border-radius:7px;background:#1268a3;color:white;cursor:pointer;text-decoration:none}button:disabled{opacity:.45;cursor:default}label{display:block;padding:8px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:8px}input[type=password],select{font:inherit;padding:8px;max-width:100%}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}h2{font-size:19px;margin:8px 0}p{line-height:1.6}#status{position:sticky;top:0;background:#e4f0fb;padding:10px;white-space:pre-wrap}header a{color:white}small{color:#526678}.medley-progress{display:flex;align-items:center;gap:12px}.medley-progress input{flex:1;min-width:0;height:32px}.medley-progress output{white-space:nowrap;font-variant-numeric:tabular-nums}</style><link rel="stylesheet" href="creator-login.css?v=1"></head><body><header><strong>公開前チェックリスト</strong><a href="settings.html#publicationReviewSettings">戻る</a></header><main><div id="gate" class="creator-auth-overlay"><form class="creator-login"><h2>CREATOR LOGIN</h2><p>応援歌BASE 作成者専用画面</p><input type="password" autocomplete="current-password" placeholder="作成者用パスワード" aria-label="作成者用パスワード" required><button type="submit">作成者画面を開く</button><div id="error" class="creator-auth-error" role="alert"></div><a class="creator-back" href="settings.html">◀戻る</a></form></div><div id="content" hidden><p>未公開データはこの端末に保存されます。登録した曲をまとめて確認し、確認済みの曲を一括公開できます。</p><div class="actions"><a class="action" href="save.html">新規登録</a><button id="medley">選択順でメドレー再生</button><button id="medleyPause" disabled>一時停止</button><button id="stop">停止</button></div><div class="medley-progress"><input id="medleySeek" type="range" min="0" max="0" step="any" value="0" aria-label="メドレーの再生位置" disabled><output id="medleyTime" for="medleySeek">0:00 / 0:00</output></div><p id="status" role="status"></p><section><h2>メドレー選択順</h2><div class="actions"><button id="addAllDrafts" disabled>未公開曲をメドレーへ一括追加</button></div><div id="order"></div><label>公開済み曲を比較用に追加 <select id="catalog"><option value="">読み込み前</option></select></label><button id="loadCatalog">公開済み曲を読み込む</button><button id="addCatalog">追加</button></section><section><h2 id="summary"></h2><div class="actions"><button id="batchZip">確認済み曲の一括ZIP作成</button><button id="batchPublish">一括公開</button></div><small>ZIPを展開してGitHubに配置・Pushした後に公開してください。</small></section><div id="list"></div></div></main><script src="publication-review.js?v=batch-publish-fix"></script></body></html>
