<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071d33">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="team.css?v=20261021-r139">
<title>球団別応援歌 | OUENKA BASE</title>
<style>input,textarea,select{scroll-margin-top:90px}@media(max-width:700px){input:not([type=checkbox]):not([type=radio]),textarea,select{font-size:16px!important}}</style>
</head>
<body>
<header class="team-fixed">
  <div class="team-topline">
    <button class="back" type="button" onclick="location.href='./index.html'" aria-label="◀戻る">◀戻る</button>
    
    
  </div>
  <div class="lyrics-link-wrap"><button id="teamPlayAll" type="button" class="lyrics-link" aria-pressed="false">▶ 全曲再生</button> <button id="teamFavoritesButton" type="button" class="lyrics-link" aria-pressed="false">★ お気に入り</button> <a id="lyricsCardLink" class="lyrics-link" href="./lyrics-card.html">歌詞カード</a></div>
  <p class="tap-hint">タップすると再生します</p>
  <nav class="filter-tabs" aria-label="表示区分">
    <button type="button" class="filter active" data-filter="all">全曲</button>
    <button type="button" class="filter" data-filter="active">現役のみ</button>
    <button type="button" class="filter" data-filter="ob">現在未使用のみ</button>
  </nav>
</header>
<main>
  <div id="teamStatus" class="status">読み込み中…</div>
  <section id="songList" class="song-list" aria-live="polite"></section>
</main>
<div id="miniPlayer" class="mini-player" hidden aria-label="再生操作">
  <button id="miniPause" type="button" aria-label="一時停止">Ⅱ</button>
  <button id="miniPlay" type="button" class="main-play" aria-label="再生">▶</button>
  <button id="miniStop" type="button" aria-label="停止">■</button>
  <strong id="miniTitle" hidden></strong><small id="miniState" hidden>停止中</small>
</div>
<script src="./ouenka-transport.js?v=20261020-r133"></script>
<script src="./ouenka-favorites.js?v=20261020-r136"></script>
<script src="audio-recovery.js?v=20261020-r133"></script>
<script src="pwa-diagnostic.js?v=20261020-r133"></script>
<script src="ouenka-medley-core.js?v=20261021-r145"></script>
<script src="team.js?v=20261021-r145"></script>
<script>document.getElementById("lyricsCardLink").href="./lyrics-card.html?team="+encodeURIComponent(new URLSearchParams(location.search).get("team")||"北海道日本ハムファイターズ");</script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./service-worker.js?v=20261021-r164').catch(console.warn)}
</script>
</body>
</html>
