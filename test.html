// ============================================================
// 基本設定
// ============================================================

const MAX_SUGGESTIONS = 10;


/*
    今日確定したメロディー再生設定

    Velocity = 127固定
    Attack   = 15ms
    Release  = 18ms
*/

const ATTACK_TIME = 0.015;

const RELEASE_TIME = 0.018;


/*
    各音源には先頭無音があるため
    発音位置を検出する。

    発音直前を削りすぎないよう
    約6msだけ残す。
*/

const SAMPLE_PREROLL = 0.006;


// ============================================================
// 音源保存場所
// ============================================================

const SAMPLE_BASE_PATH =
    "音源/音源2/メロディ/";

// MIDI番号 → 24音源
// ============================================================

    62: "音源レ.m4a",
    63: "音源レ#️⃣.m4a",

    68: "音源ソ#️⃣.m4a",

    81: "音源ラ➕.m4a",

// ============================================================
// 検索
// ============================================================

function searchTestPlayers() {


    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    suggestions.innerHTML =
        "";


    if (
        searchInput.value.length > 0
    ) {

        clearButton.style.display =
            "block";

    }
    else {

        clearButton.style.display =
            "none";

    }


    if (keyword === "") {


        suggestions.style.display =
            "none";


        clearSelection();


        return;

    }


    if (
        typeof players ===
        "undefined"
    ) {


        suggestions.style.display =
            "block";


        suggestions.innerHTML =
            '<div class="no-search-result">'
            +
            '選手データを読み込み中です'
            +
            '</div>';


        return;

    }


    const matchedPlayers =
        [];


    Object.keys(players).forEach(

        function(playerId) {


            const player =
                players[playerId];


            if (!player) {

                return;

            }


            const name =
                (player.name || "")
                    .toLowerCase();


            const reading =
                (player.reading || "")
                    .toLowerCase();


            const team =
                (player.team || "")
                    .toLowerCase();


            if (

                name.includes(keyword)

                ||

                reading.includes(keyword)

                ||

                team.includes(keyword)

            ) {


                matchedPlayers.push({

                    playerId:
                        playerId,

                    player:
                        player

                });

            }

        }

    );


    if (
        matchedPlayers.length === 0
    ) {


        const noResult =
            document.createElement(
                "div"
            );


        noResult.className =
            "no-search-result";


        noResult.textContent =
            "該当する選手はいません";


        suggestions.appendChild(
            noResult
        );


        suggestions.style.display =
            "block";


        return;

    }


    matchedPlayers

        .slice(
            0,
            MAX_SUGGESTIONS
        )

        .forEach(

            function(item) {


                const candidate =
                    document.createElement(
                        "div"
                    );


                candidate.className =
                    "search-candidate";


                candidate.textContent =
                    item.player.name;


                candidate.onclick =
                    function() {


                        selectTestPlayer(

                            item.playerId,

                            item.player

                        );

                    };


                suggestions.appendChild(
                    candidate
                );

            }

        );


    suggestions.style.display =
        "block";

}

// ============================================================
// ZIP読み込み
// ============================================================

async function handleZipFile(
    file
) {


    if (!file) {

        return;

    }


    try {


        stopMidiPlayback();


        loadedMidi =
            null;


        loadedNotes =
            null;


        playButton.style.display =
            "none";


        selectedZipName.textContent =
            file.name;


        status.textContent =
            "ZIPを解析しています…";


        // ----------------------------------------------------
        // ZIPを読み込む
        // ----------------------------------------------------

        const zipBuffer =
            await file.arrayBuffer();


        const zip =
            await JSZip.loadAsync(
                zipBuffer
            );


        // ----------------------------------------------------
        // ZIP内の本物のMIDIだけ取得
        //
        // 日本語ファイル名が文字化けしても
        // ファイル名の「メロディー」は見ない。
        //
        // __MACOSX
        // ._xxxxx.mid
        // .DS_Store
        //
        // は除外。
        // ----------------------------------------------------

        const midiFiles =
            [];


        zip.forEach(

            function(
                relativePath,
                zipEntry
            ) {


                if (
                    zipEntry.dir
                ) {

                    return;

                }


                const path =
                    relativePath
                        .replace(
                            /\\/g,
                            "/"
                        );


                const lowerPath =
                    path.toLowerCase();


                // Macの管理フォルダ
                if (
                    lowerPath.includes(
                        "__macosx/"
                    )
                ) {

                    return;

                }


                const fileName =
                    path
                        .split("/")
                        .pop();


                // Macの管理ファイル
                if (
                    fileName.startsWith(
                        "._"
                    )
                ) {

                    return;

                }


                if (
                    fileName.toLowerCase()
                    ===
                    ".ds_store"
                ) {

                    return;

                }


                // MIDI拡張子だけ対象
                const isMidi =

                    lowerPath.endsWith(
                        ".mid"
                    )

                    ||

                    lowerPath.endsWith(
                        ".midi"
                    );


                if (!isMidi) {

                    return;

                }


                midiFiles.push({

                    path:
                        relativePath,

                    entry:
                        zipEntry

                });

            }

        );


        // ----------------------------------------------------
        // MIDIなし
        // ----------------------------------------------------

        if (
            midiFiles.length === 0
        ) {


            throw new Error(
                "ZIP内にMIDIファイルがありません"
            );

        }


        // ----------------------------------------------------
        // 実験版では
        // 「メロディーMIDI ZIP」を選択する前提。
        //
        // そのため本物のMIDIの1個目を採用。
        // ----------------------------------------------------

        const selectedMidi =
            midiFiles[0];


        console.log(
            "ZIP内のMIDI:",
            midiFiles.map(
                item =>
                    item.path
            )
        );


        console.log(
            "使用するMIDI:",
            selectedMidi.path
        );


        status.textContent =
            "MIDIを解析しています…";


        // ----------------------------------------------------
        // MIDIデータ取得
        // ----------------------------------------------------

        const midiArrayBuffer =
            await selectedMidi
                .entry
                .async(
                    "arraybuffer"
                );


        // ----------------------------------------------------
        // MIDI解析
        // ----------------------------------------------------

        loadedMidi =
            new Midi(
                midiArrayBuffer
            );


        loadedNotes =
            getMelodyNotes(
                loadedMidi
            );


        // ----------------------------------------------------
        // MIDI範囲確認
        // ----------------------------------------------------

        const midiNumbers =
            loadedNotes.map(
                note =>
                    note.midi
            );


        const minMidi =
            Math.min(
                ...midiNumbers
            );


        const maxMidi =
            Math.max(
                ...midiNumbers
            );


        console.log(
            "ノート数:",
            loadedNotes.length
        );


        console.log(
            "MIDI範囲:",
            minMidi,
            "～",
            maxMidi
        );


        // ----------------------------------------------------
        // 24音源の範囲外チェック
        // ----------------------------------------------------

        const unsupported =
            [
                ...new Set(

                    midiNumbers.filter(

                        midiNumber =>

                            !SAMPLE_FILES[
                                midiNumber
                            ]

                    )

                )
            ];


        if (
            unsupported.length > 0
        ) {


            throw new Error(

                "対応音源がないMIDI番号があります："

                +

                unsupported.join(", ")

            );

        }


        // ----------------------------------------------------
        // 成功
        // ----------------------------------------------------

        selectedZipName.textContent =
            file.name;


        status.textContent =

            "MIDI読込完了 / "

            +

            loadedNotes.length

            +

            "音 / MIDI "

            +

            minMidi

            +

            "～"

            +

            maxMidi;


        playButton.style.display =
            "block";


    }
    catch (error) {


        console.error(
            "ZIP読込エラー:",
            error
        );


        loadedMidi =
            null;


        loadedNotes =
            null;


        playButton.style.display =
            "none";


        status.textContent =
            "エラー："
            +
            error.message;


        alert(

            "ZIPを読み込めませんでした。\n\n"

            +

            error.message

        );

    }

}


// ============================================================
// MIDIノート取得
// ============================================================

function getMelodyNotes(
    midi
) {


    const notes =
        [];


    midi.tracks.forEach(

        function(track) {


            track.notes.forEach(

                function(note) {


                    notes.push(
                        note
                    );

                }

            );

        }

    );


    notes.sort(

        function(a, b) {


            return a.time
                -
                b.time;

        }

    );


    if (
        notes.length === 0
    ) {


        throw new Error(
            "MIDIに音符がありません"
        );

    }


    return notes;

}


// ============================================================
// AudioContext
// ============================================================

async function prepareAudioContext() {


    if (!audioContext) {


        audioContext =
            new (
                window.AudioContext
                ||
                window.webkitAudioContext
            )();

    }


    if (
        audioContext.state
        ===
        "suspended"
    ) {


        await audioContext.resume();

    }


    if (!masterGain) {


        masterGain =
            audioContext.createGain();


        masterGain.gain.value =
            0.80;


        masterGain.connect(
            audioContext.destination
        );

    }

}


// ============================================================
// 音源の発音開始位置検出
// ============================================================

function detectSampleStart(
    buffer
) {


    const data =
        buffer.getChannelData(0);


    let max =
        0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {


        const value =
            Math.abs(
                data[i]
            );


        if (
            value > max
        ) {


            max =
                value;

        }

    }


    /*
        Pythonでうまくいった基準に合わせる

        最大振幅の1%
        または0.0015
    */

    const threshold =
        Math.max(

            0.0015,

            max * 0.01

        );


    let first =
        0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {


        if (

            Math.abs(
                data[i]
            )

            >

            threshold

        ) {


            first =
                i;


            break;

        }

    }


    const firstSeconds =

        first

        /

        buffer.sampleRate;


    return Math.max(

        0,

        firstSeconds
        -
        SAMPLE_PREROLL

    );

}


// ============================================================
// 1音読み込み
// ============================================================

async function loadSample(
    midiNote
) {


    if (
        sampleBuffers[midiNote]
    ) {


        return;

    }


    const fileName =
        SAMPLE_FILES[
            midiNote
        ];


    if (!fileName) {


        throw new Error(

            "対応する音源がありません。MIDI番号："

            +

            midiNote

        );

    }


    /*
        encodeURIComponentで
        # や日本語をURLとして安全にする。
    */

    const url =

        SAMPLE_BASE_PATH

        +

        encodeURIComponent(
            fileName
        );


    const response =
        await fetch(
            url
        );


    if (!response.ok) {


        throw new Error(

            "音源を取得できません："

            +

            fileName

        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const buffer =
        await audioContext
            .decodeAudioData(
                arrayBuffer
            );


    const startOffset =
        detectSampleStart(
            buffer
        );


    sampleBuffers[midiNote] = {

        buffer:
            buffer,

        startOffset:
            startOffset

    };

}


// ============================================================
// MIDIで使用する音源だけロード
// ============================================================

async function loadRequiredSamples(
    notes
) {


    const requiredNotes =
        [
            ...new Set(

                notes.map(
                    note =>
                        note.midi
                )

            )
        ];


    for (
        let i = 0;
        i < requiredNotes.length;
        i++
    ) {


        status.textContent =

            "音源準備中… "

            +

            (i + 1)

            +

            "/"

            +

            requiredNotes.length;


        await loadSample(
            requiredNotes[i]
        );

    }

}


// ============================================================
// 現在の残響
// ============================================================

function connectWithReverb(
    noteGain
) {


    // 原音
    noteGain.connect(
        masterGain
    );


    /*
        現在採用している残響

        90ms   0.34
        220ms  0.27
        420ms  0.21
        680ms  0.16
        950ms  0.12
        1250ms 0.085
        1550ms 0.055
    */

    const reflections = [

        [0.09, 0.34],

        [0.22, 0.27],

        [0.42, 0.21],

        [0.68, 0.16],

        [0.95, 0.12],

        [1.25, 0.085],

        [1.55, 0.055]

    ];


    reflections.forEach(

        function(item) {


            const delay =
                audioContext
                    .createDelay(
                        2
                    );


            const delayGain =
                audioContext
                    .createGain();


            delay.delayTime.value =
                item[0];


            delayGain.gain.value =
                item[1];


            noteGain.connect(
                delay
            );


            delay.connect(
                delayGain
            );


            delayGain.connect(
                masterGain
            );

        }

    );

}


// ============================================================
// MIDI再生
// ============================================================

function scheduleMidi(
    notes
) {


    stopMidiPlayback();


    /*
        ボタン押下から80ms後に開始。
    */

    const baseTime =

        audioContext.currentTime

        +

        0.08;


    /*
        実験版の単曲再生では
        MIDIの最初の音を0秒扱いにする。
    */

    const firstNoteTime =
        notes[0].time;


    notes.forEach(

        function(note) {


            const sample =
                sampleBuffers[
                    note.midi
                ];


            if (!sample) {


                console.warn(
                    "音源なし:",
                    note.midi
                );


                return;

            }


            const source =
                audioContext
                    .createBufferSource();


            source.buffer =
                sample.buffer;


            const noteGain =
                audioContext
                    .createGain();


            /*
                MIDI本来の開始タイミングを維持
            */

            const startTime =

                baseTime

                +

                (
                    note.time
                    -
                    firstNoteTime
                );


            /*
                MIDI本来の音の長さを使用
            */

            const noteDuration =
                Math.max(

                    0.03,

                    note.duration

                );


            const releaseEnd =

                startTime

                +

                noteDuration

                +

                RELEASE_TIME;


            /*
                ==============================
                Velocity 127固定
                ==============================

                元MIDIのvelocityは使用しない。
            */

            const velocityGain =
                1.0;


            /*
                ==============================
                15ms Attack
                ==============================
            */

            noteGain.gain
                .setValueAtTime(

                    0,

                    startTime

                );


            noteGain.gain
                .linearRampToValueAtTime(

                    velocityGain,

                    startTime
                    +
                    ATTACK_TIME

                );


            /*
                MIDIノート終了までは最大値
            */

            noteGain.gain
                .setValueAtTime(

                    velocityGain,

                    startTime
                    +
                    noteDuration

                );


            /*
                ==============================
                18ms Release
                ==============================
            */

            noteGain.gain
                .linearRampToValueAtTime(

                    0,

                    releaseEnd

                );


            source.connect(
                noteGain
            );


            connectWithReverb(
                noteGain
            );


            /*
                先頭無音を飛ばして
                サンプル再生開始。
            */

            source.start(

                startTime,

                sample.startOffset

            );


            /*
                サンプルが途中で足りなくならない範囲で
                MIDI長 + Release分を再生。
            */

            const availableDuration =

                sample.buffer.duration

                -

                sample.startOffset;


            const requestedDuration =

                noteDuration

                +

                RELEASE_TIME

                +

                0.03;


            const actualDuration =

                Math.min(

                    availableDuration,

                    requestedDuration

                );


            source.stop(

                startTime

                +

                actualDuration

            );


            activeSources.push(
                source
            );

        }

    );


    status.textContent =

        selectedTestPlayer.name

        +

        " MIDI再生中";


    playButton.textContent =
        "▶ 最初から再生";


    stopButton.style.display =
        "block";

}


// ============================================================
// 再生ボタン
// ============================================================

async function playLoadedMidi() {


    if (

        !loadedNotes

        ||

        loadedNotes.length === 0

    ) {


        return;

    }


    try {


        playButton.disabled =
            true;


        stopMidiPlayback();


        status.textContent =
            "再生準備中…";


        await prepareAudioContext();


        /*
            MIDIで必要な音階だけロードする。
        */

        await loadRequiredSamples(
            loadedNotes
        );


        status.textContent =
            "再生開始";


        scheduleMidi(
            loadedNotes
        );


    }
    catch (error) {


        console.error(
            "MIDI再生エラー:",
            error
        );


        status.textContent =

            "エラー："

            +

            error.message;


        alert(

            "MIDIを再生できませんでした。\n\n"

            +

            error.message

        );

    }
    finally {


        playButton.disabled =
            false;

    }

}


// ============================================================
// 停止
// ============================================================

function stopMidiPlayback() {


    activeSources.forEach(

        function(source) {


            try {


                source.stop();


            }
            catch (error) {


                /*
                    すでに停止済みなら無視
                */

            }

        }

    );


    activeSources =
        [];


    stopButton.style.display =
        "none";

}

// イベント
// ============================================================

searchInput.addEventListener(

    "input",

    searchTestPlayers

);


clearButton.addEventListener(

    "click",

    clearSearch

);


zipButton.addEventListener(

    "click",

    openZipPicker

);


zipInput.addEventListener(

    "change",

    function() {


        const file =
            zipInput.files[0];


        if (file) {


            handleZipFile(
                file
            );

        }

    }

);


playButton.addEventListener(

    "click",

    playLoadedMidi

);


stopButton.addEventListener(

    "click",

    function() {


        stopMidiPlayback();


        status.textContent =
            "停止しました";

    }

);

// players.js読み込み完了

window.addEventListener(

    "playersLoaded",

    function() {


        console.log(
            "実験ページ：選手データ準備完了"
        );


        if (
            searchInput.value.trim()
            !== ""
        ) {


            searchTestPlayers();

        }

    }

);
