<script>


// ========================================
// 基本設定
// ========================================

const MAX_SUGGESTIONS = 10;

const ATTACK_TIME = 0.015;

const RELEASE_TIME = 0.018;

const SAMPLE_PREROLL = 0.006;


const SAMPLE_BASE_PATH =
    "音源/音源2/メロディ/";


// ========================================
// MIDI番号 → 音源
// ========================================

const SAMPLE_FILES = {

    60: "音源ド.m4a",
    61: "音源ド#️⃣.m4a",
    62: "音源レ.m4a",
    63: "音源レ#️⃣.m4a",

    64: "音源ミ.m4a",

    65: "音源ファ.m4a",
    66: "音源ファ#️⃣.m4a",

    67: "音源ソ.m4a",
    68: "音源ソ#️⃣.m4a",

    69: "音源ラ.m4a",
    70: "音源ラ#️⃣.m4a",

    71: "音源シ.m4a",

    72: "音源ド➕.m4a",
    73: "音源ド#️⃣➕.m4a",

    74: "音源レ➕.m4a",
    75: "音源レ#️⃣➕.m4a",

    76: "音源ミ➕.m4a",

    77: "音源ファ➕.m4a",
    78: "音源ファ#️⃣➕.m4a",

    79: "音源ソ➕.m4a",
    80: "音源ソ#️⃣➕.m4a",

    81: "音源ラ➕.m4a",
    82: "音源ラ#️⃣➕.m4a",

    83: "音源シ➕.m4a"

};


// ========================================
// DOM
// ========================================

const searchInput =
    document.getElementById(
        "testSearchInput"
    );


const suggestions =
    document.getElementById(
        "testSuggestions"
    );


const clearButton =
    document.getElementById(
        "testClearButton"
    );


const selectedArea =
    document.getElementById(
        "selectedPlayer"
    );


const selectedName =
    document.getElementById(
        "selectedPlayerName"
    );


const zipInput =
    document.getElementById(
        "zipInput"
    );


const zipButton =
    document.getElementById(
        "zipButton"
    );


const selectedZipName =
    document.getElementById(
        "selectedZipName"
    );


const playButton =
    document.getElementById(
        "playButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const status =
    document.getElementById(
        "status"
    );


// ========================================
// 状態
// ========================================

let selectedTestPlayerId = null;

let selectedTestPlayer = null;

let loadedMidi = null;

let loadedNotes = null;


// ========================================
// Web Audio
// ========================================

let audioContext = null;

let masterGain = null;

let sampleBuffers = {};

let activeSources = [];


// ========================================
// 検索
// ========================================

function searchTestPlayers() {


    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    suggestions.innerHTML =
        "";


    if (
        searchInput.value.length > 0
    ) {

        clearButton.style.display =
            "block";

    }
    else {

        clearButton.style.display =
            "none";

    }


    if (keyword === "") {

        suggestions.style.display =
            "none";

        clearSelection();

        return;

    }


    if (
        typeof players ===
        "undefined"
    ) {

        suggestions.style.display =
            "block";

        suggestions.innerHTML =
            '<div class="no-search-result">'
            +
            '選手データを読み込み中です'
            +
            '</div>';

        return;

    }


    const matchedPlayers = [];


    Object.keys(players).forEach(

        function(playerId) {


            const player =
                players[playerId];


            if (!player) {

                return;

            }


            const name =
                (player.name || "")
                    .toLowerCase();


            const reading =
                (player.reading || "")
                    .toLowerCase();


            const team =
                (player.team || "")
                    .toLowerCase();


            if (

                name.includes(keyword)

                ||

                reading.includes(keyword)

                ||

                team.includes(keyword)

            ) {


                matchedPlayers.push({

                    playerId:
                        playerId,

                    player:
                        player

                });


            }

        }

    );


    if (
        matchedPlayers.length === 0
    ) {


        const noResult =
            document.createElement(
                "div"
            );


        noResult.className =
            "no-search-result";


        noResult.textContent =
            "該当する選手はいません";


        suggestions.appendChild(
            noResult
        );


        suggestions.style.display =
            "block";


        return;

    }


    matchedPlayers

        .slice(
            0,
            MAX_SUGGESTIONS
        )

        .forEach(

            function(item) {


                const candidate =
                    document.createElement(
                        "div"
                    );


                candidate.className =
                    "search-candidate";


                candidate.textContent =
                    item.player.name;


                candidate.onclick =
                    function() {


                        selectTestPlayer(

                            item.playerId,

                            item.player

                        );


                    };


                suggestions.appendChild(
                    candidate
                );

            }

        );


    suggestions.style.display =
        "block";

}


// ========================================
// 選手選択
// ========================================

function selectTestPlayer(
    playerId,
    player
) {


    stopMidiPlayback();


    selectedTestPlayerId =
        playerId;


    selectedTestPlayer =
        player;


    loadedMidi =
        null;


    loadedNotes =
        null;


    zipInput.value =
        "";


    searchInput.value =
        player.name;


    suggestions.innerHTML =
        "";


    suggestions.style.display =
        "none";


    clearButton.style.display =
        "block";


    selectedName.textContent =
        player.name;


    selectedArea.style.display =
        "block";


    selectedZipName.textContent =
        "";


    playButton.style.display =
        "none";


    stopButton.style.display =
        "none";


    status.textContent =
        "ZIPを選択してください";

}


// ========================================
// 選択解除
// ========================================

function clearSelection() {


    stopMidiPlayback();


    selectedTestPlayerId =
        null;


    selectedTestPlayer =
        null;


    loadedMidi =
        null;


    loadedNotes =
        null;


    selectedArea.style.display =
        "none";

}


// ========================================
// ×
// ========================================

function clearSearch() {


    searchInput.value =
        "";


    suggestions.innerHTML =
        "";


    suggestions.style.display =
        "none";


    clearButton.style.display =
        "none";


    clearSelection();


    searchInput.focus();

}


// ========================================
// ZIP選択
// ========================================

function openZipPicker() {


    zipInput.click();

}


// ========================================
// ZIP読み込み
// ========================================

async function handleZipFile(
    file
) {


    if (!file) {

        return;

    }


    try {


        stopMidiPlayback();


        loadedMidi =
            null;


        loadedNotes =
            null;


        playButton.style.display =
            "none";


        selectedZipName.textContent =
            file.name;


        status.textContent =
            "ZIPを解析しています…";


        const zipBuffer =
            await file.arrayBuffer();


        const zip =
            await JSZip.loadAsync(
                zipBuffer
            );


        let melodyFile =
            null;


        const allMidiFiles =
            [];


        // ====================================
        // ZIP内を検索
        // ====================================

        zip.forEach(

            function(
                relativePath,
                zipEntry
            ) {


                if (
                    zipEntry.dir
                ) {

                    return;

                }


                const lowerName =
                    relativePath
                        .toLowerCase();


                const isMidi =

                    lowerName.endsWith(
                        ".mid"
                    )

                    ||

                    lowerName.endsWith(
                        ".midi"
                    );


                if (!isMidi) {

                    return;

                }


                allMidiFiles.push(
                    zipEntry
                );


                /*
                 * メロディーという名前を
                 * 最優先。
                 */

                if (

                    !melodyFile

                    &&

                    (
                        relativePath.includes(
                            "メロディ"
                        )

                        ||

                        lowerName.includes(
                            "melody"
                        )
                    )

                ) {


                    melodyFile =
                        zipEntry;


                }


            }

        );


        // ====================================
        // MIDIが1個だけなら自動採用
        // ====================================

        if (

            !melodyFile

            &&

            allMidiFiles.length === 1

        ) {


            melodyFile =
                allMidiFiles[0];


        }


        // ====================================
        // 見つからない
        // ====================================

        if (!melodyFile) {


            if (
                allMidiFiles.length === 0
            ) {


                throw new Error(
                    "ZIP内にMIDIファイルがありません"
                );


            }


            throw new Error(
                "メロディーMIDIを特定できませんでした"
            );


        }


        status.textContent =
            "メロディーMIDIを解析しています…";


        const midiArrayBuffer =
            await melodyFile.async(
                "arraybuffer"
            );


        loadedMidi =
            new Midi(
                midiArrayBuffer
            );


        loadedNotes =
            getMelodyNotes(
                loadedMidi
            );


        selectedZipName.textContent =

            file.name

            +

            "\nメロディーMIDI検出："

            +

            melodyFile.name;


        status.textContent =

            "MIDI読込完了 / "

            +

            loadedNotes.length

            +

            "音";


        playButton.style.display =
            "block";


    }
    catch (error) {


        console.error(
            "ZIP読込エラー:",
            error
        );


        loadedMidi =
            null;


        loadedNotes =
            null;


        playButton.style.display =
            "none";


        status.textContent =
            "エラー："
            +
            error.message;


        alert(
            "ZIPを読み込めませんでした。\n\n"
            +
            error.message
        );


    }

}


// ========================================
// MIDIノート取得
// ========================================

function getMelodyNotes(
    midi
) {


    const notes = [];


    midi.tracks.forEach(

        function(track) {


            track.notes.forEach(

                function(note) {


                    notes.push(
                        note
                    );


                }

            );


        }

    );


    notes.sort(

        function(a, b) {


            return a.time
                -
                b.time;


        }

    );


    if (
        notes.length === 0
    ) {


        throw new Error(
            "MIDIに音符がありません"
        );


    }


    return notes;

}


// ========================================
// AudioContext準備
// ========================================

async function prepareAudioContext() {


    if (!audioContext) {


        audioContext =
            new (
                window.AudioContext
                ||
                window.webkitAudioContext
            )();


    }


    if (
        audioContext.state ===
        "suspended"
    ) {


        await audioContext.resume();


    }


    if (!masterGain) {


        masterGain =
            audioContext.createGain();


        masterGain.gain.value =
            0.80;


        masterGain.connect(
            audioContext.destination
        );


    }

}


// ========================================
// 音源先頭の無音検出
// ========================================

function detectSampleStart(
    buffer
) {


    const data =
        buffer.getChannelData(0);


    let max = 0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {


        const value =
            Math.abs(
                data[i]
            );


        if (
            value > max
        ) {


            max =
                value;


        }

    }


    const threshold =
        Math.max(

            0.0015,

            max * 0.01

        );


    let first =
        0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {


        if (

            Math.abs(
                data[i]
            )

            >

            threshold

        ) {


            first =
                i;

            break;

        }

    }


    return Math.max(

        0,

        (
            first
            /
            buffer.sampleRate
        )

        -

        SAMPLE_PREROLL

    );

}


// ========================================
// 音源読み込み
// ========================================

async function loadSample(
    midiNote
) {


    if (
        sampleBuffers[midiNote]
    ) {

        return;

    }


    const fileName =
        SAMPLE_FILES[midiNote];


    if (!fileName) {


        throw new Error(

            "対応する音源がありません。MIDI番号："

            +

            midiNote

        );


    }


    const url =

        SAMPLE_BASE_PATH

        +

        encodeURIComponent(
            fileName
        );


    const response =
        await fetch(
            url
        );


    if (!response.ok) {


        throw new Error(

            "音源を取得できません："

            +

            fileName

        );


    }


    const arrayBuffer =
        await response.arrayBuffer();


    const buffer =
        await audioContext
            .decodeAudioData(
                arrayBuffer
            );


    sampleBuffers[midiNote] = {

        buffer:
            buffer,

        startOffset:
            detectSampleStart(
                buffer
            )

    };

}


// ========================================
// 必要な音源だけ準備
// ========================================

async function loadRequiredSamples(
    notes
) {


    const requiredNotes =
        [
            ...new Set(

                notes.map(
                    note =>
                        note.midi
                )

            )
        ];


    for (
        let i = 0;
        i < requiredNotes.length;
        i++
    ) {


        status.textContent =

            "音源準備中… "

            +

            (i + 1)

            +

            "/"

            +

            requiredNotes.length;


        await loadSample(
            requiredNotes[i]
        );


    }

}


// ========================================
// 残響
// ========================================

function connectWithReverb(
    noteGain
) {


    noteGain.connect(
        masterGain
    );


    const reflections = [

        [0.09, 0.34],

        [0.22, 0.27],

        [0.42, 0.21],

        [0.68, 0.16],

        [0.95, 0.12],

        [1.25, 0.085],

        [1.55, 0.055]

    ];


    reflections.forEach(

        function(item) {


            const delay =
                audioContext.createDelay(
                    2
                );


            const gain =
                audioContext.createGain();


            delay.delayTime.value =
                item[0];


            gain.gain.value =
                item[1];


            noteGain.connect(
                delay
            );


            delay.connect(
                gain
            );


            gain.connect(
                masterGain
            );


        }

    );

}


// ========================================
// 再生
// ========================================

function scheduleMidi(
    notes
) {


    stopMidiPlayback();


    const now =
        audioContext.currentTime
        +
        0.08;


    /*
     * 単曲実験なので
     * MIDI先頭の空白は詰める。
     */

    const firstNoteTime =
        notes[0].time;


    notes.forEach(

        function(note) {


            const sample =
                sampleBuffers[
                    note.midi
                ];


            if (!sample) {

                return;

            }


            const source =
                audioContext
                    .createBufferSource();


            source.buffer =
                sample.buffer;


            const gain =
                audioContext
                    .createGain();


            const startTime =

                now

                +

                (
                    note.time
                    -
                    firstNoteTime
                );


            const noteDuration =
                Math.max(

                    0.03,

                    note.duration

                );


            const releaseEnd =

                startTime

                +

                noteDuration

                +

                RELEASE_TIME;


            /*
             * Velocity 127固定
             *
             * Web Audio上では
             * gain 1.0として扱う。
             */


            gain.gain.setValueAtTime(

                0,

                startTime

            );


            /*
             * 15ms立ち上がり
             */

            gain.gain.linearRampToValueAtTime(

                1.0,

                startTime
                +
                ATTACK_TIME

            );


            gain.gain.setValueAtTime(

                1.0,

                startTime
                +
                noteDuration

            );


            /*
             * 18msリリース
             */

            gain.gain.linearRampToValueAtTime(

                0,

                releaseEnd

            );


            source.connect(
                gain
            );


            connectWithReverb(
                gain
            );


            source.start(

                startTime,

                sample.startOffset

            );


            const available =

                sample.buffer.duration

                -

                sample.startOffset;


            const wanted =

                noteDuration

                +

                RELEASE_TIME

                +

                0.03;


            source.stop(

                startTime

                +

                Math.min(
                    available,
                    wanted
                )

            );


            activeSources.push(
                source
            );


        }

    );


    status.textContent =

        selectedTestPlayer.name

        +

        " MIDI再生中";


    stopButton.style.display =
        "block";

}


// ========================================
// MIDI再生ボタン
// ========================================

async function playLoadedMidi() {


    if (
        !loadedNotes
        ||
        loadedNotes.length === 0
    ) {


        return;

    }


    try {


        playButton.disabled =
            true;


        stopMidiPlayback();


        await prepareAudioContext();


        await loadRequiredSamples(
            loadedNotes
        );


        status.textContent =
            "再生開始";


        scheduleMidi(
            loadedNotes
        );


    }
    catch (error) {


        console.error(
            "MIDI再生エラー:",
            error
        );


        status.textContent =

            "エラー："

            +

            error.message;


        alert(

            "MIDIを再生できませんでした。\n\n"

            +

            error.message

        );


    }
    finally {


        playButton.disabled =
            false;


    }

}


// ========================================
// 停止
// ========================================

function stopMidiPlayback() {


    activeSources.forEach(

        function(source) {


            try {

                source.stop();

            }
            catch (error) {

                // 無視

            }


        }

    );


    activeSources =
        [];


    stopButton.style.display =
        "none";

}

playButton.addEventListener(

);


stopButton.addEventListener(

    "click",

    function() {


        stopMidiPlayback();


        status.textContent =
            "停止しました";


    }

);


window.addEventListener(

    "playersLoaded",

    function() {


        console.log(
            "実験ページ：選手データ準備完了"
        );


        if (
            searchInput.value.trim()
            !== ""
        ) {


            searchTestPlayers();


        }


    }

);
