<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#071d33"
    >

    <title>実験 | 応援歌BASE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #071d33;
            color: #ffffff;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .top-bar {
            display: flex;
            align-items: center;
            gap: 15px;

            padding: 18px 20px;

            border-bottom:
                1px solid rgba(255,255,255,0.15);
        }

        .back-button {
            padding: 10px 14px;

            border:
                1px solid rgba(255,255,255,0.3);

            border-radius: 6px;

            background: transparent;
            color: white;

            cursor: pointer;
        }

        .top-title {
            font-size: 18px;
            font-weight: bold;
        }

        .top-title small {
            display: block;

            margin-top: 3px;

            font-size: 10px;
            font-weight: normal;

            letter-spacing: 2px;

            opacity: 0.55;
        }

        main {
            width:
                min(
                    720px,
                    calc(100% - 32px)
                );

            margin: 0 auto;

            padding:
                50px 0;
        }

        .section-number {
            margin-bottom: 8px;

            color: #79bfff;

            font-size: 12px;

            letter-spacing: 2px;
        }

        h1 {
            margin:
                0 0 8px;

            font-size: 28px;
        }

        .description {
            margin:
                0 0 30px;

            color:
                rgba(255,255,255,0.6);

            font-size: 14px;
        }

        .search-wrapper {
            position: relative;
        }

        #testSearchInput {
            width: 100%;
            height: 58px;

            padding:
                0 52px 0 18px;

            border:
                1px solid
                rgba(255,255,255,0.25);

            border-radius: 8px;

            outline: none;

            background:
                rgba(255,255,255,0.06);

            color: white;

            font-size: 18px;
        }

        #testSearchInput:focus {
            border-color: #79bfff;
        }

        #testSearchInput::placeholder {
            color:
                rgba(255,255,255,0.4);
        }

        .clear-button {
            position: absolute;

            right: 12px;
            top: 50%;

            transform:
                translateY(-50%);

            display: none;

            width: 34px;
            height: 34px;

            border: 0;

            background: transparent;

            color:
                rgba(255,255,255,0.7);

            font-size: 24px;

            cursor: pointer;
        }

        #testSuggestions {
            display: none;

            margin-top: 12px;
        }

        .search-candidate {
            margin-bottom: 8px;

            padding:
                15px 16px;

            border:
                1px solid
                rgba(255,255,255,0.15);

            border-radius: 8px;

            background: #0b2f55;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        .search-candidate:hover {
            border-color: #79bfff;
        }

        .no-search-result {
            padding: 15px;

            color:
                rgba(255,255,255,0.6);
        }

        #selectedPlayer {
            display: none;

            margin-top: 30px;

            padding: 24px;

            border:
                1px solid
                rgba(255,255,255,0.18);

            border-radius: 10px;

            background:
                rgba(255,255,255,0.04);
        }

        .selected-label {
            margin-bottom: 6px;

            color:
                rgba(255,255,255,0.5);

            font-size: 11px;

            letter-spacing: 2px;
        }

        #selectedPlayerName {
            margin-bottom: 20px;

            font-size: 24px;

            font-weight: bold;
        }

        #midiPlayButton {
            width: 100%;

            min-height: 56px;

            border: 0;

            border-radius: 8px;

            background: white;

            color: #071d33;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        #status {
            margin-top: 16px;

            min-height: 24px;

            color:
                rgba(255,255,255,0.65);

            font-size: 13px;
        }

    </style>

</head>


<body>

    <header class="top-bar">

        <button
            type="button"
            class="back-button"
            onclick="location.href='index.html'"
        >
            ← 戻る
        </button>


        <div class="top-title">

            応援歌BASE 実験

            <small>
                EXPERIMENTAL MIDI PLAYER
            </small>

        </div>

    </header>


    <main>

        <div class="section-number">
            EXPERIMENT 01
        </div>


        <h1>
            対象者検索
        </h1>


        <p class="description">
            MIDI再生を行う対象者を選択してください。
        </p>


        <div class="search-wrapper">

            <input
                type="text"
                id="testSearchInput"
                placeholder="選手名・よみがな・球団"
                autocomplete="off"
            >


            <button
                type="button"
                id="testClearButton"
                class="clear-button"
            >
                ×
            </button>

        </div>


        <div
            id="testSuggestions"
        ></div>


        <section
            id="selectedPlayer"
        >

            <div class="selected-label">
                SELECTED PLAYER
            </div>


            <div
                id="selectedPlayerName"
            ></div>


            <button
                type="button"
                id="midiPlayButton"
            >
                ▶ MIDI再生
            </button>


            <div
                id="status"
            >
                MIDI再生待機中
            </div>

        </section>

    </main>


    <!--
        本番と同じ選手データ
    -->
    <script src="players.js"></script>


    <script>

        const MAX_SUGGESTIONS =
            10;


        let selectedTestPlayerId =
            null;

        let selectedTestPlayer =
            null;


        const searchInput =
            document.getElementById(
                "testSearchInput"
            );


        const suggestions =
            document.getElementById(
                "testSuggestions"
            );


        const clearButton =
            document.getElementById(
                "testClearButton"
            );


        const selectedArea =
            document.getElementById(
                "selectedPlayer"
            );


        const selectedName =
            document.getElementById(
                "selectedPlayerName"
            );


        const midiPlayButton =
            document.getElementById(
                "midiPlayButton"
            );


        const status =
            document.getElementById(
                "status"
            );


        // ========================================
        // 検索
        // ========================================

        function searchTestPlayers() {

            const keyword =
                searchInput.value
                    .trim()
                    .toLowerCase();


            suggestions.innerHTML =
                "";


            if (
                searchInput.value.length > 0
            ) {

                clearButton.style.display =
                    "block";

            }
            else {

                clearButton.style.display =
                    "none";

            }


            if (keyword === "") {

                suggestions.style.display =
                    "none";

                clearSelection();

                return;

            }


            // players.jsがまだ読み込み中

            if (
                typeof players ===
                    "undefined"
            ) {

                suggestions.style.display =
                    "block";

                suggestions.innerHTML =
                    '<div class="no-search-result">'
                    +
                    '選手データを読み込み中です'
                    +
                    '</div>';

                return;

            }


            const matchedPlayers =
                [];


            // ====================================
            // 本番search.jsと同じ方式
            // ====================================

            Object.keys(players).forEach(

                function(playerId) {

                    const player =
                        players[playerId];


                    if (!player) {

                        return;

                    }


                    const name =
                        (
                            player.name ||
                            ""
                        )
                        .toLowerCase();


                    const reading =
                        (
                            player.reading ||
                            ""
                        )
                        .toLowerCase();


                    const team =
                        (
                            player.team ||
                            ""
                        )
                        .toLowerCase();


                    if (

                        name.includes(
                            keyword
                        )

                        ||

                        reading.includes(
                            keyword
                        )

                        ||

                        team.includes(
                            keyword
                        )

                    ) {

                        matchedPlayers.push({

                            playerId:
                                playerId,

                            player:
                                player

                        });

                    }

                }

            );


            // ====================================
            // 該当なし
            // ====================================

            if (
                matchedPlayers.length === 0
            ) {

                const noResult =
                    document.createElement(
                        "div"
                    );


                noResult.className =
                    "no-search-result";


                noResult.textContent =
                    "該当する選手はいません";


                suggestions.appendChild(
                    noResult
                );


                suggestions.style.display =
                    "block";


                return;

            }


            // ====================================
            // 最大10件
            // ====================================

            const displayPlayers =
                matchedPlayers.slice(
                    0,
                    MAX_SUGGESTIONS
                );


            // ====================================
            // 候補作成
            // ====================================

            displayPlayers.forEach(

                function(item) {

                    const candidate =
                        document.createElement(
                            "div"
                        );


                    candidate.className =
                        "search-candidate";


                    candidate.textContent =
                        item.player.name;


                    candidate.onclick =
                        function() {

                            selectTestPlayer(

                                item.playerId,

                                item.player

                            );

                        };


                    suggestions.appendChild(
                        candidate
                    );

                }

            );


            suggestions.style.display =
                "block";

        }


        // ========================================
        // 選手選択
        // ========================================

        function selectTestPlayer(
            playerId,
            player
        ) {

            selectedTestPlayerId =
                playerId;


            selectedTestPlayer =
                player;


            searchInput.value =
                player.name;


            suggestions.innerHTML =
                "";


            suggestions.style.display =
                "none";


            clearButton.style.display =
                "block";


            selectedName.textContent =
                player.name;


            selectedArea.style.display =
                "block";


            status.textContent =
                "MIDI再生待機中";


            console.log(
                "選択:",
                playerId,
                player
            );

        }


        // ========================================
        // 選択解除
        // ========================================

        function clearSelection() {

            selectedTestPlayerId =
                null;


            selectedTestPlayer =
                null;


            selectedArea.style.display =
                "none";


            status.textContent =
                "MIDI再生待機中";

        }


        // ========================================
        // ×ボタン
        // ========================================

        function clearSearch() {

            searchInput.value =
                "";


            suggestions.innerHTML =
                "";


            suggestions.style.display =
                "none";


            clearButton.style.display =
                "none";


            clearSelection();


            searchInput.focus();

        }


        // ========================================
        // MIDI再生
        // ========================================

        function playTestMidi() {

            if (!selectedTestPlayer) {

                return;

            }


            console.log(
                "MIDI再生対象:",
                selectedTestPlayer
            );


            console.log(
                "登録MIDI:",
                selectedTestPlayer.midiZip
            );


            if (
                !selectedTestPlayer.midiZip
            ) {

                status.textContent =
                    "MIDIデータが登録されていません";

                return;

            }


            status.textContent =
                selectedTestPlayer.name
                +
                " のMIDIを確認しました";


            /*
             *
             * ★ 次の工程 ★
             *
             * selectedTestPlayer.midiZip
             *
             * からMIDI ZIPを取得
             *
             * ↓
             *
             * ZIP内の
             * メロディーMIDIを読み込む
             *
             * ↓
             *
             * 音源/音源2/メロディ/
             *
             * の24音源で再生
             *
             * Velocity = 127
             *
             * Fade In = 15ms
             *
             * Release = 18ms
             *
             * ↓
             *
             * Web Audio API
             *
             */

        }


        // ========================================
        // イベント
        // ========================================

        searchInput.addEventListener(

            "input",

            searchTestPlayers

        );


        clearButton.addEventListener(

            "click",

            clearSearch

        );


        midiPlayButton.addEventListener(

            "click",

            playTestMidi

        );


        // ========================================
        // players.js読み込み完了
        // ========================================

        window.addEventListener(

            "playersLoaded",

            function() {

                console.log(
                    "実験ページ：選手データ準備完了"
                );


                /*
                 * 入力済みなら
                 * 読み込み完了後に再検索
                 */

                if (
                    searchInput.value.trim()
                    !== ""
                ) {

                    searchTestPlayers();

                }

            }

        );

    </script>

</body>

</html>
