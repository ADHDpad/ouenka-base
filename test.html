<script>


// ========================================
// 基本設定
// ========================================

const MAX_SUGGESTIONS = 10;


/*
 * 今日確定した再生設定
 */

const ATTACK_TIME =
    0.015;


const RELEASE_TIME =
    0.018;


/*
 * 各音源の先頭に残す時間
 *
 * 完全に発音位置ピッタリで切ると
 * 音の頭を削る可能性があるため
 * 約6ms残す。
 */

const SAMPLE_PREROLL =
    0.006;


// ========================================
// 音源フォルダ
// ========================================

const SAMPLE_BASE_PATH =
    "音源/音源2/メロディ/";


// ========================================
// MIDIノート番号 → 音源
// ========================================

const SAMPLE_FILES = {

    60: "音源ド.m4a",

    61: "音源ド#️⃣.m4a",

    62: "音源レ.m4a",

    63: "音源レ#️⃣.m4a",

    64: "音源ミ.m4a",

    65: "音源ファ.m4a",

    66: "音源ファ#️⃣.m4a",

    67: "音源ソ.m4a",

    68: "音源ソ#️⃣.m4a",

    69: "音源ラ.m4a",

    70: "音源ラ#️⃣.m4a",

    71: "音源シ.m4a",

    72: "音源ド➕.m4a",

    73: "音源ド#️⃣➕.m4a",

    74: "音源レ➕.m4a",

    75: "音源レ#️⃣➕.m4a",

    76: "音源ミ➕.m4a",

    77: "音源ファ➕.m4a",

    78: "音源ファ#️⃣➕.m4a",

    79: "音源ソ➕.m4a",

    80: "音源ソ#️⃣➕.m4a",

    81: "音源ラ➕.m4a",

    82: "音源ラ#️⃣➕.m4a",

    83: "音源シ➕.m4a"

};


// ========================================
// 画面
// ========================================

const searchInput =
    document.getElementById(
        "testSearchInput"
    );


const suggestions =
    document.getElementById(
        "testSuggestions"
    );


const clearButton =
    document.getElementById(
        "testClearButton"
    );


const selectedArea =
    document.getElementById(
        "selectedPlayer"
    );


const selectedName =
    document.getElementById(
        "selectedPlayerName"
    );


const midiPlayButton =
    document.getElementById(
        "midiPlayButton"
    );


const stopButton =
    document.getElementById(
        "stopButton"
    );


const status =
    document.getElementById(
        "status"
    );


// ========================================
// 選択中
// ========================================

let selectedTestPlayerId =
    null;


let selectedTestPlayer =
    null;


// ========================================
// Web Audio
// ========================================

let audioContext =
    null;


let sampleBuffers =
    {};


let activeSources =
    [];


let masterGain =
    null;


// ========================================
// 検索
// ========================================

function searchTestPlayers() {


    const keyword =
        searchInput.value
            .trim()
            .toLowerCase();


    suggestions.innerHTML =
        "";


    if (
        searchInput.value.length > 0
    ) {

        clearButton.style.display =
            "block";

    }
    else {

        clearButton.style.display =
            "none";

    }


    if (keyword === "") {

        suggestions.style.display =
            "none";

        clearSelection();

        return;

    }


    if (
        typeof players ===
        "undefined"
    ) {

        suggestions.style.display =
            "block";

        suggestions.innerHTML =
            '<div class="no-search-result">'
            +
            '選手データを読み込み中です'
            +
            '</div>';

        return;

    }


    const matchedPlayers =
        [];


    Object.keys(players).forEach(

        function(playerId) {


            const player =
                players[playerId];


            if (!player) {

                return;

            }


            const name =
                (
                    player.name ||
                    ""
                )
                .toLowerCase();


            const reading =
                (
                    player.reading ||
                    ""
                )
                .toLowerCase();


            const team =
                (
                    player.team ||
                    ""
                )
                .toLowerCase();


            if (

                name.includes(keyword)

                ||

                reading.includes(keyword)

                ||

                team.includes(keyword)

            ) {

                matchedPlayers.push({

                    playerId:
                        playerId,

                    player:
                        player

                });

            }

        }

    );


    if (
        matchedPlayers.length === 0
    ) {


        const noResult =
            document.createElement(
                "div"
            );


        noResult.className =
            "no-search-result";


        noResult.textContent =
            "該当する選手はいません";


        suggestions.appendChild(
            noResult
        );


        suggestions.style.display =
            "block";


        return;

    }


    matchedPlayers

        .slice(
            0,
            MAX_SUGGESTIONS
        )

        .forEach(

            function(item) {


                const candidate =
                    document.createElement(
                        "div"
                    );


                candidate.className =
                    "search-candidate";


                candidate.textContent =
                    item.player.name;


                candidate.onclick =
                    function() {


                        selectTestPlayer(

                            item.playerId,

                            item.player

                        );


                    };


                suggestions.appendChild(
                    candidate
                );

            }

        );


    suggestions.style.display =
        "block";

}


// ========================================
// 選手選択
// ========================================

function selectTestPlayer(
    playerId,
    player
) {


    stopMidiPlayback();


    selectedTestPlayerId =
        playerId;


    selectedTestPlayer =
        player;


    searchInput.value =
        player.name;


    suggestions.innerHTML =
        "";


    suggestions.style.display =
        "none";


    clearButton.style.display =
        "block";


    selectedName.textContent =
        player.name;


    selectedArea.style.display =
        "block";


    status.textContent =

}


// ========================================
// 選択解除
// ========================================

function clearSelection() {


    stopMidiPlayback();


    selectedTestPlayerId =
        null;


    selectedTestPlayer =
        null;


    selectedArea.style.display =
        "none";

}


// ========================================
// 検索削除
// ========================================

function clearSearch() {


    searchInput.value =
        "";


    suggestions.innerHTML =
        "";


    suggestions.style.display =
        "none";


    clearButton.style.display =
        "none";


    clearSelection();


    searchInput.focus();

}


// ========================================
// AudioContext
// ========================================

async function prepareAudioContext() {


    if (!audioContext) {


        audioContext =
            new (
                window.AudioContext
                ||
                window.webkitAudioContext
            )();


    }


    if (
        audioContext.state ===
        "suspended"
    ) {


        await audioContext.resume();


    }


    if (!masterGain) {


        masterGain =
            audioContext.createGain();


        masterGain.gain.value =
            0.80;


        masterGain.connect(
            audioContext.destination
        );


    }

}


// ========================================
// 音源の先頭無音を検出
// ========================================

function detectSampleStart(
    buffer
) {


    const data =
        buffer.getChannelData(0);


    let max =
        0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {


        const value =
            Math.abs(
                data[i]
            );


        if (value > max) {

            max = value;

        }


    }


    const threshold =
        Math.max(

            0.0015,

            max * 0.01

        );


    let first =
        0;


    for (
        let i = 0;
        i < data.length;
        i++
    ) {


        if (
            Math.abs(
                data[i]
            )
            >
            threshold
        ) {


            first = i;

            break;

        }


    }


    const firstSeconds =
        first
        /
        buffer.sampleRate;


    return Math.max(

        0,

        firstSeconds
        -
        SAMPLE_PREROLL

    );

}


// ========================================
// 1音源読み込み
// ========================================

async function loadSample(
    midiNote
) {


    if (
        sampleBuffers[midiNote]
    ) {

        return;

    }


    const fileName =
        SAMPLE_FILES[midiNote];


    if (!fileName) {

        throw new Error(
            "対応音源なし MIDI:"
            +
            midiNote
        );

    }


    const url =
        SAMPLE_BASE_PATH
        +
        encodeURIComponent(
            fileName
        );


    const response =
        await fetch(
            url
        );


    if (!response.ok) {

        throw new Error(
            "音源取得失敗: "
            +
            fileName
        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const buffer =
        await audioContext
            .decodeAudioData(
                arrayBuffer
            );


    const startOffset =
        detectSampleStart(
            buffer
        );


    sampleBuffers[midiNote] = {

        buffer:
            buffer,

        startOffset:
            startOffset

    };

}


// ========================================
// MIDIで必要な音源だけ読み込む
// ========================================

async function loadRequiredSamples(
    notes
) {


    const requiredNotes =
        [
            ...new Set(

                notes.map(
                    note =>
                        note.midi
                )

            )
        ];


    for (
        let i = 0;
        i < requiredNotes.length;
        i++
    ) {


        const midiNote =
            requiredNotes[i];


        status.textContent =

            "音源を準備しています… "
            +
            (i + 1)
            +
            "/"
            +
            requiredNotes.length;


        await loadSample(
            midiNote
        );

    }

}


// ========================================
// MIDI ZIP取得
// ========================================

async function loadMelodyMidi(
    player
) {


    if (!player.midiZip) {


        throw new Error(
            "MIDIファイルが登録されていません"
        );


    }


    status.textContent =
        "MIDIデータを取得しています…";


    const response =
        await fetch(
            player.midiZip
        );


    if (!response.ok) {


        throw new Error(
            "MIDI ZIPを取得できません"
        );


    }


    const zipBuffer =
        await response.arrayBuffer();


    const zip =
        await JSZip.loadAsync(
            zipBuffer
        );


    let melodyFile =
        null;


    // ====================================
    // ZIP内からメロディーMIDIを探す
    // ====================================

    zip.forEach(

        function(
            relativePath,
            zipEntry
        ) {


            if (
                melodyFile
            ) {

                return;

            }


            if (
                zipEntry.dir
            ) {

                return;

            }


            const name =
                relativePath
                    .toLowerCase();


            const isMidi =

                name.endsWith(
                    ".mid"
                )

                ||

                name.endsWith(
                    ".midi"
                );


            if (!isMidi) {

                return;

            }


            /*
             * 優先:
             *
             * ①MIDIメロディー
             * MIDIメロディー
             * メロディー
             */

            if (

                relativePath.includes(
                    "メロディ"
                )

            ) {


                melodyFile =
                    zipEntry;

            }


        }

    );


    // ====================================
    // 名前で判定できなかった場合
    // MIDIが1個だけならそれを使用
    // ====================================

    if (!melodyFile) {


        const midiFiles =
            [];


        zip.forEach(

            function(
                relativePath,
                zipEntry
            ) {


                if (
                    zipEntry.dir
                ) {

                    return;

                }


                const name =
                    relativePath
                        .toLowerCase();


                if (

                    name.endsWith(
                        ".mid"
                    )

                    ||

                    name.endsWith(
                        ".midi"
                    )

                ) {


                    midiFiles.push(
                        zipEntry
                    );


                }

            }

        );


        if (
            midiFiles.length === 1
        ) {


            melodyFile =
                midiFiles[0];


        }

    }


    if (!melodyFile) {


        throw new Error(
            "メロディーMIDIをZIP内から見つけられません"
        );


    }


    status.textContent =
        "メロディーMIDIを解析しています…";


    const midiArrayBuffer =
        await melodyFile.async(
            "arraybuffer"
        );


    return new Midi(
        midiArrayBuffer
    );

}


// ========================================
// MIDIノート取得
// ========================================

function getMelodyNotes(
    midi
) {


    let notes =
        [];


    /*
     * MIDI内の全トラックを見る。
     *
     * ZIPからすでに
     * 「メロディーMIDI」を選んでいるため、
     * このファイル内のノートを使用。
     */

    midi.tracks.forEach(

        function(track) {


            track.notes.forEach(

                function(note) {


                    notes.push(
                        note
                    );


                }

            );


        }

    );


    notes.sort(

        function(a, b) {

            return a.time
                -
                b.time;

        }

    );


    if (
        notes.length === 0
    ) {


        throw new Error(
            "MIDIに音符がありません"
        );


    }


    return notes;

}


// ========================================
// 残響
// ========================================

function connectWithReverb(
    sourceGain
) {


    /*
     * 今日完成した残響を
     * Web Audioで再現。
     *
     * 90ms  0.34
     * 220ms 0.27
     * 420ms 0.21
     * 680ms 0.16
     * 950ms 0.12
     * 1250ms 0.085
     * 1550ms 0.055
     */


    sourceGain.connect(
        masterGain
    );


    const reflections = [

        [0.09, 0.34],

        [0.22, 0.27],

        [0.42, 0.21],

        [0.68, 0.16],

        [0.95, 0.12],

        [1.25, 0.085],

        [1.55, 0.055]

    ];


    reflections.forEach(

        function(
            reflection
        ) {


            const delay =
                audioContext
                    .createDelay(
                        2.0
                    );


            const gain =
                audioContext
                    .createGain();


            delay.delayTime.value =
                reflection[0];


            gain.gain.value =
                reflection[1];


            sourceGain.connect(
                delay
            );


            delay.connect(
                gain
            );


            gain.connect(
                masterGain
            );


        }

    );

}


// ========================================
// MIDIを実際に再生
// ========================================

function scheduleMidi(
    notes
) {


    stopMidiPlayback();


    const now =
        audioContext.currentTime
        +
        0.08;


    /*
     * MIDI冒頭に空白があっても
     * 単曲試聴では最初の音を0秒にする。
     */

    const firstNoteTime =
        notes[0].time;


    notes.forEach(

        function(note) {


            const sample =
                sampleBuffers[
                    note.midi
                ];


            if (!sample) {

                console.warn(
                    "音源なし:",
                    note.midi
                );

                return;

            }


            const source =
                audioContext
                    .createBufferSource();


            source.buffer =
                sample.buffer;


            const noteGain =
                audioContext
                    .createGain();


            /*
             * Velocityは
             * MIDI値に関係なく最大。
             */

            const MAX_VELOCITY_GAIN =
                1.0;


            const startTime =

                now
                +
                (
                    note.time
                    -
                    firstNoteTime
                );


            const noteDuration =
                Math.max(
                    0.03,
                    note.duration
                );


            const releaseEnd =

                startTime
                +
                noteDuration
                +
                RELEASE_TIME;


            /*
             * 15ms立ち上がり
             */

            noteGain.gain
                .setValueAtTime(
                    0,
                    startTime
                );


            noteGain.gain
                .linearRampToValueAtTime(

                    MAX_VELOCITY_GAIN,

                    startTime
                    +
                    ATTACK_TIME

                );


            /*
             * MIDIの長さを維持
             */

            noteGain.gain
                .setValueAtTime(

                    MAX_VELOCITY_GAIN,

                    startTime
                    +
                    noteDuration

                );


            /*
             * 18msで自然に終了
             */

            noteGain.gain
                .linearRampToValueAtTime(

                    0,

                    releaseEnd

                );


            source.connect(
                noteGain
            );


            connectWithReverb(
                noteGain
            );


            /*
             * 音源自体は
             * 発音開始位置から再生。
             */

            source.start(

                startTime,

                sample.startOffset

            );


            /*
             * MIDIノート終了後
             * 18msだけ余韻を残して停止。
             */

            const availableDuration =

                sample.buffer.duration
                -
                sample.startOffset;


            const requestedDuration =

                noteDuration
                +
                RELEASE_TIME
                +
                0.03;


            const stopAfter =

                Math.min(

                    availableDuration,

                    requestedDuration

                );


            source.stop(

                startTime
                +
                stopAfter

            );


            activeSources.push(
                source
            );


        }

    );


    const lastNote =
        notes[
            notes.length - 1
        ];


    const totalDuration =

        (
            lastNote.time
            -
            firstNoteTime
        )

        +
        lastNote.duration
        +
        1.55;


    status.textContent =
        selectedTestPlayer.name
        +
        " MIDI再生中";


    midiPlayButton.textContent =
        "▶ 最初から再生";


    stopButton.style.display =
        "block";


    setTimeout(

        function() {


            if (
                activeSources.length > 0
            ) {


                status.textContent =
                    "再生終了";


                stopButton.style.display =
                    "none";


                activeSources =
                    [];


            }


        },

        totalDuration
        *
        1000
        +
        300

    );

}


// ========================================
// 停止
// ========================================

function stopMidiPlayback() {


    activeSources.forEach(

        function(source) {


            try {


                source.stop();


            }
            catch (error) {


                // すでに停止済みなら無視


            }


        }

    );


    activeSources =
        [];


    if (stopButton) {

        stopButton.style.display =
            "none";

    }

}


// ========================================
// MIDI再生ボタン
// ========================================

async function playTestMidi() {


    if (!selectedTestPlayer) {

        return;

    }


    try {


        midiPlayButton.disabled =
            true;


        stopMidiPlayback();


        await prepareAudioContext();


        // MIDI ZIP
        const midi =
            await loadMelodyMidi(
                selectedTestPlayer
            );


        // ノート取得
        const notes =
            getMelodyNotes(
                midi
            );


        console.log(
            "MIDIノート数:",
            notes.length
        );


        console.log(
            "MIDI範囲:",
            Math.min(
                ...notes.map(
                    note =>
                        note.midi
                )
            ),
            "～",
            Math.max(
                ...notes.map(
                    note =>
                        note.midi
                )
            )
        );


        // 必要音源
        await loadRequiredSamples(
            notes
        );


        status.textContent =
            "再生準備完了";


        // 再生
        scheduleMidi(
            notes
        );


    }
    catch (error) {


        console.error(
            "MIDI再生エラー:",
            error
        );


        status.textContent =
            "エラー："
            +
            error.message;


        alert(
            "MIDIを再生できませんでした。\n\n"
            +
            error.message
        );


    }
    finally {


        midiPlayButton.disabled =
            false;


    }

}


// ========================================
// イベント
// ========================================

searchInput.addEventListener(

    "input",

    searchTestPlayers

);


clearButton.addEventListener(

    "click",

    clearSearch

);


midiPlayButton.addEventListener(

    "click",

    playTestMidi

);


stopButton.addEventListener(

    "click",

    function() {


        stopMidiPlayback();


        status.textContent =
            "停止しました";


    }

);

// players.js読み込み完了
// ========================================

window.addEventListener(

    "playersLoaded",

    function() {


        console.log(
            "実験ページ：選手データ準備完了"
        );


        if (
            searchInput.value.trim()
            !== ""
        ) {


            searchTestPlayers();


        }


    }

);
