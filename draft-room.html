<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>みんなでドラフト | OUENKA BASE</title><link rel="stylesheet" href="site-theme.css"><link rel="stylesheet" href="play.css"><style>body{margin:0}main{max-width:820px;margin:auto;padding:14px}header{background:#092b4c;color:white;padding:14px;display:flex;justify-content:space-between;align-items:center}header a{color:white}.panel{padding:16px;margin:12px 0;border-radius:14px;background:var(--panel,#fff);box-shadow:0 2px 12px #0001}label{display:block;margin:12px 0}input,select{display:block;width:100%;padding:12px;margin-top:6px;box-sizing:border-box}button{min-height:44px;margin:4px;padding:9px 15px;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.member,.song{border:1px solid #cbd5e1;padding:12px;border-radius:9px;margin:6px 0}.song{display:flex;justify-content:space-between;align-items:center;gap:8px}.song button{flex-shrink:0}.muted{color:#667085;font-size:.88rem}.code{font-size:32px;letter-spacing:8px;font-weight:800}#notice{min-height:28px}#pool{max-height:430px;overflow:auto}h1{font-size:24px}h2{font-size:19px}button:disabled{opacity:.4}[hidden]{display:none!important}</style><script src="site-theme.js" defer></script></head><body><header><a href="draft.html">◀ 戻る</a><b>みんなでドラフト</b></header><main><h1>ルームマッチ</h1><p id="notice" role="status" aria-live="polite">ルームを作成するか、コードで参加してください。</p><section class="panel" id="entry"><details><summary>ルーム通信設定（初回のみ）</summary><label>ルーム用Worker URL<input id="endpoint" type="url" placeholder="https://example.workers.dev/api/room-draft"></label><button id="saveEndpoint">通信先を保存</button></details><label>プレイヤー名<input id="name" maxlength="24" value="プレイヤー"></label><label>候補曲数<select id="count"><option>30</option><option selected>50</option><option>70</option><option>100</option></select></label><button id="create">ルームを作成</button><hr><label>4桁のルームコード<input id="code" maxlength="4" inputmode="numeric" placeholder="1234"></label><button id="join">ルームに参加</button><button id="resume" hidden>前のルームに戻る</button></section><section id="room" hidden><div class="panel"><div class="row"><div>ルームコード <div class="code" id="roomCode"></div></div><button id="copy">コードをコピー</button></div><div id="members"></div><div id="hostControls" hidden><label>CPU人数<select id="cpu"><option>0</option><option>1</option><option>2</option><option>3</option></select></label><button id="addCpu">CPU人数を反映</button><button id="start">50曲を抽選して開始</button></div><p id="lobbyNote" class="muted">全員の参加を待っています。4人そろうと開始できます。</p></div><section class="panel" id="draft" hidden><h2 id="round"></h2><p id="state"></p><label>応援歌検索<input id="search" placeholder="選手名・球団"></label><div id="pool"></div></section><section class="panel" id="results" hidden><h2>ドラフト結果</h2><div id="reveal"></div><h3>獲得曲</h3><div id="rosters"></div></section></section></main><script src="draft-room.js"></script></body></html>
