<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#ffffff">

    <link rel="manifest" href="manifest.json">

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>応援歌BASE</title>

</head>


<body>


    <!-- =====================================
         サイトタイトル
    ====================================== -->

    <h1>応援歌BASE</h1>

    <p class="subtitle">
        選手を検索して応援歌を再生
    </p>



    <!-- =====================================
         選手検索エリア
    ====================================== -->

    <div class="player">

        <h2>選手一覧</h2>


        <input
            type="text"
            id="searchInput"
            placeholder="選手名を検索"
            oninput="searchPlayers()"
            autocomplete="off"
        >


        <div id="playerButtons"></div>


        <div id="nowPlaying">
            選手を検索してください
        </div>


        <div id="lyricsArea">

            <h3 id="lyricsTitle"></h3>

            <div id="lyrics"></div>

        </div>


        <!-- =================================
             更新ボタン
        ================================== -->

        <button
            type="button"
            onclick="updateApp()"
            style="
                margin-top:30px;
                padding:10px 20px;
                border:none;
                border-radius:10px;
                cursor:pointer;
            "
        >
            🔄 最新版に更新
        </button>


    </div>



    <!-- =====================================
         JavaScript
    ====================================== -->

    <script src="players.js"></script>

    <script src="player.js"></script>

    <script src="search.js"></script>

    <!-- =====================================
         Service Worker
    ====================================== -->

    <script>

        // ====================================
        // Service Worker登録
        // ====================================

        if ("serviceWorker" in navigator) {

            window.addEventListener("load", async () => {

                try {

                    const registration =
                        await navigator.serviceWorker.register(
                            "./service-worker.js"
                        );

                    // サーバーに新しいService Workerが
                    // ないか毎回確認
                    await registration.update();

                    console.log(
                        "Service Worker確認完了"
                    );

                } catch (error) {

                    console.error(
                        "Service Worker登録エラー:",
                        error
                    );

                }

            });

        }



        // ====================================
        // 最新版に更新
        // ====================================

        async function updateApp() {

            try {

                // Service Workerを取得
                if ("serviceWorker" in navigator) {

                    const registrations =
                        await navigator.serviceWorker.getRegistrations();

                    // Service Worker解除
                    for (const registration of registrations) {

                        await registration.unregister();

                    }

                }


                // Cache Storageを削除
                if ("caches" in window) {

                    const cacheNames =
                        await caches.keys();

                    for (const cacheName of cacheNames) {

                        await caches.delete(cacheName);

                    }

                }


                // URLを変えて強制的に最新版を取得
                const url =
                    new URL(window.location.href);

                url.searchParams.set(
                    "_update",
                    Date.now()
                );

                window.location.replace(
                    url.toString()
                );


            } catch (error) {

                console.error(
                    "更新エラー:",
                    error
                );

                // 万一エラーでも再読み込み
                window.location.reload();

            }

        }

    </script>


</body>

</html>
