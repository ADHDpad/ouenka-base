<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>応援歌BASE</title>

</head>


<body>


    <!-- =====================================
         上部メニュー
    ====================================== -->

    <header class="top-menu">

        <button
            type="button"
            class="top-menu-button"
            onclick="updateApp()"
        >
            🔄 更新
        </button>


        <button
            type="button"
            class="top-menu-button"
            onclick="showComingSoon()"
        >
            後日追加予定
        </button>

    </header>



    <!-- =====================================
         サイトタイトル
    ====================================== -->

    <section class="site-header">

        <div class="site-icon">
            ♪
        </div>


        <div class="site-title-area">

            <h1>
                応援歌BASE
            </h1>

            <p class="subtitle">
                選手を検索して応援歌を再生
            </p>

        </div>

    </section>



    <!-- =====================================
         メイン
    ====================================== -->

    <main>


        <!-- =================================
             選手名から検索
        ================================== -->

        <section class="search-area-container">


            <!-- 紺色の箱の外 -->

            <h2 class="search-title">
                選手名から検索
            </h2>



            <!-- 紺色の検索エリア -->

            <div class="search-section">


                <!-- 検索ボックス -->

                <div class="search-area">

                    <div class="search-input-wrapper">

                        <input
                            type="text"
                            id="searchInput"
                            placeholder="選手名を検索"
                            oninput="searchPlayers()"
                            autocomplete="off"
                        >


                        <button
                            type="button"
                            id="clearSearchButton"
                            onclick="clearSearch()"
                            aria-label="検索文字を消す"
                        >
                            ×
                        </button>

                    </div>



                    <!-- 検索候補 -->

                    <div
                        id="searchSuggestions"
                    ></div>

                </div>



                <!-- 選手選択後の3ボタン -->

                <div
                    id="playerButtons"
                ></div>



                <!-- 再生中 -->

                <div
                    id="nowPlaying"
                >
                    選手を検索してください
                </div>



                <!-- 歌詞 -->

                <div
                    id="lyricsArea"
                >

                    <h3
                        id="lyricsTitle"
                    ></h3>


                    <div
                        id="lyrics"
                    ></div>

                </div>


            </div>

        </section>



        <!-- =================================
             球団から探す
        ================================== -->

        <section class="team-section">

            <h2>
                球団から探す
            </h2>



            <!-- リーグ名 -->

            <div class="league-headings">

                <div class="league-heading">
                    パ・リーグ
                </div>

                <div class="league-heading">
                    セ・リーグ
                </div>

            </div>



            <!-- =================================
                 左：パ・リーグ
                 右：セ・リーグ
            ================================== -->

            <div class="team-grid">


                <!-- 1段目 -->

                <button
                    type="button"
                    class="team-button softbank"
                >
                    福岡ソフトバンク<br>
                    ホークス
                </button>


                <button
                    type="button"
                    class="team-button giants"
                >
                    読売<br>
                    ジャイアンツ
                </button>



                <!-- 2段目 -->

                <button
                    type="button"
                    class="team-button fighters"
                >
                    北海道日本ハム<br>
                    ファイターズ
                </button>


                <button
                    type="button"
                    class="team-button tigers"
                >
                    阪神<br>
                    タイガース
                </button>



                <!-- 3段目 -->

                <button
                    type="button"
                    class="team-button buffaloes"
                >
                    オリックス<br>
                    バファローズ
                </button>


                <button
                    type="button"
                    class="team-button baystars"
                >
                    横浜DeNA<br>
                    ベイスターズ
                </button>



                <!-- 4段目 -->

                <button
                    type="button"
                    class="team-button eagles"
                >
                    東北楽天<br>
                    ゴールデンイーグルス
                </button>


                <button
                    type="button"
                    class="team-button carp"
                >
                    広島東洋<br>
                    カープ
                </button>



                <!-- 5段目 -->

                <button
                    type="button"
                    class="team-button lions"
                >
                    埼玉西武<br>
                    ライオンズ
                </button>


                <button
                    type="button"
                    class="team-button swallows"
                >
                    東京ヤクルト<br>
                    スワローズ
                </button>



                <!-- 6段目 -->

                <button
                    type="button"
                    class="team-button marines"
                >
                    千葉ロッテ<br>
                    マリーンズ
                </button>


                <button
                    type="button"
                    class="team-button dragons"
                >
                    中日<br>
                    ドラゴンズ
                </button>


            </div>

        </section>


    </main>



    <!-- =====================================
         JavaScript
    ====================================== -->

    <script src="players.js"></script>

    <script src="player.js"></script>

    <script src="search.js"></script>



    <!-- =====================================
         Service Worker
    ====================================== -->

    <script>

        if (
            "serviceWorker"
            in navigator
        ) {

            window.addEventListener(
                "load",
                async () => {

                    try {

                        const registration =
                            await navigator
                                .serviceWorker
                                .register(
                                    "./service-worker.js"
                                );


                        await registration
                            .update();


                        console.log(
                            "Service Worker確認完了"
                        );

                    }

                    catch (error) {

                        console.error(
                            "Service Worker登録エラー:",
                            error
                        );

                    }

                }
            );

        }



        // ====================================
        // 最新版に更新
        // ====================================

        async function updateApp() {

            try {

                if (
                    "serviceWorker"
                    in navigator
                ) {

                    const registrations =
                        await navigator
                            .serviceWorker
                            .getRegistrations();


                    for (
                        const registration
                        of registrations
                    ) {

                        await registration
                            .unregister();

                    }

                }


                if (
                    "caches"
                    in window
                ) {

                    const cacheNames =
                        await caches.keys();


                    for (
                        const cacheName
                        of cacheNames
                    ) {

                        await caches.delete(
                            cacheName
                        );

                    }

                }


                const url =
                    new URL(
                        window.location.href
                    );


                url.searchParams.set(
                    "_update",
                    Date.now()
                );


                window.location.replace(
                    url.toString()
                );

            }

            catch (error) {

                console.error(
                    "更新エラー:",
                    error
                );


                window.location.reload();

            }

        }



        // ====================================
        // 後日追加予定
        // ====================================

        function showComingSoon() {

            alert(
                "この機能は後日追加予定です"
            );

        }

    </script>


</body>

</html>
