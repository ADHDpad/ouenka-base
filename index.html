<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta name="theme-color" content="#ffffff">

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>応援歌BASE</title>

</head>


<body>


    <!-- =====================================
         サイトタイトル
    ====================================== -->

    <h1>応援歌BASE</h1>

    <p class="subtitle">
        選手を検索して応援歌を再生
    </p>



    <!-- =====================================
         選手検索エリア
    ====================================== -->

    <div class="player">

        <h2>選手検索</h2>


        <!-- 検索ボックス全体 -->
        <div
            class="search-area"
            style="
                position: relative;
                width: 100%;
                max-width: 400px;
                margin: 0 auto;
            "
        >

            <!-- 検索入力 -->
            <input
                type="text"
                id="searchInput"
                placeholder="選手名を検索"
                oninput="searchPlayers()"
                autocomplete="off"
            >


            <!-- 検索候補 -->
            <div
                id="searchSuggestions"
                style="
                    display: none;
                    position: absolute;
                    top: 100%;
                    left: 0;
                    right: 0;
                    background: white;
                    border: 1px solid #cccccc;
                    border-radius: 0 0 10px 10px;
                    overflow: hidden;
                    z-index: 1000;
                    text-align: left;
                "
            ></div>

        </div>


        <!-- 選択された選手 -->
        <div id="playerButtons"></div>


        <div id="nowPlaying">
            選手を検索してください
        </div>


        <div id="lyricsArea">

            <h3 id="lyricsTitle"></h3>

            <div id="lyrics"></div>

        </div>



        <!-- =================================
             更新ボタン
        ================================== -->

        <button
            type="button"
            onclick="updateApp()"
            style="
                margin-top:30px;
                padding:10px 20px;
                border:none;
                border-radius:10px;
                cursor:pointer;
            "
        >
            🔄 最新版に更新
        </button>


    </div>



    <!-- =====================================
         JavaScript
    ====================================== -->

    <script src="players.js"></script>

    <script src="player.js"></script>

    <script src="search.js"></script>



    <!-- =====================================
         Service Worker
    ====================================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                async () => {

                    try {

                        const registration =
                            await navigator
                                .serviceWorker
                                .register(
                                    "./service-worker.js"
                                );


                        await registration.update();


                        console.log(
                            "Service Worker確認完了"
                        );

                    }

                    catch (error) {

                        console.error(
                            "Service Worker登録エラー:",
                            error
                        );

                    }

                }
            );

        }



        // ====================================
        // 最新版に更新
        // ====================================

        async function updateApp() {

            try {

                if (
                    "serviceWorker"
                    in navigator
                ) {

                    const registrations =
                        await navigator
                            .serviceWorker
                            .getRegistrations();


                    for (
                        const registration
                        of registrations
                    ) {

                        await registration
                            .unregister();

                    }

                }


                if (
                    "caches"
                    in window
                ) {

                    const cacheNames =
                        await caches.keys();


                    for (
                        const cacheName
                        of cacheNames
                    ) {

                        await caches.delete(
                            cacheName
                        );

                    }

                }


                const url =
                    new URL(
                        window.location.href
                    );


                url.searchParams.set(
                    "_update",
                    Date.now()
                );


                window.location.replace(
                    url.toString()
                );

            }

            catch (error) {

                console.error(
                    "更新エラー:",
                    error
                );


                window.location.reload();

            }

        }

    </script>


</body>

</html>
