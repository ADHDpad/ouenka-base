    <!-- =====================================
         Service Worker
    ====================================== -->

    <script>

        if (
            "serviceWorker"
            in navigator
        ) {

            window.addEventListener(
                "load",
                async () => {

                    try {

                        const registration =
                            await navigator
                                .serviceWorker
                                .register(
                                    "./service-worker.js"
                                );


                        await registration
                            .update();


                        console.log(
                            "Service Worker確認完了"
                        );

                    }

                    catch (error) {

                        console.error(
                            "Service Worker登録エラー:",
                            error
                        );

                    }

                }
            );

        }



        // ====================================
        // 最新版に更新
        // ====================================

        async function updateApp() {

            try {

                if (
                    "serviceWorker"
                    in navigator
                ) {

                    const registrations =
                        await navigator
                            .serviceWorker
                            .getRegistrations();


                    for (
                        const registration
                        of registrations
                    ) {

                        await registration
                            .unregister();

                    }

                }


                if (
                    "caches"
                    in window
                ) {

                    const cacheNames =
                        await caches.keys();


                    for (
                        const cacheName
                        of cacheNames
                    ) {

                        await caches.delete(
                            cacheName
                        );

                    }

                }


                const url =
                    new URL(
                        window.location.href
                    );


                url.searchParams.set(
                    "_update",
                    Date.now()
                );


                window.location.replace(
                    url.toString()
                );

            }

            catch (error) {

                console.error(
                    "更新エラー:",
                    error
                );


                window.location.reload();

            }

        }

    </script>
