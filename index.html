<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>応援歌BASE</title>

</head>


<body>


    <!-- =====================================
         上部メニュー
    ====================================== -->

    <header class="top-menu">

        <button
            type="button"
            class="top-menu-button"
            onclick="updateApp()"
        >
            🔄 更新
        </button>


        <button
            type="button"
            class="top-menu-button"
            onclick="showComingSoon()"
        >
            メドレー作成
        </button>

    </header>



    <!-- =====================================
         サイトタイトル
    ====================================== -->

    <section class="site-header">

        <div class="site-icon">
            ♪
        </div>


        <div class="site-title-area">

            <h1>
                応援歌BASE
            </h1>

            <p class="subtitle">
                選手を検索して応援歌を再生
            </p>

        </div>

    </section>



    <!-- =====================================
         選手検索
    ====================================== -->

    <main>


        <section class="search-section">

            <h2>
                選手検索
            </h2>


            <div class="search-area">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="選手名を検索"
                    oninput="searchPlayers()"
                    autocomplete="off"
                >


                <div
                    id="searchSuggestions"
                ></div>

            </div>


            <!-- 選択した選手 -->

            <div
                id="playerButtons"
            ></div>



            <!-- 再生中 -->

            <div
                id="nowPlaying"
            >
                選手を検索してください
            </div>



            <!-- 歌詞 -->

            <div
                id="lyricsArea"
            >

                <h3
                    id="lyricsTitle"
                ></h3>


                <div
                    id="lyrics"
                ></div>

            </div>

        </section>



        <!-- =================================
             球団から探す
        ================================== -->

        <section class="team-section">

            <h2>
                球団から探す
            </h2>


            <div class="team-grid">


                <button
                    type="button"
                    class="team-button"
                >
                    広島東洋カープ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    阪神タイガース
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    横浜DeNAベイスターズ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    読売ジャイアンツ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    東京ヤクルトスワローズ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    中日ドラゴンズ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    福岡ソフトバンクホークス
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    北海道日本ハムファイターズ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    オリックス・バファローズ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    東北楽天ゴールデンイーグルス
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    埼玉西武ライオンズ
                </button>


                <button
                    type="button"
                    class="team-button"
                >
                    千葉ロッテマリーンズ
                </button>


            </div>

        </section>


    </main>



    <!-- =====================================
         JavaScript
    ====================================== -->

    <script src="players.js"></script>

    <script src="player.js"></script>

    <script src="search.js"></script>



    <!-- =====================================
         Service Worker / 更新処理
    ====================================== -->

    <script>

        if (
            "serviceWorker"
            in navigator
        ) {

            window.addEventListener(
                "load",
                async () => {

                    try {

                        const registration =
                            await navigator
                                .serviceWorker
                                .register(
                                    "./service-worker.js"
                                );


                        await registration
                            .update();


                        console.log(
                            "Service Worker確認完了"
                        );

                    }

                    catch (error) {

                        console.error(
                            "Service Worker登録エラー:",
                            error
                        );

                    }

                }
            );

        }



        // ====================================
        // 最新版に更新
        // ====================================

        async function updateApp() {

            try {

                if (
                    "serviceWorker"
                    in navigator
                ) {

                    const registrations =
                        await navigator
                            .serviceWorker
                            .getRegistrations();


                    for (
                        const registration
                        of registrations
                    ) {

                        await registration
                            .unregister();

                    }

                }


                if (
                    "caches"
                    in window
                ) {

                    const cacheNames =
                        await caches.keys();


                    for (
                        const cacheName
                        of cacheNames
                    ) {

                        await caches.delete(
                            cacheName
                        );

                    }

                }


                const url =
                    new URL(
                        window.location.href
                    );


                url.searchParams.set(
                    "_update",
                    Date.now()
                );


                window.location.replace(
                    url.toString()
                );

            }

            catch (error) {

                console.error(
                    "更新エラー:",
                    error
                );


                window.location.reload();

            }

        }



        // ====================================
        // 今後追加する機能
        // ====================================

        function showComingSoon() {

            alert(
                "メドレー作成功能は今後追加予定です"
            );

        }

    </script>


</body>

</html>
