<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>応援歌BASE 音声診断</title><style>body{font-family:system-ui,sans-serif;max-width:650px;margin:24px auto;padding:16px;color:#142b43}button{padding:13px;margin:6px 0;width:100%;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f4f8;padding:12px;border-radius:8px}a{color:#164c8d}</style></head><body><h1>iPhone 音声診断</h1><p>音が鳴るか確認し、診断結果をコピーして送ってください。既存の再生処理や保存データは変更しません。</p><button id="tone">① テスト音を鳴らす（1秒）</button><button id="check">② 音声環境を調べる</button><button id="copy">③ 診断結果をコピー</button><pre id="log" aria-live="polite">まだ診断していません。</pre><p><a href="settings.html">設定へ戻る</a></p><script src="audio-recovery.js?v=55"></script><script>
let log=[];let testCtx=null;const out=document.getElementById('log');function add(s){log.push(new Date().toISOString()+' '+s);out.textContent=log.join('\n')}function err(e){return e?.name+': '+e?.message}
function info(){let r=window.ouenkaAudioRecovery?.diagnostics?.();add('URL='+location.href);add('userAgent='+navigator.userAgent);add('secure='+isSecureContext+' visibility='+document.visibilityState);add('AudioContext='+!!(window.AudioContext||window.webkitAudioContext));add('recovery='+JSON.stringify(r));add('testContext='+ (testCtx?.state||'なし'));add('audioOutput='+(navigator.mediaDevices?.enumerateDevices?'APIあり':'APIなし'));}
document.getElementById('check').onclick=()=>{log=[];info()};
document.getElementById('tone').onclick=async()=>{log=[];info();try{if(testCtx&&testCtx.state!=='closed')await testCtx.close();const AC=window.AudioContext||window.webkitAudioContext;testCtx=new AC();add('created state='+testCtx.state+' sampleRate='+testCtx.sampleRate);const o=testCtx.createOscillator(),g=testCtx.createGain();o.type='sine';o.frequency.value=440;g.gain.value=0.08;o.connect(g);g.connect(testCtx.destination);o.start();o.stop(testCtx.currentTime+1);const resume=testCtx.resume();await Promise.race([resume,new Promise((_,reject)=>setTimeout(()=>reject(new Error('resume timeout')),3000))]);add('after resume='+testCtx.state);o.onended=()=>{add('tone ended currentTime='+testCtx.currentTime);testCtx.close().catch(()=>{})};}catch(e){add('ERROR '+err(e))}};
document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);add('コピーしました')}catch(e){add('コピー失敗: '+err(e))}};
</script></body></html>
