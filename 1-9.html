<style>
*{box-sizing:border-box}
:root{--navy:#071d33;--navy2:#0B2F55;--blue:#0b84f3;--line:#cbd5df;--soft:#eef3f7;--text:#0b2b4a;--yellow:#ffd93d}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#fff;color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:100;min-height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#071d33;color:#fff;border-bottom:1px solid rgba(255,255,255,.10)}

.position,.player-search,.move-handle{height:52px;border:1px solid #c8d2dc;border-radius:9px;background:#fff;color:var(--text)}
.position{width:100%;padding:0 9px;font-size:13px;font-weight:500}
.search-wrap{position:relative;min-width:0}
.player-search{width:100%;padding:0 12px 0 40px;font-size:16px}
.search-icon{position:absolute;left:13px;top:26px;transform:translateY(-50%);font-size:21px;color:#687d91;pointer-events:none}
.clear{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:#526575;font-size:22px;font-weight:700;line-height:1;padding:0;display:flex;align-items:center;justify-content:center;z-index:3}.player-search{padding-right:40px}
.move-handle{width:100%;border:0;position:relative;z-index:20;pointer-events:auto;background:transparent;color:#41576a;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.move-handle:active{cursor:grabbing}.player-row.dragging{position:relative;z-index:50;opacity:.92;box-shadow:0 12px 26px rgba(7,29,51,.28);background:#fff;border-radius:10px;will-change:transform}.lineup.drag-active{user-select:none;-webkit-user-select:none}.lineup.drag-active .player-row:not(.dragging){transition:transform .08s ease}
.suggestions{display:none;position:absolute;left:0;right:0;top:55px;z-index:60;background:#fff;border:1px solid #c8d2dc;border-radius:9px;max-height:220px;overflow:auto;box-shadow:0 10px 24px rgba(7,29,51,.2)}
.suggestion{display:block;width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.16);background:#174A7A;text-align:left;padding:11px 13px;color:#fff}
.suggestion:hover,.suggestion:focus{background:#0F3B66}.suggestion strong{color:#fff}.suggestion small{display:block;color:#dbe9f5!important;margin-top:2px}
.add-row-wrap{padding:2px 14px 10px}.add-row{width:100%;min-height:48px;border:1.5px dashed #7aa8ca;border-radius:10px;background:#f2f8fc;color:#0B2F55;font-weight:900;font-size:15px}

.row-warning{outline:2px solid #e0a000;outline-offset:2px;border-radius:10px}
#yearSelect,#teamSelect{background:#fff!important;border:1px solid #c4cfda;color:#0b2b4a}
.position{background:#EAF6FF!important;color:#0b2b4a!important;border-color:#A9CDE8!important}
.player-search,#lineupTitle{background:#EAF6FF!important;border-color:#A9CDE8!important}
.position.has-value,.player-search.has-value,#lineupTitle.has-value{background:#fff!important}
.position:focus,.player-search:focus,#lineupTitle:focus{background:#F3FAFF!important;border-color:#4E91C4!important;outline:none;box-shadow:0 0 0 3px rgba(78,145,196,.12)}
.position option{background:#fff;color:#0b2b4a}
.position option.opt-pitcher{background:#FDE2E2;color:#8B1E1E}.position option.opt-catcher{background:#E0ECFF;color:#174C91}
.position option.opt-infield{background:#E1F4E5;color:#27643A}.position option.opt-outfield{background:#FFF4C7;color:#715B00}
.position option.opt-dh{background:#EFE3FA;color:#5D3480}.position option.opt-pinch{background:#FCE3EF;color:#8C2E5B}
#medleyPlayButton{background:#0B4F7A;color:#fff}
@media(max-width:760px){
 .topbar{min-height:66px;padding:0 10px}.top-brand-title{font-size:16px}.top-brand-sub{font-size:8px;margin-top:5px}.back{min-height:40px;padding:0 11px;font-size:12px}
 .page{padding:9px 7px 22px}.hero{padding:15px 7px}.filters{gap:5px;padding:7px}.control,.chat{min-height:47px;padding:0 4px;font-size:11px;font-weight:500}
 .title-row{grid-template-columns:98px 1fr;padding:8px 8px;gap:5px}.title-row label{font-size:13px}.title-row input{font-size:16px}
 .lineup{padding:7px 5px 4px}.player-row{grid-template-columns:28px 72px minmax(0,1fr) 34px;gap:3px;margin-bottom:4px}
 .order{height:42px;border-radius:7px;font-size:16px}.position,.player-search,.move-handle{height:42px;border-radius:7px}.position{font-size:9px;font-weight:400;padding:0 1px}
 .player-search{font-size:16px;padding:0 35px 0 23px}.search-icon{left:6px;top:21px;font-size:14px}.clear{right:3px;width:30px;height:30px;font-size:20px}.move-handle{font-size:21px}
 .suggestions{top:45px}.add-row-wrap{padding:2px 5px 8px}.add-row{min-height:42px;font-size:13px}.bottom-actions{grid-template-columns:.8fr 1.6fr;gap:5px;padding:2px 5px 11px}.action{min-height:50px;font-size:12px;padding:4px}
 .preview-item{grid-template-columns:30px 70px 1fr;padding:9px 10px}.preview-pos{font-size:11px}
}

.drag-placeholder{border:2px dashed #6f8496;border-radius:10px;background:rgba(11,47,85,.08);box-sizing:border-box}
.drag-ghost{opacity:.94;box-shadow:0 14px 30px rgba(7,29,51,.30);background:#fff;border-radius:10px;box-sizing:border-box}
body.row-dragging{user-select:none;-webkit-user-select:none}


.drag-placeholder{border:2px dashed #60788d!important;border-radius:10px!important;background:rgba(11,47,85,.10)!important;box-sizing:border-box}

body.row-dragging{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
body.row-dragging *{cursor:grabbing!important}
</style>

<body>
<header class="topbar">
 <div class="top-brand"><div class="top-brand-title">OUENKA BASE</div><div class="top-brand-sub">DATA REGISTER SYSTEM</div></div>
 <button class="back" type="button" onclick="location.href='./index.html'">← BASEに戻る</button>
</header>
<main class="page">
 <section class="hero"><h1>1-9作成</h1><p>選手を検索して1-9を作成できます。</p></section>
 <section class="panel">
  <div class="filters">
   <select id="yearSelect" class="control"><option value="" selected disabled hidden>📅 年度選択</option></select>
   <select id="teamSelect" class="control"><option value="" selected disabled hidden>⚾ 球団選択</option></select>
   <button id="chatSearch" class="chat" type="button">✦ ChatGPTで検索</button>
  </div>
  <div class="title-row"><label for="lineupTitle">1-9タイトル</label><input id="lineupTitle" type="text" placeholder="例：2026 開幕スタメン / ベストナイン など"></div>
  <div id="lineup" class="lineup"></div>
  <div class="add-row-wrap"><button id="addButton" class="add-row" type="button">＋ 枠を追加</button></div>
  <div class="bottom-actions">
   <button id="resetButton" class="action reset" type="button">↻ リセット</button>
   <button id="medleyPlayButton" class="action create" type="button">▶ 1-9を作成・再生</button>
  </div>
  <div id="status" class="status"></div>
  <section id="previewCard" class="preview-card">
   <div class="preview-head">1-9 プレビュー</div><div id="previewMeta" class="preview-meta"></div><ol id="previewList" class="preview-list"></ol>
  </section>
 </section>
</main>

<script>
"use strict";

/* =========================================================
   OUENKA BASE / 1-9
   2026-10-05 正式ジャッキ方式

   【正式仕様】
   ・BPM 170 / 4拍子
   ・1小節 = 60 / 170 * 4 = 1.41176470588秒
   ・次曲は前曲の9小節目の頭から開始
   ・したがって開始間隔 = 8小節 = 11.2941176471秒
   ・次曲の1小節目が無音でも削らない
   ・前曲9小節目と次曲1小節目は両方の音を残して加算
   ・クロスフェードしない
   ・曲別の音量補正をしない
   ・重複音は両方残し、最終ミックスだけ自動音量調整
   ・最終出力のクリップ防止だけ ±0.98 で制限
========================================================= */

const DATA_API="https://ouenka-base-data.ninzin5600.workers.dev";
const OUENKA_PUBLIC_BASE="https://adhdpad.github.io/ouenka-base/";
const STORAGE_KEY="ouenkaBaseOneNineDraftV1";
const MAX_SUGGESTIONS=10;

const MEDLEY_BPM=170;
const MEDLEY_BEATS_PER_BAR=4;
const MEDLEY_BAR_SEC=(60/MEDLEY_BPM)*MEDLEY_BEATS_PER_BAR;
const MEDLEY_INTERVAL_SEC=MEDLEY_BAR_SEC*8; // 9小節目の頭
const MEDLEY_LIMIT=0.98;

const positions=["ポジション選択","投手","捕手","一塁手","二塁手","三塁手","遊撃手","左翼手","中堅手","右翼手","指名打者","代打"];
const rowSearchRequests={};
let rowCount=9;
let rowAudio=null;
let currentPlayingRow=null;
let completedMedleyUrl=null;
let completedMedleyAudio=null;
let medleyBuilding=false;

function getName(p){return p?.player_name||p?.name||""}
function getReading(p){return p?.reading||""}
function getTeam(p){return p?.team||""}
function norm(s){return String(s||"").toLowerCase().replace(/[\s　]/g,"")}

function hideStatus(){
 const st=document.getElementById("status");
 if(!st)return;
 st.textContent="";
 st.style.display="none";
}

function setStatus(message,type="info"){
 const st=document.getElementById("status");
 st.textContent=message;st.style.display="block";
 st.style.background=type==="error"?"#fff0f0":type==="ok"?"#eefaf2":"#eef6ff";
 st.style.color=type==="error"?"#a52b2b":type==="ok"?"#1f6b3b":"#174f7e";
}

function updateInputFieldColor(el){
 if(!el)return;
 el.classList.toggle("has-value",String(el.value||"").trim()!=="");
}
function updateAllInputFieldColors(){
 document.querySelectorAll("#lineupTitle,.position,.player-search").forEach(updateInputFieldColor);
}

function createRow(n,data={}){
 const row=document.createElement("div");
 row.className="player-row";row.dataset.row=n;
 row.dataset.songId=data.songId||"";
 row.dataset.productionNumber=data.productionNumber||"";
 row.dataset.team=data.team||"";
 row.dataset.audioUrl=data.audioUrl||"";
 row.dataset.medleyUrl=data.medleyUrl||"";

 const options=positions.map((p,i)=>{
  let cls="";
  if(p==="投手")cls="opt-pitcher";
  else if(p==="捕手")cls="opt-catcher";
  else if(["一塁手","二塁手","三塁手","遊撃手"].includes(p))cls="opt-infield";
  else if(["左翼手","中堅手","右翼手"].includes(p))cls="opt-outfield";
  else if(p==="指名打者")cls="opt-dh";
  else if(p==="代打")cls="opt-pinch";
  return `<option class="${cls}" value="${i?p:""}">${p}</option>`;
 }).join("");

 row.innerHTML=`
  <button class="order" type="button" title="応援歌を再生" aria-label="${n}番の応援歌を再生">${n}</button>
  <select class="position" aria-label="${n}番のポジション">${options}</select>
  <div class="search-wrap">
   <span class="search-icon">⌕</span>
   <input class="player-search" type="text" placeholder="選手名を検索" autocomplete="off" aria-label="${n}番の選手検索">
   <button class="clear" type="button" aria-label="入力をクリア">×</button>
   <div class="suggestions"></div>
  </div>
  <button class="move-handle" type="button" title="長押しして並べ替え" aria-label="${n}番を並べ替え">☰</button>`;

 const input=row.querySelector(".player-search");
 const sug=row.querySelector(".suggestions");
 const pos=row.querySelector(".position");
 pos.value=data.position||"";
 input.value=data.name||"";

 input.addEventListener("input",()=>{
  row.dataset.songId="";row.dataset.productionNumber="";row.dataset.team="";
  row.dataset.audioUrl="";row.dataset.medleyUrl="";
  showSuggestions(row,input,sug);checkDuplicates();saveDraft();updateInputFieldColor(input);
 });
 input.addEventListener("focus",()=>showSuggestions(row,input,sug));
 pos.addEventListener("change",()=>{saveDraft();updateInputFieldColor(pos)});
 row.querySelector(".clear").addEventListener("click",()=>{
  input.value="";pos.value="";
  row.dataset.songId="";row.dataset.productionNumber="";row.dataset.team="";
  row.dataset.audioUrl="";row.dataset.medleyUrl="";
  sug.style.display="none";row.classList.remove("row-warning");
  if(currentPlayingRow===row)stopRowAudio();
  saveDraft();updateInputFieldColor(input);updateInputFieldColor(pos);
 });
 row.querySelector(".order").addEventListener("click",()=>playSelectedRow(row));

 setTimeout(()=>{updateInputFieldColor(input);updateInputFieldColor(pos)},0);
 return row;
}

function renumberRows(){
 [...document.querySelectorAll(".player-row")].forEach((row,i)=>{
  const n=i+1;row.dataset.row=n;
  const order=row.querySelector(".order"),pos=row.querySelector(".position"),input=row.querySelector(".player-search"),handle=row.querySelector(".move-handle");
  if(order){order.textContent=n;order.setAttribute("aria-label",`${n}番の応援歌を再生`)}
  if(pos)pos.setAttribute("aria-label",`${n}番のポジション`);
  if(input)input.setAttribute("aria-label",`${n}番の選手検索`);
  if(handle)handle.setAttribute("aria-label",`${n}番を並べ替え`);
 });
 rowCount=document.querySelectorAll(".player-row").length;
}
function setupRowMove(row){ /* 並べ替えはlineupへのイベント委譲で処理 */ }

function installLineupDrag(){
 const lineup=document.getElementById("lineup");
 if(!lineup||lineup.dataset.dragInstalled==="1")return;
 lineup.dataset.dragInstalled="1";

 let pointerId=null, source=null, ghost=null, placeholder=null, offsetY=0;

 function finish(){
  if(!source)return;
  if(placeholder&&placeholder.parentNode){
   placeholder.parentNode.insertBefore(source,placeholder);
   placeholder.remove();
  }
  if(ghost)ghost.remove();
  source.style.display="";
  source.classList.remove("drag-source");
  document.body.classList.remove("row-dragging");
  lineup.classList.remove("drag-active");
  pointerId=null;source=null;ghost=null;placeholder=null;
  renumberRows();
  saveDraft();
  checkDuplicates();
 }

 lineup.addEventListener("pointerdown",function(e){
  const handle=e.target.closest(".move-handle");
  if(!handle||!lineup.contains(handle))return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  const row=handle.closest(".player-row");
  if(!row)return;

  e.preventDefault();
  e.stopPropagation();
  pointerId=e.pointerId;
  source=row;

  const r=row.getBoundingClientRect();
  offsetY=e.clientY-r.top;

  placeholder=document.createElement("div");
  placeholder.className="drag-placeholder";
  placeholder.style.height=r.height+"px";
  placeholder.style.marginBottom=getComputedStyle(row).marginBottom;
  lineup.insertBefore(placeholder,row);

  ghost=row.cloneNode(true);
  ghost.classList.add("drag-ghost");
  Object.assign(ghost.style,{
   position:"fixed",left:r.left+"px",top:r.top+"px",width:r.width+"px",
   height:r.height+"px",zIndex:"2147483647",pointerEvents:"none",margin:"0"
  });
  document.body.appendChild(ghost);

  row.style.display="none";
  row.classList.add("drag-source");
  lineup.classList.add("drag-active");
  document.body.classList.add("row-dragging");

  try{handle.setPointerCapture(e.pointerId)}catch(err){}
 },{passive:false});

 window.addEventListener("pointermove",function(e){
  if(!source||e.pointerId!==pointerId)return;
  e.preventDefault();
  if(ghost)ghost.style.top=(e.clientY-offsetY)+"px";

  const rows=[...lineup.querySelectorAll(".player-row")].filter(x=>x!==source);
  let before=null;
  for(const item of rows){
   const r=item.getBoundingClientRect();
   if(e.clientY<r.top+r.height/2){before=item;break}
  }
  if(before)lineup.insertBefore(placeholder,before);
  else lineup.appendChild(placeholder);
 },{passive:false});

 window.addEventListener("pointerup",function(e){
  if(source&&e.pointerId===pointerId)finish();
 });
 window.addEventListener("pointercancel",function(e){
  if(source&&e.pointerId===pointerId)finish();
 });
}
function renderRows(rows=[]){
 const box=document.getElementById("lineup");box.innerHTML="";
 rowCount=Math.max(9,rows.length||9);
 for(let i=1;i<=rowCount;i++)box.appendChild(createRow(i,rows[i-1]||{}));
 renumberRows();
 installLineupDrag();
}

async function showSuggestions(row,input,box){
 const keyword=input.value.trim();
 box.innerHTML="";
 if(!keyword){box.style.display="none";return}
 const rowNo=row.dataset.row;
 const requestNo=(rowSearchRequests[rowNo]||0)+1;
 rowSearchRequests[rowNo]=requestNo;
 try{
  const response=await fetch(DATA_API+"/songs/search?q="+encodeURIComponent(keyword),{cache:"no-store"});
  if(!response.ok)throw new Error("検索データを取得できませんでした");
  const data=await response.json();
  if(rowSearchRequests[rowNo]!==requestNo)return;
  let songs=Array.isArray(data.songs)?data.songs:[];
  const selectedTeam=document.getElementById("teamSelect").value;
  if(selectedTeam){
   const same=songs.filter(s=>!s.team||s.team===selectedTeam);
   if(same.length)songs=same;
  }
  songs=songs.slice(0,MAX_SUGGESTIONS);
  if(!songs.length){
   const no=document.createElement("div");no.className="suggestion";no.textContent="該当する選手はいません";
   box.appendChild(no);box.style.display="block";return;
  }
  songs.forEach(song=>{
   const b=document.createElement("button");b.type="button";b.className="suggestion";
   const name=getName(song),prod=song.production_number||"";
   b.innerHTML=`<strong>${name}</strong>${prod?`<small>${getTeam(song)||""}${getTeam(song)?" / ":""}制作番号 ${prod}</small>`:""}`;
   b.addEventListener("click",()=>{
    input.value=name;
    row.dataset.songId=song.id||"";
    row.dataset.productionNumber=prod;
    row.dataset.team=getTeam(song);
    const basePath="データ/"+encodeURIComponent(song.player_name||"")+"/"+encodeURIComponent(song.production_number||"")+"/";
    row.dataset.audioUrl=basePath+encodeURIComponent(song.audio_filename||"audio.m4a");
    row.dataset.medleyUrl=basePath+encodeURIComponent(song.medley_filename||"medley.m4a");
    box.innerHTML="";box.style.display="none";
    checkDuplicates();saveDraft();updateInputFieldColor(input);
   });
   box.appendChild(b);
  });
  box.style.display="block";
 }catch(error){
  console.error("D1検索エラー:",error);
  if(rowSearchRequests[rowNo]!==requestNo)return;

async function getRegisteredSongFor19(playerName,productionNumber){
 const name=String(playerName||"").trim(),no=String(productionNumber||"").trim();
 if(!name||!no)return null;
 const candidates=[
  `${DATA_API}/song?player_name=${encodeURIComponent(name)}&production_number=${encodeURIComponent(no)}`,
  `${DATA_API}/songs?player_name=${encodeURIComponent(name)}&production_number=${encodeURIComponent(no)}`,
  `${DATA_API}/search?player_name=${encodeURIComponent(name)}&production_number=${encodeURIComponent(no)}`
 ];
 for(const url of candidates){
  try{
   const res=await fetch(url,{cache:"no-store"});if(!res.ok)continue;
   const data=await res.json();let song=null;
   if(data?.song)song=data.song;
   else if(Array.isArray(data?.songs))song=data.songs.find(x=>String(x.player_name||x.name||"")===name&&String(x.production_number||x.productionNumber||"")===no)||data.songs[0]||null;
   else if(Array.isArray(data))song=data.find(x=>String(x.player_name||x.name||"")===name&&String(x.production_number||x.productionNumber||"")===no)||data[0]||null;
   else if(data&&(data.player_name||data.name))song=data;
   if(song)return song;
  }catch(e){}
 }
 try{
  const res=await fetch(`${DATA_API}/songs`,{cache:"no-store"});
  if(res.ok){
   const data=await res.json();
   const list=Array.isArray(data)?data:Array.isArray(data.songs)?data.songs:Array.isArray(data.items)?data.items:[];
   return list.find(x=>String(x.player_name||x.name||"")===name&&String(x.production_number||x.productionNumber||"")===no)||null;
  }
 }catch(e){}
 return null;
}

function toPublicAudioUrl(path){
 if(!path)return "";
 if(/^https?:\/\//i.test(path))return path;
 return new URL(path,OUENKA_PUBLIC_BASE).href;

async function fetchDecodeAudio(ctx,path){
 if(!path)throw new Error("登録音源情報を取得できませんでした。");

 const response=await fetch(url,{cache:"no-store",credentials:"omit"});
 if(!response.ok)throw new Error(`音源取得失敗 (${response.status})：${url}`);
 const arrayBuffer=await response.arrayBuffer();
 return await ctx.decodeAudioData(arrayBuffer.slice(0));
}

/* 保存済み音源の場所を自動探索する。
   旧データ／手動配置データでも melody.m4a と accompaniment.m4a があれば使える。 */
function separatedAudioCandidates(item,fileName){
 const name=String(item.name||item.playerName||"").trim();
 const no=String(item.productionNumber||"").trim();
 const root=OUENKA_PUBLIC_BASE+"%E3%83%87%E3%83%BC%E3%82%BF/";
 const n=encodeURIComponent(name),p=encodeURIComponent(no),f=encodeURIComponent(fileName);
 const list=[];
 const registered=fileName==="melody.m4a"?item.melodyUrl:
                  fileName==="accompaniment.m4a"?item.accompanimentUrl:
                  fileName==="intro_melody.m4a"?item.introMelodyUrl:
                  fileName==="intro_accompaniment.m4a"?item.introAccompanimentUrl:"";
 if(registered)list.push(registered);
 if(name&&no){
  list.push(root+n+"/"+p+"/"+f);              // データ/選手名/制作番号/
  list.push(root+n+"_"+p+"/"+f);             // データ/選手名_制作番号/
  list.push(root+n+"/"+f);                    // データ/選手名/
  list.push(root+n+"/"+p+"_"+f);             // データ/選手名/制作番号_melody.m4a
 }
 return [...new Set(list)];
}

async function fetchFirstExistingAudio(ctx,item,fileName,optional=false){
 let lastError=null;
 for(const path of separatedAudioCandidates(item,fileName)){
  try{return await fetchDecodeAudio(ctx,path)}catch(e){lastError=e}
 }
 if(optional)return null;
 throw lastError||new Error(`${fileName} が見つかりません。`);
}

/* =========================================================
   分離音源メドレー合成（新方式）
   melody.m4a        = メロディーのみ
   accompaniment.m4a = コード進行＋ベース

   ・各曲は 0 / 11.294117... / 22.588235... 秒 ... に配置
   ・伴奏は常にそのまま残す
   ・前曲メロディーと次曲メロディーが同時発音した瞬間だけ
     前曲メロディーを鳴らさず、次曲メロディーを100%残す
   ・弱起判定、弱起ゲイン補正、EQ、マスターリミッターは行わない
========================================================= */
function frameRms(data,center,radius){
 const a=Math.max(0,center-radius),b=Math.min(data.length,center+radius+1);
 if(b<=a)return 0;
 let sum=0;for(let i=a;i<b;i++){const v=data[i];sum+=v*v}
 return Math.sqrt(sum/(b-a));
}

function mixSeparatedMedley(ctx,songs,intro=null){
 if(!songs.length)throw new Error("結合する音源がありません。");
 const sampleRate=songs[0].melody.sampleRate;
 const introFrames=intro?Math.max(intro.melody.length,intro.accompaniment.length):0;
 const channels=Math.max(...songs.flatMap(s=>[s.melody.numberOfChannels,s.accompaniment.numberOfChannels]),...(intro?[intro.melody.numberOfChannels,intro.accompaniment.numberOfChannels]:[]));
 const starts=songs.map((_,i)=>introFrames+Math.round(i*MEDLEY_INTERVAL_SEC*sampleRate));
 const totalFrames=Math.max(introFrames,...songs.map((s,i)=>starts[i]+Math.max(s.melody.length,s.accompaniment.length)));
 const output=ctx.createBuffer(channels,totalFrames,sampleRate);
 const radius=Math.max(1,Math.round(sampleRate*0.003));
 const threshold=Math.pow(10,-42/20);

 // 伴奏は前奏を含め、すべて無条件で残す。
 if(intro){
  for(let ch=0;ch<channels;ch++){
   const out=output.getChannelData(ch),src=intro.accompaniment.getChannelData(Math.min(ch,intro.accompaniment.numberOfChannels-1));
   for(let f=0;f<intro.accompaniment.length;f++)out[f]+=src[f];
  }
 }
 for(let i=0;i<songs.length;i++){
  const b=songs[i].accompaniment,start=starts[i];
  for(let ch=0;ch<channels;ch++){
   const out=output.getChannelData(ch),src=b.getChannelData(Math.min(ch,b.numberOfChannels-1));
   for(let f=0;f<b.length;f++)out[start+f]+=src[f];
  }
 }

 // 前奏メロディー：1番本編メロディーと重なる瞬間だけ前奏側を鳴らさない。
 if(intro){
  for(let ch=0;ch<channels;ch++){
   const out=output.getChannelData(ch),src=intro.melody.getChannelData(Math.min(ch,intro.melody.numberOfChannels-1));
   const next=songs[0].melody,nextSrc=next.getChannelData(Math.min(ch,next.numberOfChannels-1));
   for(let f=0;f<intro.melody.length;f++){
    const nextLocal=f-starts[0];
    let suppress=false;
    if(nextLocal>=0&&nextLocal<next.length){
     suppress=frameRms(src,f,radius)>threshold&&frameRms(nextSrc,nextLocal,radius)>threshold;
    }
    if(!suppress)out[f]+=src[f];
   }
  }
 }

 // 本編メロディー：次曲と重なる瞬間だけ前曲側を鳴らさない。
 for(let i=0;i<songs.length;i++){
  const cur=songs[i].melody,start=starts[i];
  for(let ch=0;ch<channels;ch++){
   const out=output.getChannelData(ch),src=cur.getChannelData(Math.min(ch,cur.numberOfChannels-1));
   for(let f=0;f<cur.length;f++){
    const global=start+f;let suppress=false;
    if(i<songs.length-1){
     const next=songs[i+1].melody,nextLocal=global-starts[i+1];
     if(nextLocal>=0&&nextLocal<next.length){
      const nextSrc=next.getChannelData(Math.min(ch,next.numberOfChannels-1));
      suppress=frameRms(src,f,radius)>threshold&&frameRms(nextSrc,nextLocal,radius)>threshold;
     }
    }
    if(!suppress)out[global]+=src[f];
   }
  }
 }
 return output;
}

function writeAscii(view,offset,text){for(let i=0;i<text.length;i++)view.setUint8(offset+i,text.charCodeAt(i))}
function audioBufferToWav(buffer){
 const channels=buffer.numberOfChannels,sampleRate=buffer.sampleRate,bytesPerSample=2;
 const dataLength=buffer.length*channels*bytesPerSample;
 const ab=new ArrayBuffer(44+dataLength),view=new DataView(ab);
 writeAscii(view,0,"RIFF");view.setUint32(4,36+dataLength,true);writeAscii(view,8,"WAVE");writeAscii(view,12,"fmt ");
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,channels,true);view.setUint32(24,sampleRate,true);
 view.setUint32(28,sampleRate*channels*bytesPerSample,true);view.setUint16(32,channels*bytesPerSample,true);view.setUint16(34,16,true);
 writeAscii(view,36,"data");view.setUint32(40,dataLength,true);
 let offset=44;
 for(let i=0;i<buffer.length;i++)for(let ch=0;ch<channels;ch++){
  let sample=Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]||0));
  view.setInt16(offset,sample<0?sample*0x8000:sample*0x7fff,true);offset+=2;
 }
 return new Blob([view],{type:"audio/wav"});
}

/* iPhone / iPad のホーム画面Webアプリ向け音声起動補助。
   必ずボタンタップ直後に呼び、AudioContext を先に起こしておく。 */
async function prepareOneNineAudioContext(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)throw new Error("このブラウザは音源結合に対応していません。");
 let ctx=new AC();
 try{
  if(ctx.state==="suspended")await ctx.resume();
  // iOS PWAで音声デバイスの初期化をユーザー操作中に確定させる。
  const oscillator=ctx.createOscillator();
  const gain=ctx.createGain();
  gain.gain.value=0;
  oscillator.connect(gain);gain.connect(ctx.destination);
  oscillator.start();oscillator.stop(ctx.currentTime+0.001);
  if(ctx.state==="suspended")await ctx.resume();
  return ctx;
 }catch(error){
  try{await ctx.close()}catch(e){}
  throw error;
 }
}

async function buildAndPlayOneNineMedley(){
 if(medleyBuilding)return;
 if(completedMedleyAudio&&!completedMedleyAudio.paused){
  stopOneNineMedley();hideStatus();return;
 }
 stopRowAudio();
 hideStatus();

 // 重要：選手データ取得などの await より前、タップ直後に音声デバイスを起こす。
 let ctx=null;
 try{ctx=await prepareOneNineAudioContext()}
 catch(error){
  console.error("1-9音声デバイス起動エラー:",error);
  setStatus("音声デバイスを起動できませんでした。Webアプリを開き直して、もう一度お試しください。","error");
  return;
 }

 let selected;
 try{selected=await getSelectedMedleyPlayers()}
 catch(error){
  try{await ctx.close()}catch(e){}
  setStatus(error.message||String(error),"error");return
 }
 if(!selected.length){
  try{await ctx.close()}catch(e){}
  setStatus("選手を1人以上選択してください。9人すべて埋める必要はありません。","error");return
 }

 medleyBuilding=true;
 const btn=document.getElementById("medleyPlayButton");
 if(btn){btn.disabled=true;btn.textContent="作成中…"}
 try{
  // バックグラウンド復帰などで停止していた場合も、結合直前にもう一度復帰させる。
  if(ctx.state==="suspended")await ctx.resume();

  const separated=[];
  for(let i=0;i<selected.length;i++){
   const item=selected[i];
   try{
    const [melody,accompaniment]=await Promise.all([
     fetchFirstExistingAudio(ctx,item,"melody.m4a"),
     fetchFirstExistingAudio(ctx,item,"accompaniment.m4a")
    ]);
    separated.push({melody,accompaniment});
   }catch(e){
    throw new Error(`${item.name} の melody.m4a / accompaniment.m4a を公開データフォルダから読み込めませんでした。ファイル配置を確認してください。`);
   }
  }

  let intro=null;
  if(selected[0]?.introMelodyUrl&&selected[0]?.introAccompanimentUrl){
   const [introMelody,introAccompaniment]=await Promise.all([
    fetchFirstExistingAudio(ctx,selected[0],"intro_melody.m4a",true),
    fetchFirstExistingAudio(ctx,selected[0],"intro_accompaniment.m4a",true)
   ]);
   // 2本そろった場合だけ前奏として使用。片方だけなら安全のため前奏なし。
   if(introMelody&&introAccompaniment)intro={melody:introMelody,accompaniment:introAccompaniment};
  }
  const completed=mixSeparatedMedley(ctx,separated,intro);

  const wavBlob=audioBufferToWav(completed);

  if(completedMedleyUrl)URL.revokeObjectURL(completedMedleyUrl);
  completedMedleyUrl=URL.createObjectURL(wavBlob);
  if(completedMedleyAudio){try{completedMedleyAudio.pause()}catch(e){}}
  completedMedleyAudio=new Audio(completedMedleyUrl);
  completedMedleyAudio.playsInline=true;completedMedleyAudio.volume=1;
  completedMedleyAudio.addEventListener("ended",()=>{
   const b=document.getElementById("medleyPlayButton");if(b)b.textContent="▶ 1-9を作成・再生";

  },{once:true});

  if(btn){btn.disabled=false;btn.textContent="■ 1-9を停止"}

  const p=completedMedleyAudio.play();if(p)await p;
 }catch(error){
  console.error("1-9ジャッキ音源作成エラー:",error);
  setStatus("1-9の完成音源を作成できませんでした："+(error.message||error),"error");
  if(btn){btn.disabled=false;btn.textContent="▶ 1-9を作成・再生"}
 }finally{
  medleyBuilding=false;
  if(ctx){try{await ctx.close()}catch(e){}}
 }
}

 const fallback=[
  "福岡ソフトバンクホークス","北海道日本ハムファイターズ","オリックス・バファローズ","東北楽天ゴールデンイーグルス","埼玉西武ライオンズ","千葉ロッテマリーンズ",
  "読売ジャイアンツ","阪神タイガース","横浜DeNAベイスターズ","広島東洋カープ","東京ヤクルトスワローズ","中日ドラゴンズ","日本代表","近鉄","ブルーウェーブ"
 ];
 const order=window.OUENKA_TEAM_ORDER?OUENKA_TEAM_ORDER.get():fallback;
 const pacific=new Set(fallback.slice(0,6)),other=new Set(["日本代表","近鉄","ブルーウェーブ"]);
 [["パ・リーグ",order.filter(x=>pacific.has(x))],["セ・リーグ",order.filter(x=>!pacific.has(x)&&!other.has(x))],["その他",order.filter(x=>other.has(x))]].forEach(([label,teams])=>{
  const g=document.createElement("optgroup");g.label=label;
  teams.forEach(team=>{const o=document.createElement("option");o.value=team;o.textContent=team;o.dataset.team=team;g.appendChild(o)});
  select.appendChild(g);
 });
 if(current&&order.includes(current))select.value=current;
}
function fillYears(){
 const s=document.getElementById("yearSelect"),now=new Date().getFullYear();
 for(let y=now;y>=1950;y--){const o=document.createElement("option");o.value=y;o.textContent=y+"年度";s.appendChild(o)}
}

document.getElementById("resetButton").addEventListener("click",resetAll);
document.getElementById("addButton").addEventListener("click",addPlayer);
document.getElementById("chatSearch").addEventListener("click",chatGPTSearch);
document.getElementById("medleyPlayButton").addEventListener("click",playOneNineMedley);
document.getElementById("yearSelect").addEventListener("change",()=>{autoTitle();saveDraft()});
document.getElementById("teamSelect").addEventListener("change",()=>{autoTitle();saveDraft()});
document.getElementById("lineupTitle").addEventListener("input",e=>{saveDraft();updateInputFieldColor(e.target)});
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))document.querySelectorAll(".suggestions").forEach(x=>x.style.display="none")});
window.addEventListener("ouenka-team-order-change",renderTeamSelect);

fillYears();renderTeamSelect();loadDraft();updateAllInputFieldColors();
</script>
</body>
</html>
