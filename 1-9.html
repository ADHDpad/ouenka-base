<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071d33">
<title>1-9作成 | OUENKA BASE</title>
<style>
*{box-sizing:border-box}
:root{--navy:#071d33;--navy2:#0B2F55;--blue:#0b84f3;--line:#cbd5df;--soft:#eef3f7;--text:#0b2b4a;--yellow:#ffd93d}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#fff;color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer}
.topbar{
  position:sticky;top:0;z-index:100;
  min-height:70px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  background:#071d33;
  color:#fff;
  border-bottom:1px solid rgba(255,255,255,.10)
}
.top-brand{display:flex;flex-direction:column;justify-content:center;min-width:0}
.top-brand-title{font-size:18px;font-weight:900;letter-spacing:.02em;line-height:1.15}
.top-brand-sub{margin-top:7px;font-size:9px;font-weight:700;letter-spacing:.12em;color:#c9d5df}
.back{
  min-height:42px;
  padding:0 15px;
  border:1px solid #61778c;
  border-radius:7px;
  background:transparent;
  color:#fff;
  font-size:13px;
  font-weight:900;
  white-space:nowrap
}
.page{max-width:1060px;margin:auto;padding:16px 12px 32px}
.hero{border:2px solid #58b7ff;border-radius:16px;padding:20px 12px;text-align:center;color:#fff;background:linear-gradient(135deg,#0d477a,#0b3158)}
.hero h1{font-size:clamp(23px,5vw,37px);margin:0 0 7px;font-weight:900}
.hero p{margin:0;font-size:clamp(13px,2.5vw,18px)}
.panel{margin-top:13px;background:#fff;border-radius:16px;overflow:visible}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:12px;background:#edf3f8;border-radius:16px 16px 0 0}
.control,.chat{width:100%;min-height:52px;border:1px solid #c4cfda;border-radius:10px;background:#fff;color:var(--text);font-weight:850;padding:0 12px}
.title-row{display:grid;grid-template-columns:190px 1fr;align-items:center;gap:10px;padding:11px 16px;background:#e8eff6}
.title-row label{font-weight:900;font-size:18px}
.title-row input{width:100%;min-height:47px;border:1px solid #c5d0db;border-radius:9px;padding:0 14px;font-size:16px;color:var(--text);background:#fff}
.lineup{padding:14px}
.player-row{display:grid;grid-template-columns:70px 200px minmax(220px,1fr) 105px 58px;gap:9px;align-items:start;margin-bottom:9px}
.order{height:62px;display:flex;align-items:center;justify-content:center;border-radius:11px;background:linear-gradient(135deg,#0c3c68,#062743);color:#fff;font-size:28px;font-weight:900}
.position,.player-search,.clear,.row-play{height:58px;border:1px solid #c8d2dc;border-radius:9px;background:#fff;color:var(--text)}
.position{width:100%;padding:0 9px;font-weight:850}
.search-wrap{position:relative;min-width:0}
.player-search{width:100%;padding:0 12px 0 40px;font-size:16px}
.search-icon{position:absolute;left:13px;top:29px;transform:translateY(-50%);font-size:21px;color:#687d91;pointer-events:none}
.clear{width:100%;font-weight:850;background:#edf3f8}
.row-play{width:100%;border:0;border-radius:9px;background:#0B2F55;color:#fff;font-size:21px;font-weight:900;display:flex;align-items:center;justify-content:center}
.row-play.playing{background:#0b84f3}
.row-play:disabled{opacity:.35;cursor:not-allowed}
.suggestions{display:none;position:absolute;left:0;right:0;top:61px;z-index:60;background:#fff;border:1px solid #c8d2dc;border-radius:9px;max-height:220px;overflow:auto;box-shadow:0 10px 24px rgba(7,29,51,.2)}
.suggestion{display:block;width:100%;border:0;border-bottom:1px solid rgba(255,255,255,.16);background:#174A7A;text-align:left;padding:11px 13px;color:#fff}
.suggestion:hover,.suggestion:focus{background:#0F3B66}
.suggestion strong{color:#fff}
.suggestion small{color:#dbe9f5 !important}
.suggestion small{display:block;color:#6c7d8d;margin-top:2px}
.bottom-actions{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:10px;padding:3px 14px 16px}
.action{min-height:62px;border:0;border-radius:10px;font-weight:900;font-size:16px}
.reset{background:#e7eef5;color:var(--text)} .add{background:var(--yellow);color:#082a4a}.create{background:linear-gradient(135deg,#168df5,#0575df);color:#fff}
.status{display:none;margin:0 14px 15px;padding:11px;border-radius:9px;background:#eef6ff;color:#174f7e}
@media(max-width:760px){
 .topbar{min-height:66px;padding:0 10px}.top-brand-title{font-size:16px}.top-brand-sub{font-size:8px;margin-top:5px}.back{min-height:40px;padding:0 11px;font-size:12px}
 .page{padding:9px 7px 22px}.hero{padding:15px 7px}
 .filters{gap:5px;padding:7px}.control,.chat{min-height:47px;padding:0 4px;font-size:12px}
 .title-row{grid-template-columns:98px 1fr;padding:8px 8px;gap:5px}.title-row label{font-size:13px}.title-row input{font-size:16px}
 .lineup{padding:9px 7px}.player-row{grid-template-columns:43px 88px minmax(0,1fr) 48px 44px;gap:4px;margin-bottom:6px}
 .order{height:54px;font-size:22px}.position,.player-search,.clear,.row-play{height:50px}
 .position{font-size:11px;padding:0 1px}.player-search{font-size:16px;padding-left:29px}.search-icon{left:8px;top:25px;font-size:17px}.clear{font-size:10px;padding:0 2px}
 .suggestions{top:53px}.bottom-actions{grid-template-columns:1fr 1fr 1.55fr;gap:5px;padding:2px 7px 11px}.action{min-height:56px;font-size:12px;padding:4px}
}

.preview-card{display:none;margin:0 14px 16px;border:1px solid #cbd8e3;border-radius:12px;overflow:hidden;background:#fff}
.preview-head{padding:13px 15px;background:#0B2F55;color:#fff;font-weight:900}
.preview-meta{padding:10px 15px;background:#eef4f9;font-size:13px;color:#4c6275}
.preview-list{margin:0;padding:0;list-style:none}
.preview-item{display:grid;grid-template-columns:42px 90px 1fr;gap:8px;padding:10px 14px;border-top:1px solid #edf1f4;align-items:center}
.preview-num{font-weight:900;color:#0B2F55}
.preview-pos{font-size:12px;font-weight:800;color:#536b80}
.preview-name{font-weight:900}
.row-warning{outline:2px solid #e0a000;outline-offset:2px;border-radius:10px}
.save-note{font-size:11px;opacity:.8;margin-top:3px}
@media(max-width:760px){
 .preview-item{grid-template-columns:30px 70px 1fr;padding:9px 10px}
 .preview-pos{font-size:11px}
}

#teamSelect option[data-team="福岡ソフトバンクホークス"]{background:#FFF3C8;color:#5D4A00}

<body>
<header class="topbar">
  <div class="top-brand">
    <div class="top-brand-title">OUENKA BASE</div>
    <div class="top-brand-sub">DATA REGISTER SYSTEM</div>
  </div>
  <button class="back" type="button" onclick="location.href='./index.html'">← BASEに戻る</button>
</header>

<main class="page">
 <section class="hero">
  <h1>1-9作成</h1>
  <p>選手を検索して1-9を作成できます。</p>
 </section>

 <section class="panel">
  <div class="filters">
   <select id="yearSelect" class="control" aria-label="年度選択">
    <option value="" selected disabled hidden>📅 年度選択</option>
   </select>
   <select id="teamSelect" class="control" aria-label="球団選択">
    <option value="" selected disabled hidden>⚾ 球団選択</option>
   </select>
   <button id="chatSearch" class="chat" type="button">✦ ChatGPTで検索</button>
  </div>

  <div class="title-row">
   <label for="lineupTitle">1-9タイトル</label>
   <input id="lineupTitle" type="text" placeholder="例：2026 開幕スタメン / ベストナイン など">
  </div>

  <div id="lineup" class="lineup"></div>

  <div class="bottom-actions">
   <button id="resetButton" class="action reset" type="button">↻ リセット</button>
   <button id="addButton" class="action add" type="button">＋ 選手追加</button>
   <button id="createButton" class="action create" type="button">♪ 1-9の応援歌データを作成</button>
  </div>
  <div id="status" class="status"></div>
  <section id="previewCard" class="preview-card">
   <div class="preview-head">1-9 プレビュー</div>
   <div id="previewMeta" class="preview-meta"></div>
   <ol id="previewList" class="preview-list"></ol>
  </section>
 </section>
</main>

<script>
const positions=["ポジション選択","投手","捕手","一塁手","二塁手","三塁手","遊撃手","左翼手","中堅手","右翼手","指名打者","代打"];
const STORAGE_KEY="ouenkaBaseOneNineDraftV1";
let rowCount=9;

const DATA_API="https://ouenka-base-data.ninzin5600.workers.dev";
const MAX_SUGGESTIONS=10;
const rowSearchRequests={};

function getName(p){return p?.player_name||p?.name||""}
function getReading(p){return p?.reading||""}
function getTeam(p){return p?.team||""}
function norm(s){return String(s||"").toLowerCase().replace(/[\s　]/g,"")}

function setStatus(message,type="info"){
 const st=document.getElementById("status");
 st.textContent=message; st.style.display="block";
 st.style.background=type==="error"?"#fff0f0":type==="ok"?"#eefaf2":"#eef6ff";
 st.style.color=type==="error"?"#a52b2b":type==="ok"?"#1f6b3b":"#174f7e";
}
function createRow(n,data={}){
 const row=document.createElement("div"); row.className="player-row"; row.dataset.row=n;
 row.dataset.songId=data.songId||"";
 row.dataset.productionNumber=data.productionNumber||"";
 row.dataset.team=data.team||"";
 row.dataset.audioUrl=data.audioUrl||"";
 const options=positions.map((p,i)=>{
   let cls="";
   if(p==="投手")cls="opt-pitcher";
   else if(p==="捕手")cls="opt-catcher";
   else if(["一塁手","二塁手","三塁手","遊撃手"].includes(p))cls="opt-infield";
   else if(["左翼手","中堅手","右翼手"].includes(p))cls="opt-outfield";
   else if(p==="指名打者")cls="opt-dh";
   else if(p==="代打")cls="opt-pinch";
   return `<option class="${cls}" value="${i?p:""}">${p}</option>`;
 }).join("");
 row.innerHTML=`
  <div class="order">${n}</div>
  <select class="position" aria-label="${n}番のポジション">${options}</select>
  <div class="search-wrap">
   <span class="search-icon">⌕</span>
   <input class="player-search" type="text" placeholder="選手名を検索" autocomplete="off" aria-label="${n}番の選手検索">
   <div class="suggestions"></div>
  </div>
  <button class="clear" type="button">クリア</button>
  <button class="row-play" type="button" title="応援歌を再生" aria-label="${n}番の応援歌を再生">▶</button>`;
 const input=row.querySelector(".player-search"), sug=row.querySelector(".suggestions");
 row.querySelector(".position").value=data.position||"";
 input.value=data.name||"";
 input.addEventListener("input",()=>{
   row.dataset.songId="";
   row.dataset.productionNumber="";
   row.dataset.team="";
   showSuggestions(row,input,sug);
   checkDuplicates();
   saveDraft();
 });
 input.addEventListener("focus",()=>showSuggestions(row,input,sug));
 row.querySelector(".position").addEventListener("change",saveDraft);
 row.querySelector(".clear").addEventListener("click",()=>{
   input.value="";
   row.querySelector(".position").value="";
   row.dataset.songId="";
   row.dataset.productionNumber="";
   row.dataset.team="";
   row.dataset.audioUrl="";
   sug.style.display="none";
   row.classList.remove("row-warning");
   if(currentPlayingRow===row) stopRowAudio();
   saveDraft();
 });

 row.querySelector(".row-play").addEventListener("click",()=>playSelectedRow(row));
 return row;
}
function renderRows(rows=[]){
 const box=document.getElementById("lineup"); box.innerHTML="";
 rowCount=Math.max(9,rows.length||9);
 for(let i=1;i<=rowCount;i++)box.appendChild(createRow(i,rows[i-1]||{}));
}

async function showSuggestions(row,input,box){
 const keyword=input.value.trim();
 box.innerHTML="";
 if(!keyword){box.style.display="none";return}

 const rowNo=row.dataset.row;
 const requestNo=(rowSearchRequests[rowNo]||0)+1;
 rowSearchRequests[rowNo]=requestNo;

 try{
  const response=await fetch(
    DATA_API+"/songs/search?q="+encodeURIComponent(keyword),
    {cache:"no-store"}
  );
  if(!response.ok)throw new Error("検索データを取得できませんでした");
  const data=await response.json();

  if(rowSearchRequests[rowNo]!==requestNo)return;

  let songs=Array.isArray(data.songs)?data.songs:[];
  const selectedTeam=document.getElementById("teamSelect").value;

  // 球団を選択している場合は、その球団を優先して表示。
  if(selectedTeam){
    const same=songs.filter(s=>!s.team||s.team===selectedTeam);
    if(same.length)songs=same;
  }

  songs=songs.slice(0,MAX_SUGGESTIONS);
  box.innerHTML="";

  if(!songs.length){
    const no=document.createElement("div");
    no.className="suggestion";
    no.textContent="該当する選手はいません";
    box.appendChild(no);
    box.style.display="block";
    return;
  }

  songs.forEach(song=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="suggestion";

    // 本体検索と同様、候補の主表示は選手名。
    // 同一選手に複数曲がある場合だけ制作番号を補助表示する。
    const name=getName(song);
    const prod=song.production_number||"";
    b.innerHTML=`<strong>${name}</strong>${prod?`<small>${getTeam(song)||""}${getTeam(song)?" / ":""}制作番号 ${prod}</small>`:""}`;

    b.addEventListener("click",()=>{
      input.value=name;
      row.dataset.songId=song.id||"";
      row.dataset.productionNumber=prod;
      row.dataset.team=getTeam(song);

      // 応援歌BASE本体と同じ保存ルール
      // データ/選手名/制作番号/audio.m4a
      const basePath=
        "データ/" +
        encodeURIComponent(song.player_name) +
        "/" +
        song.production_number +
        "/";
      row.dataset.audioUrl=basePath+"audio.m4a";
      box.innerHTML="";
      box.style.display="none";
      checkDuplicates();
      saveDraft();
    });
    box.appendChild(b);
  });

  box.style.display="block";
 }catch(error){
  console.error("D1検索エラー:",error);
  if(rowSearchRequests[rowNo]!==requestNo)return;
  box.innerHTML='<div class="suggestion" style="background:#eef3f7;color:#536273">検索データを取得できません</div>';
  box.style.display="block";
 }
}

let rowAudio=null;
let currentPlayingRow=null;

function resetPlayIcons(){
 document.querySelectorAll(".row-play").forEach(b=>{
   b.textContent="▶";
   b.classList.remove("playing");
 });
}
function stopRowAudio(){
 if(rowAudio){
   try{
     rowAudio.pause();
     rowAudio.removeAttribute("src");
     rowAudio.load();
   }catch(e){}
 }
 rowAudio=null;
 currentPlayingRow=null;
 resetPlayIcons();
}
async function playSelectedRow(row){
 const button=row.querySelector(".row-play");
 if(currentPlayingRow===row&&rowAudio&&!rowAudio.paused){
   stopRowAudio();
   return;
 }

 const name=row.querySelector(".player-search").value.trim();
 if(!name){
   setStatus("先に再生する選手を選択してください。","error");
   return;
 }

 let audioValue="";
 if(row.dataset.productionNumber){
   audioValue=
     "データ/" +
     encodeURIComponent(name) +
     "/" +
     row.dataset.productionNumber +
     "/audio.m4a";
   row.dataset.audioUrl=audioValue;
 }else{
   audioValue=row.dataset.audioUrl||"";
 }

 // 旧保存データなどでaudioUrlが無い場合も本体ルールから復元
 if(!audioValue && row.dataset.productionNumber){
   audioValue=
     "データ/" +
     encodeURIComponent(name) +
     "/" +
     row.dataset.productionNumber +
     "/audio.m4a";
   row.dataset.audioUrl=audioValue;
 }

 if(!audioValue){
   setStatus(`${name}の再生用音源を取得できませんでした。`,"error");
   return;
 }

 stopRowAudio();

 try{
   // iPhoneで他アプリから復帰した古いAudioを再利用しない
   // 応援歌BASE本体 player.js と同じ方式
   rowAudio=new Audio();
   rowAudio.preload="auto";
   rowAudio.volume=1;
   rowAudio.muted=false;
   rowAudio.src=audioValue;

   currentPlayingRow=row;
   button.textContent="■";
   button.classList.add("playing");

   rowAudio.addEventListener("playing",()=>{
     setStatus(`♪ ${name} を再生中`,"ok");
   });

   rowAudio.addEventListener("ended",stopRowAudio,{once:true});
   rowAudio.addEventListener("error",()=>{
     console.error("Audioエラー:",rowAudio ? rowAudio.error : null,audioValue);
     setStatus(`${name}の音源を読み込めませんでした。`,"error");
     stopRowAudio();
   },{once:true});

   const promise=rowAudio.play();
   if(promise) await promise;
 }catch(error){
   console.error("1-9試聴エラー:",error);
   stopRowAudio();
   setStatus(`${name}の音源を再生できませんでした。`,"error");
 }
}

// 他アプリへ移動した場合は、iOSで中断されたAudioを破棄
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="hidden")stopRowAudio();
});
window.addEventListener("pageshow",()=>stopRowAudio());

function currentRows(){
 return [...document.querySelectorAll(".player-row")].map(row=>({
  position:row.querySelector(".position").value,
  name:row.querySelector(".player-search").value.trim(),
  songId:row.dataset.songId||"",
  productionNumber:row.dataset.productionNumber||"",
  team:row.dataset.team||"",
  audioUrl:row.dataset.audioUrl||""
 }));
}
function checkDuplicates(){
 const rows=[...document.querySelectorAll(".player-row")];
 const counts={};
 rows.forEach(r=>{
   const n=norm(r.querySelector(".player-search").value);
   if(n)counts[n]=(counts[n]||0)+1;
 });
 rows.forEach(r=>{
   const n=norm(r.querySelector(".player-search").value);
   r.classList.toggle("row-warning",!!n&&counts[n]>1);
 });
 return Object.values(counts).some(v=>v>1);
}
function autoTitle(){
 const year=document.getElementById("yearSelect").value;
 const team=document.getElementById("teamSelect").value;
 const title=document.getElementById("lineupTitle");
 if(!title.value.trim()&&year&&team)title.value=`${year} ${team} 1-9`;
}
function saveDraft(){
 const data={
  year:document.getElementById("yearSelect").value,
  team:document.getElementById("teamSelect").value,
  title:document.getElementById("lineupTitle").value,
  rows:currentRows()
 };
 localStorage.setItem(STORAGE_KEY,JSON.stringify(data));
}
function loadDraft(){
 try{
  const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
  if(!data){renderRows();return}
  document.getElementById("yearSelect").value=data.year||"";
  document.getElementById("teamSelect").value=data.team||"";
  document.getElementById("lineupTitle").value=data.title||"";
  renderRows(data.rows||[]);
  setStatus("前回編集中だった1-9を復元しました。");
 }catch(e){renderRows()}
}
function resetAll(){
 if(!confirm("1-9の入力内容をすべてリセットしますか？"))return;
 localStorage.removeItem(STORAGE_KEY);
 document.getElementById("yearSelect").value="";
 document.getElementById("teamSelect").value="";
 document.getElementById("lineupTitle").value="";
 document.getElementById("previewCard").style.display="none";
 renderRows();
 setStatus("入力内容をリセットしました。");
}
function addPlayer(){
 rowCount++;
 document.getElementById("lineup").appendChild(createRow(rowCount));
 saveDraft();
 setStatus(`${rowCount}人目の選手枠を追加しました。`);
}
function buildPreview(){
 const rows=currentRows();
 const filled=rows.filter(r=>r.name);
 if(filled.length<9){setStatus(`選手が${filled.length}人です。1-9作成には9人以上選択してください。`,"error");return}
 if(checkDuplicates()){setStatus("同じ選手が複数選択されています。黄色枠の選手を確認してください。","error");return}
 const noPosition=filled.filter(r=>!r.position);
 if(noPosition.length){setStatus("ポジションが未選択の選手がいます。ポジションを選択してください。","error");return}
 autoTitle();
 const title=document.getElementById("lineupTitle").value.trim()||"無題の1-9";
 const year=document.getElementById("yearSelect").value||"年度未選択";
 const team=document.getElementById("teamSelect").value||"球団未選択";
 document.getElementById("previewMeta").textContent=`${title}　｜　${year}年度　｜　${team}`;
 const list=document.getElementById("previewList");list.innerHTML="";
 filled.forEach((r,i)=>{
  const li=document.createElement("li");li.className="preview-item";
  li.innerHTML=`<span class="preview-num">${i+1}</span><span class="preview-pos">${r.position}</span><span class="preview-name">${r.name}</span>`;
  list.appendChild(li);
 });
 document.getElementById("previewCard").style.display="block";
 saveDraft();
 setStatus("1-9の並びを作成しました。内容を確認して、次に応援歌メドレー処理を接続できます。","ok");
 document.getElementById("previewCard").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function chatGPTSearch(){
 const year=document.getElementById("yearSelect").value;
 const team=document.getElementById("teamSelect").value;
 if(!year||!team){setStatus("ChatGPTで検索する前に「年度」と「球団」を選択してください。","error");return}
 autoTitle();
 saveDraft();
 setStatus(`${year}年度・${team}の1-9候補を検索する準備ができました。次の工程でYouTube優先検索→見つからなければ代表スタメン作成を接続します。`);
}

function renderTeamSelect(){
 const select=document.getElementById("teamSelect");
 if(!select)return;
 const current=select.value;
 select.innerHTML='<option value="" disabled hidden>⚾ 球団選択</option>';
 const order=window.OUENKA_TEAM_ORDER ? OUENKA_TEAM_ORDER.get() : [];
 const pacific=new Set(["福岡ソフトバンクホークス","北海道日本ハムファイターズ","オリックス・バファローズ","東北楽天ゴールデンイーグルス","埼玉西武ライオンズ","千葉ロッテマリーンズ"]);
 const other=new Set(["日本代表","近鉄","ブルーウェーブ"]);
 const groups=[
   ["パ・リーグ",order.filter(x=>pacific.has(x))],
   ["セ・リーグ",order.filter(x=>!pacific.has(x)&&!other.has(x))],
   ["その他",order.filter(x=>other.has(x))]
 ];
 groups.forEach(([label,teams])=>{
   const g=document.createElement("optgroup");g.label=label;
   teams.forEach(team=>{
     const o=document.createElement("option");
     o.value=team;o.textContent=team;o.dataset.team=team;
     const colors={
       "福岡ソフトバンクホークス":["#FFF3C8","#5D4A00"],
       "北海道日本ハムファイターズ":["#DFF1FF","#174C78"],
       "オリックス・バファローズ":["#EAE2F5","#4D3570"],
       "東北楽天ゴールデンイーグルス":["#F9DFE4","#85283A"],
       "埼玉西武ライオンズ":["#DDEFFF","#15588C"],
       "千葉ロッテマリーンズ":["#ECEFF2","#263746"],
       "読売ジャイアンツ":["#FFE6D0","#844000"],
       "阪神タイガース":["#FFF4B8","#635700"],
       "横浜DeNAベイスターズ":["#DDF2FF","#12628F"],
       "広島東洋カープ":["#FADDDD","#962323"],
       "東京ヤクルトスワローズ":["#DFF3E5","#28633A"],
       "中日ドラゴンズ":["#E1E9FF","#294E9B"],
       "日本代表":["#E8EEF8","#173B67"],
       "近鉄":["#F2E7D9","#6B4322"],
       "ブルーウェーブ":["#DCEEFF","#164D82"]
     };
     if(colors[team]){o.style.background=colors[team][0];o.style.color=colors[team][1]}
     g.appendChild(o)
   });
   select.appendChild(g);
 });
 if(current && order.includes(current))select.value=current;
 else select.selectedIndex=0;
}

function fillYears(){
 const s=document.getElementById("yearSelect");
 const now=new Date().getFullYear();
 for(let y=now;y>=1950;y--){const o=document.createElement("option");o.value=y;o.textContent=y+"年度";s.appendChild(o)}
}
document.getElementById("resetButton").addEventListener("click",resetAll);
document.getElementById("addButton").addEventListener("click",addPlayer);
document.getElementById("chatSearch").addEventListener("click",chatGPTSearch);
document.getElementById("createButton").addEventListener("click",buildPreview);
document.getElementById("yearSelect").addEventListener("change",()=>{autoTitle();saveDraft()});
document.getElementById("teamSelect").addEventListener("change",()=>{autoTitle();saveDraft()});
document.getElementById("lineupTitle").addEventListener("input",saveDraft);
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))document.querySelectorAll(".suggestions").forEach(x=>x.style.display="none")});
fillYears();renderTeamSelect();loadDraft();
</script>
<script>

/* ===== 未入力=水色 / 入力済み=白 ===== */
function updateInputFieldColor(el){
  if(!el)return;
  const hasValue=String(el.value||"").trim()!=="";
  el.classList.toggle("has-value",hasValue);
}
function updateAllInputFieldColors(){
  document.querySelectorAll("#yearSelect,#teamSelect,#titleInput,.position,.player-search")
    .forEach(updateInputFieldColor);
}
document.addEventListener("input",e=>{
  if(e.target.matches("#titleInput,.player-search"))updateInputFieldColor(e.target);
});
document.addEventListener("change",e=>{
  if(e.target.matches("#yearSelect,#teamSelect,.position"))updateInputFieldColor(e.target);
});
document.addEventListener("click",()=>{
  /* 候補選択・クリアなどJSで値が変わった場合も反映 */
  setTimeout(updateAllInputFieldColors,0);
});
window.addEventListener("load",updateAllInputFieldColors);

</script>
