<style>
*{box-sizing:border-box}

html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#fff;color:var(--text)}
button,input,select{font:inherit} button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:100;min-height:70px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:#071d33;color:#fff;border-bottom:1px solid rgba(255,255,255,.10)}

.suggestions{display:none;position:absolute;left:0;right:0;top:61px;z-index:60;background:#fff;border:1px solid #c8d2dc;border-radius:9px;max-height:220px;overflow:auto;box-shadow:0 10px 24px rgba(7,29,51,.2)}

.suggestion:hover,.suggestion:focus{background:#0F3B66}.suggestion strong{color:#fff}.suggestion small{display:block;color:#dbe9f5!important;margin-top:2px}

.position{background:#EAF6FF!important;color:#0b2b4a!important;border-color:#A9CDE8!important}
.player-search,#lineupTitle{background:#EAF6FF!important;border-color:#A9CDE8!important}

.position option.opt-pitcher{background:#FDE2E2;color:#8B1E1E}.position option.opt-catcher{background:#E0ECFF;color:#174C91}

.position option.opt-dh{background:#EFE3FA;color:#5D3480}.position option.opt-pinch{background:#FCE3EF;color:#8C2E5B}
#medleyPlayButton{background:#0B4F7A;color:#fff}
@media(max-width:760px){

<body>
<header class="topbar">
 <div class="top-brand"><div class="top-brand-title">OUENKA BASE</div><div class="top-brand-sub">DATA REGISTER SYSTEM</div></div>
 <button class="back" type="button" onclick="location.href='./index.html'">← BASEに戻る</button>
</header>
<main class="page">
 <section class="hero"><h1>1-9作成</h1><p>選手を検索して1-9を作成できます。</p></section>
 <section class="panel">
  <div class="filters">
   <select id="yearSelect" class="control"><option value="" selected disabled hidden>📅 年度選択</option></select>
   <select id="teamSelect" class="control"><option value="" selected disabled hidden>⚾ 球団選択</option></select>
   <button id="chatSearch" class="chat" type="button">✦ ChatGPTで検索</button>
  </div>
  <div class="title-row"><label for="lineupTitle">1-9タイトル</label><input id="lineupTitle" type="text" placeholder="例：2026 開幕スタメン / ベストナイン など"></div>
  <div id="lineup" class="lineup"></div>
  <div class="bottom-actions">
   <button id="resetButton" class="action reset" type="button">↻ リセット</button>
   <button id="addButton" class="action add" type="button">＋ 選手追加</button>
   <button id="medleyPlayButton" class="action create" type="button">▶ 1-9を作成・再生</button>
  </div>
  <section id="previewCard" class="preview-card">
   <div class="preview-head">1-9 プレビュー</div><div id="previewMeta" class="preview-meta"></div><ol id="previewList" class="preview-list"></ol>
  </section>
 </section>
</main>

<script>
"use strict";

/* =========================================================
   OUENKA BASE / 1-9
   2026-10-05 正式ジャッキ方式

   【正式仕様】
   ・BPM 170 / 4拍子
   ・1小節 = 60 / 170 * 4 = 1.41176470588秒
   ・次曲は前曲の9小節目の頭から開始
   ・したがって開始間隔 = 8小節 = 11.2941176471秒
   ・次曲の1小節目が無音でも削らない
   ・前曲9小節目と次曲1小節目は両方の音を残して加算
   ・クロスフェードしない
   ・曲別の音量補正をしない
   ・重複区間のSmartOverlap補正をしない
   ・最終出力のクリップ防止だけ ±0.98 で制限
========================================================= */

const DATA_API="https://ouenka-base-data.ninzin5600.workers.dev";
const OUENKA_PUBLIC_BASE="https://adhdpad.github.io/ouenka-base/";
const STORAGE_KEY="ouenkaBaseOneNineDraftV1";
const MAX_SUGGESTIONS=10;

const MEDLEY_BPM=170;
const MEDLEY_BEATS_PER_BAR=4;
const MEDLEY_BAR_SEC=(60/MEDLEY_BPM)*MEDLEY_BEATS_PER_BAR;
const MEDLEY_INTERVAL_SEC=MEDLEY_BAR_SEC*8; // 9小節目の頭
const MEDLEY_LIMIT=0.98;

const positions=["ポジション選択","投手","捕手","一塁手","二塁手","三塁手","遊撃手","左翼手","中堅手","右翼手","指名打者","代打"];
const rowSearchRequests={};
let rowCount=9;
let rowAudio=null;
let currentPlayingRow=null;
let completedMedleyUrl=null;
let completedMedleyAudio=null;
let medleyBuilding=false;

function getName(p){return p?.player_name||p?.name||""}
function getReading(p){return p?.reading||""}
function getTeam(p){return p?.team||""}
function norm(s){return String(s||"").toLowerCase().replace(/[\s　]/g,"")}

function setStatus(message,type="info"){
 // 画面最下部のステータスメッセージは表示しない。
 // 操作不能につながるエラーだけダイアログで通知する。
 if(type==="error") alert(message);
}

function updateInputFieldColor(el){
 if(!el)return;
 el.classList.toggle("has-value",String(el.value||"").trim()!=="");
}
function updateAllInputFieldColors(){
 document.querySelectorAll("#lineupTitle,.position,.player-search").forEach(updateInputFieldColor);
}


function syncCompactSelectState(select){
 if(!select)return;
 select.classList.toggle("has-value",!!select.value);
}

function createRow(n,data={}){
 const row=document.createElement("div");
 row.className="player-row";row.dataset.row=n;
 row.dataset.songId=data.songId||"";
 row.dataset.productionNumber=data.productionNumber||"";
 row.dataset.team=data.team||"";
 row.dataset.audioUrl=data.audioUrl||"";
 row.dataset.medleyUrl=data.medleyUrl||"";

 const options=positions.map((p,i)=>{
  let cls="";
  if(p==="投手")cls="opt-pitcher";
  else if(p==="捕手")cls="opt-catcher";
  else if(["一塁手","二塁手","三塁手","遊撃手"].includes(p))cls="opt-infield";
  else if(["左翼手","中堅手","右翼手"].includes(p))cls="opt-outfield";
  else if(p==="指名打者")cls="opt-dh";
  else if(p==="代打")cls="opt-pinch";
  return `<option class="${cls}" value="${i?p:""}">${p}</option>`;
 }).join("");

 row.innerHTML=`
  <div class="order">${n}</div>
  <select class="position" aria-label="${n}番のポジション">${options}</select>
  <div class="search-wrap">
   <span class="search-icon">⌕</span>
   <input class="player-search" type="text" placeholder="選手名を検索" autocomplete="off" aria-label="${n}番の選手検索">
   <button class="input-clear" type="button" aria-label="${n}番の選手名を消す">×</button>
   <div class="suggestions"></div>
  </div>
  <button class="drag-handle" type="button" title="つかんで並び替え" aria-label="${n}番を並び替え">☰</button>`;

 const orderButton=row.querySelector(".order");
 orderButton.setAttribute("role","button");
 orderButton.setAttribute("tabindex","0");
 orderButton.setAttribute("title",`${n}番の応援歌を再生`);
 orderButton.setAttribute("aria-label",`${n}番の応援歌を再生`);
 orderButton.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();playSelectedRow(row)}
 });
 const input=row.querySelector(".player-search");
 const sug=row.querySelector(".suggestions");
 const pos=row.querySelector(".position");
 const wrap=row.querySelector(".search-wrap");
 pos.value=data.position||"";
 input.value=data.name||"";

 function syncClear(){wrap.classList.toggle("has-text",input.value.trim()!=="")}
 syncClear();

 input.addEventListener("input",()=>{
  row.dataset.songId="";row.dataset.productionNumber="";row.dataset.team="";
  row.dataset.audioUrl="";row.dataset.medleyUrl="";
  syncClear();showSuggestions(row,input,sug);checkDuplicates();saveDraft();updateInputFieldColor(input);
 });
 input.addEventListener("focus",()=>showSuggestions(row,input,sug));
 syncCompactSelectState(pos);
 pos.addEventListener("change",()=>{
  syncCompactSelectState(pos);
  saveDraft();updateInputFieldColor(pos);
 });
 row.querySelector(".input-clear").addEventListener("click",()=>{
  input.value="";
  row.dataset.songId="";row.dataset.productionNumber="";row.dataset.team="";
  row.dataset.audioUrl="";row.dataset.medleyUrl="";
  sug.style.display="none";row.classList.remove("row-warning");
  if(currentPlayingRow===row)stopRowAudio();
  syncClear();saveDraft();updateInputFieldColor(input);
  input.focus();
 });
 row.querySelector(".order").addEventListener("click",()=>{
  playSelectedRow(row);
 });
 installRowDrag(row,row.querySelector(".drag-handle"));
 setTimeout(()=>{updateInputFieldColor(input);updateInputFieldColor(pos)},0);
 return row;
}

function renumberRows(){
 const rows=[...document.querySelectorAll("#lineup .player-row")];
 rows.forEach((row,i)=>{
  const n=i+1;
  row.dataset.row=n;
  const order=row.querySelector(".order");
  order.textContent=n;
  order.setAttribute("role","button");
  order.setAttribute("tabindex","0");
  order.setAttribute("title",`${n}番の応援歌を再生`);
  order.setAttribute("aria-label",`${n}番の応援歌を再生`);
  const pos=row.querySelector(".position");
  const input=row.querySelector(".player-search");
  const clear=row.querySelector(".input-clear");
  const handle=row.querySelector(".drag-handle");
  pos.setAttribute("aria-label",`${n}番のポジション`);
  input.setAttribute("aria-label",`${n}番の選手検索`);
  clear.setAttribute("aria-label",`${n}番の選手名を消す`);
  handle.setAttribute("aria-label",`${n}番を並び替え`);
 });
 rowCount=rows.length;
 checkDuplicates();
 saveDraft();
}

let dragState=null;

function clearDragMarks(){
 document.querySelectorAll(".player-row").forEach(r=>{
  r.classList.remove("drag-over-before","drag-over-after");
 });
}

function installRowDrag(row,handle){
 handle.addEventListener("pointerdown",e=>{
  if(e.button!==undefined && e.button!==0)return;
  e.preventDefault();
  handle.setPointerCapture?.(e.pointerId);
  dragState={row,handle,pointerId:e.pointerId,lastY:e.clientY};
  row.classList.add("dragging");
 });

 handle.addEventListener("pointermove",e=>{
  if(!dragState || dragState.handle!==handle)return;
  e.preventDefault();
  dragState.lastY=e.clientY;
  const lineup=document.getElementById("lineup");
  const others=[...lineup.querySelectorAll(".player-row")].filter(r=>r!==row);
  clearDragMarks();
  let target=null,before=false;
  for(const r of others){
   const rect=r.getBoundingClientRect();
   if(e.clientY>=rect.top && e.clientY<=rect.bottom){
    target=r;before=e.clientY<rect.top+rect.height/2;break;
   }
  }
  if(!target){
   if(others.length && e.clientY<others[0].getBoundingClientRect().top){
    target=others[0];before=true;
   }else if(others.length && e.clientY>others[others.length-1].getBoundingClientRect().bottom){
    target=others[others.length-1];before=false;
   }
  }
  if(target)target.classList.add(before?"drag-over-before":"drag-over-after");
 });

 function finishDrag(e){
  if(!dragState || dragState.handle!==handle)return;
  const y=dragState.lastY;
  const lineup=document.getElementById("lineup");
  const others=[...lineup.querySelectorAll(".player-row")].filter(r=>r!==row);
  let target=null,before=false;
  for(const r of others){
   const rect=r.getBoundingClientRect();
   if(y>=rect.top && y<=rect.bottom){
    target=r;before=y<rect.top+rect.height/2;break;
   }
  }
  if(!target && others.length){
   if(y<others[0].getBoundingClientRect().top){target=others[0];before=true}
   else if(y>others[others.length-1].getBoundingClientRect().bottom){target=others[others.length-1];before=false}
  }
  if(target){
   if(before)lineup.insertBefore(row,target);
   else lineup.insertBefore(row,target.nextSibling);
  }
  row.classList.remove("dragging");
  clearDragMarks();
  try{handle.releasePointerCapture?.(dragState.pointerId)}catch(_){}
  dragState=null;
  renumberRows();
 }
 handle.addEventListener("pointerup",finishDrag);
 handle.addEventListener("pointercancel",finishDrag);
}

async function getRegisteredSongFor19(playerName,productionNumber){
 const name=String(playerName||"").trim(),no=String(productionNumber||"").trim();
 if(!name||!no)return null;
 const candidates=[
  `${DATA_API}/song?player_name=${encodeURIComponent(name)}&production_number=${encodeURIComponent(no)}`,
  `${DATA_API}/songs?player_name=${encodeURIComponent(name)}&production_number=${encodeURIComponent(no)}`,
  `${DATA_API}/search?player_name=${encodeURIComponent(name)}&production_number=${encodeURIComponent(no)}`
 ];
 for(const url of candidates){
  try{
   const res=await fetch(url,{cache:"no-store"});if(!res.ok)continue;
   const data=await res.json();let song=null;
   if(data?.song)song=data.song;
   else if(Array.isArray(data?.songs))song=data.songs.find(x=>String(x.player_name||x.name||"")===name&&String(x.production_number||x.productionNumber||"")===no)||data.songs[0]||null;
   else if(Array.isArray(data))song=data.find(x=>String(x.player_name||x.name||"")===name&&String(x.production_number||x.productionNumber||"")===no)||data[0]||null;
   else if(data&&(data.player_name||data.name))song=data;
   if(song)return song;
  }catch(e){}
 }
 try{
  const res=await fetch(`${DATA_API}/songs`,{cache:"no-store"});
  if(res.ok){
   const data=await res.json();
   const list=Array.isArray(data)?data:Array.isArray(data.songs)?data.songs:Array.isArray(data.items)?data.items:[];
   return list.find(x=>String(x.player_name||x.name||"")===name&&String(x.production_number||x.productionNumber||"")===no)||null;
  }
 }catch(e){}
 return null;
}

async function getSelectedMedleyPlayers(){
 const rows=[...document.querySelectorAll(".player-row")],selected=[];
 for(const row of rows){
  const name=(row.querySelector(".player-search")?.value||"").trim();
  const productionNumber=String(row.dataset.productionNumber||"").trim();
  if(!name)continue;

  if(row.dataset.audioUrl&&row.dataset.medleyUrl){
   selected.push({name,productionNumber,audioUrl:row.dataset.audioUrl,medleyUrl:row.dataset.medleyUrl});continue;
  }
  setStatus(`♪ 登録データを確認中… ${name}`,"ok");
  const song=await getRegisteredSongFor19(name,productionNumber);
  if(!song)throw new Error(`${name}（制作番号 ${productionNumber}）の登録データが見つかりません。`);

function toPublicAudioUrl(path){
 if(!path)return "";
 if(/^https?:\/\//i.test(path))return path;
 return new URL(path,OUENKA_PUBLIC_BASE).href;
}

async function fetchDecodeAudio(ctx,path){
 if(!path)throw new Error("登録音源情報を取得できませんでした。");
 const url=toPublicAudioUrl(path);
 const response=await fetch(url,{cache:"no-store",credentials:"omit"});
 if(!response.ok)throw new Error(`音源取得失敗 (${response.status})：${url}`);
 const arrayBuffer=await response.arrayBuffer();
 return await ctx.decodeAudioData(arrayBuffer.slice(0));
}

/* =========================================================
   正式ジャッキ合成
   0秒 / 11.294117...秒 / 22.588235...秒 ... に配置。
   各曲は一切フェード・ゲイン補正しない。
   同じ時刻に存在するサンプルは単純加算する。
========================================================= */
function mixBuffersJacking(ctx,buffers){
 if(!buffers.length)throw new Error("結合する音源がありません。");
 const sampleRate=buffers[0].sampleRate;
 const channels=Math.max(...buffers.map(b=>b.numberOfChannels));
 const starts=buffers.map((_,i)=>Math.round(i*MEDLEY_INTERVAL_SEC*sampleRate));
 const totalFrames=Math.max(...buffers.map((b,i)=>starts[i]+b.length));
 const output=ctx.createBuffer(channels,totalFrames,sampleRate);

 for(let i=0;i<buffers.length;i++){
  const b=buffers[i],start=starts[i];
  for(let ch=0;ch<channels;ch++){
   const out=output.getChannelData(ch);
   const src=b.getChannelData(Math.min(ch,b.numberOfChannels-1));
   for(let f=0;f<b.length;f++)out[start+f]+=src[f];
  }
 }

 /* 最終ミックスだけをリミット。前曲・次曲個別の音量は下げない。 */
 for(let ch=0;ch<channels;ch++){
  const data=output.getChannelData(ch);
  for(let i=0;i<data.length;i++){
   if(data[i]>MEDLEY_LIMIT)data[i]=MEDLEY_LIMIT;
   else if(data[i]<-MEDLEY_LIMIT)data[i]=-MEDLEY_LIMIT;
  }
 }
 return output;
}

function writeAscii(view,offset,text){for(let i=0;i<text.length;i++)view.setUint8(offset+i,text.charCodeAt(i))}
function audioBufferToWav(buffer){
 const channels=buffer.numberOfChannels,sampleRate=buffer.sampleRate,bytesPerSample=2;
 const dataLength=buffer.length*channels*bytesPerSample;
 const ab=new ArrayBuffer(44+dataLength),view=new DataView(ab);
 writeAscii(view,0,"RIFF");view.setUint32(4,36+dataLength,true);writeAscii(view,8,"WAVE");writeAscii(view,12,"fmt ");
 view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,channels,true);view.setUint32(24,sampleRate,true);
 view.setUint32(28,sampleRate*channels*bytesPerSample,true);view.setUint16(32,channels*bytesPerSample,true);view.setUint16(34,16,true);
 writeAscii(view,36,"data");view.setUint32(40,dataLength,true);
 let offset=44;
 for(let i=0;i<buffer.length;i++)for(let ch=0;ch<channels;ch++){
  let sample=Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]||0));
  view.setInt16(offset,sample<0?sample*0x8000:sample*0x7fff,true);offset+=2;
 }
 return new Blob([view],{type:"audio/wav"});
}

async function buildAndPlayOneNineMedley(){
 if(medleyBuilding)return;
 if(completedMedleyAudio&&!completedMedleyAudio.paused){
  stopOneNineMedley();setStatus("1-9の再生を停止しました。");return;
 }
 stopRowAudio();
 let selected;
 try{selected=await getSelectedMedleyPlayers()}
 catch(error){setStatus(error.message||String(error),"error");return}
 if(!selected.length){setStatus("選手を1人以上選択してください。9人すべて埋める必要はありません。","error");return}

 medleyBuilding=true;
 const btn=document.getElementById("medleyPlayButton");
 if(btn){btn.disabled=true;btn.textContent="作成中…"}
 let ctx=null;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)throw new Error("このブラウザは音源結合に対応していません。");
  ctx=new AC();
  if(ctx.state==="suspended")await ctx.resume();

  const buffers=[];
  for(let i=0;i<selected.length;i++){
   const item=selected[i],url=makeMedleySongPath(item,i);
   setStatus(`♪ 完成音源を作成中… ${i+1}/${selected.length} ${item.name}`,"ok");
   buffers.push(await fetchDecodeAudio(ctx,url));
  }

  setStatus(`♪ ジャッキ方式で結合中… 9小節目＋次曲1小節目（${MEDLEY_INTERVAL_SEC.toFixed(6)}秒間隔）`,"ok");
  const completed=mixBuffersJacking(ctx,buffers);
  setStatus("♪ 完成音源を書き出しています…","ok");
  const wavBlob=audioBufferToWav(completed);

  if(completedMedleyUrl)URL.revokeObjectURL(completedMedleyUrl);
  completedMedleyUrl=URL.createObjectURL(wavBlob);
  if(completedMedleyAudio){try{completedMedleyAudio.pause()}catch(e){}}
  completedMedleyAudio=new Audio(completedMedleyUrl);
  completedMedleyAudio.playsInline=true;completedMedleyAudio.volume=1;
  completedMedleyAudio.addEventListener("ended",()=>{
   const b=document.getElementById("medleyPlayButton");if(b)b.textContent="▶ 1-9を作成・再生";
   setStatus("1-9の再生が終了しました。","ok");
  },{once:true});

  if(btn){btn.disabled=false;btn.textContent="■ 1-9を停止"}
  setStatus(`♪ ${selected.length}人のジャッキ式メドレーを再生します。`,"ok");
  const p=completedMedleyAudio.play();if(p)await p;
 }catch(error){
  console.error("1-9ジャッキ音源作成エラー:",error);
  setStatus("1-9の完成音源を作成できませんでした："+(error.message||error),"error");
  if(btn){btn.disabled=false;btn.textContent="▶ 1-9を作成・再生"}
 }finally{
  medleyBuilding=false;
  if(ctx){try{await ctx.close()}catch(e){}}
 }
}

 const s=document.getElementById("yearSelect"),now=new Date().getFullYear();
 for(let y=now;y>=1950;y--){const o=document.createElement("option");o.value=y;o.textContent=y+"年度";s.appendChild(o)}
}

document.getElementById("resetButton").addEventListener("click",resetAll);
document.getElementById("addButton").addEventListener("click",addPlayer);
document.getElementById("chatSearch").addEventListener("click",chatGPTSearch);
document.getElementById("medleyPlayButton").addEventListener("click",playOneNineMedley);
document.getElementById("yearSelect").addEventListener("change",()=>{autoTitle();saveDraft()});
document.getElementById("teamSelect").addEventListener("change",e=>{
 syncCompactSelectState(e.currentTarget);
 paintTeamSelect();autoTitle();saveDraft();
});
document.getElementById("lineupTitle").addEventListener("input",e=>{saveDraft();updateInputFieldColor(e.target)});
document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))document.querySelectorAll(".suggestions").forEach(x=>x.style.display="none")});
window.addEventListener("ouenka-team-order-change",renderTeamSelect);

fillYears();renderTeamSelect();loadDraft();updateAllInputFieldColors();
</script>
