<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1328"><title>応援歌リズム | OUENKA BASE</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a1328;color:white;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input{font:inherit}button{border:0;border-radius:10px;background:#2775de;color:white;padding:12px 15px;font-weight:800;cursor:pointer}button:disabled{opacity:.4}.wrap{max-width:850px;margin:auto;padding:12px}h1{font-size:22px;margin:10px 0}.panel{background:#172640;padding:14px;border-radius:14px;margin:12px 0}label{display:block;margin:9px 0}.hint{font-size:13px;color:#bbcee5;line-height:1.7}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}select,input[type=file]{max-width:100%;background:#fff;color:#13233a;border-radius:8px;padding:9px}#stage{display:none;position:fixed;inset:0;background:#070d1d;z-index:10;touch-action:none;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#pause{position:absolute;right:12px;top:env(safe-area-inset-top,8px);z-index:12;background:#283d5d;padding:7px 13px}#status{position:absolute;left:10px;top:env(safe-area-inset-top,8px);font-size:12px;pointer-events:none}#overlay{display:none;position:absolute;inset:0;z-index:13;background:#071124e8;align-items:center;justify-content:center;text-align:center;padding:18px}#overlay .panel{max-width:380px;width:100%}a{color:#aad8ff}
</style></head><body><div class="wrap"><div class="row"><button onclick="location.href='index.html'">← ホーム</button><h1>🎮 応援歌リズム <small style="font-size:11px">試作</small></h1></div><div class="panel"><b>音源を選んでプレイ</b><p class="hint">iPhoneで実験するための試作版です。端末内のm4a/mp3音源を選択すると、拍に合わせた6レーン譜面を自動生成します。MIDI音符との同期は未対応です。</p><label>音源（端末から選択）<input id="files" type="file" accept="audio/*,.m4a,.mp3,.wav" multiple></label><p class="hint">複数ファイルを選択すると、選んだ順にメドレー再生します（曲間は短い無音）。既存メドレーの小節重ねとは異なります。</p><label>テンポ <select id="bpm"><option value="170">170 BPM</option><option value="140">140 BPM</option></select></label><label>難易度 <select id="difficulty"><option value="easy">EASY</option><option value="normal" selected>NORMAL</option><option value="hard">HARD</option><option value="expert">EXPERT</option></select></label><div class="row"><button id="start" disabled>ゲーム開始</button><span id="fileinfo" class="hint">音源を選択してください</span></div></div><div class="panel hint">操作：流れてくるノーツが下の判定ラインに重なったらタップ。黄色は長押し、ピンクは上へフリック。iPhoneは横画面推奨。初回はNORMALで試してください。</div></div><div id="stage"><canvas id="canvas"></canvas><div id="status"></div><button id="pause">Ⅱ</button><div id="overlay"><div class="panel"><h2 id="overlayTitle">一時停止</h2><p id="overlayInfo"></p><div class="row" style="justify-content:center"><button id="resume">再開</button><button id="quit">終了</button></div></div></div></div><script src="rhythm.js?v=1"></script></body></html>
