<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>お気に入り | OUENKA BASE</title><style>body{margin:0;background:#eef4fa;color:#153451;font:16px/1.6 system-ui}header{background:#071d33;color:#fff;padding:16px;display:flex;justify-content:space-between}main{max-width:850px;margin:auto;padding:16px}.favorite-row{padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:12px;background:white;border:1px solid #cddfee;border-radius:10px}.favorite-row .info{flex:1;min-width:0}.favorite-row small{display:block;color:#58718b}button{font:inherit;cursor:pointer;background:#075daf;color:white;padding:10px 15px;border:0;border-radius:8px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}h1{font-size:24px}</style></head><body><header><b>OUENKA BASE</b><button onclick="location.href='./index.html'">◀戻る</button></header><main><h1>★ お気に入り</h1><p>個人検索・球団別ページの星を押すと、この端末に保存されます。</p><div id="favoriteList"></div><p id="nowPlaying" role="status"></p></main><div id="homeMiniPlayer" hidden><button id="homePause"></button><button id="homePlay"></button><button id="homeStop"></button></div><script src="ouenka-transport.js?v=20261020-r131"></script><script src="ouenka-favorites.js?v=20261020-r131"></script><script src="audio-recovery.js?v=20261020-r131"></script><script src="pwa-diagnostic.js?v=20261020-r131"></script><script src="player.js?v=20261020-r131"></script><script>
(()=>{'use strict';function renderFavorites(){const list=document.getElementById('favoriteList');list.replaceChildren();const songs=window.OuenkaFavorites.list();window.ouenkaHomeQueue=songs;if(!songs.length){const text=document.createElement('p');text.textContent='お気に入りはまだありません。個人検索・球団別ページで☆を押してください。';list.append(text)}for(const song of songs){const row=document.createElement('article');row.className='favorite-row';const info=document.createElement('div');info.className='info';const name=document.createElement('strong');name.textContent=song.name;const detail=document.createElement('small');detail.textContent=(song.team||'')+' ／ 制作番号 '+song.productionNumber;info.append(name,detail);const play=document.createElement('button');play.textContent='▶ 再生';play.onclick=()=>playSongData(song);row.append(info,window.OuenkaFavorites.button(song),play);list.append(row)}}renderFavorites();window.addEventListener('ouenka-favorites-change',renderFavorites);})();
</script></body></html>
