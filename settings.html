<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071d33">
<title>設定 | OUENKA BASE</title>
<script src="team-order.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:#fff;color:#102d48}
header{height:74px;background:#071d33;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.brand strong{display:block;font-size:19px}.brand small{display:block;font-size:10px;letter-spacing:.12em;margin-top:5px;color:#c7d4e0}
.back{border:1px solid #70859a;border-radius:7px;background:transparent;color:#fff;padding:11px 16px;font-weight:800}
main{max-width:720px;margin:auto;padding:24px 14px 40px}
h1{margin:0 0 7px;font-size:28px}.desc{margin:0 0 20px;color:#647789}
.card{border:1px solid #d8e0e7;border-radius:13px;overflow:hidden}
.cardhead{padding:15px 16px;background:#edf3f8;font-weight:900}
.team{display:grid;grid-template-columns:42px 1fr 48px 48px;gap:7px;align-items:center;padding:10px 12px;border-top:1px solid #edf1f4;border-left:5px solid transparent}
.num{font-weight:900;color:#708297}.name{font-weight:800}.move{height:40px;border:1px solid #cbd5df;border-radius:7px;background:#fff;font-weight:900;color:#0B2F55}
.league{padding:8px 12px;background:#0B2F55;color:#fff;font-size:12px;font-weight:900;letter-spacing:.08em}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.save,.reset{height:52px;border:0;border-radius:9px;font-weight:900}.save{background:#0B2F55;color:#fff}.reset{background:#edf2f6;color:#173650}
.notice{display:none;margin-top:12px;padding:11px;border-radius:8px;background:#eaf7ee;color:#25613a;font-weight:700}
</style>
</head>
<body>
<header><div class="brand"><strong>OUENKA BASE</strong><small>SETTINGS</small></div><button class="back" onclick="location.href='./index.html'">← BASEに戻る</button></header>
<main>
<h1>設定</h1>
<p class="desc">応援歌BASEと1-9作成画面で使用する球団表示順を変更できます。</p>
<div class="card"><div class="cardhead">球団表示順序</div><div id="teamList"></div></div>
<div class="actions"><button class="reset" id="reset">初期順に戻す</button><button class="save" id="save">この順番を保存</button></div>
<div id="notice" class="notice">球団表示順を保存しました。</div>
</main>
<script>
const TEAM_COLORS={"福岡ソフトバンクホークス": ["#FFF3C8", "#5D4A00", "#E0B800"], "北海道日本ハムファイターズ": ["#DFF1FF", "#174C78", "#6AA7D4"], "オリックス・バファローズ": ["#EAE2F5", "#4D3570", "#9276B5"], "東北楽天ゴールデンイーグルス": ["#F9DFE4", "#85283A", "#C86A7B"], "埼玉西武ライオンズ": ["#DDEFFF", "#15588C", "#68A9D8"], "千葉ロッテマリーンズ": ["#ECEFF2", "#263746", "#8A98A5"], "読売ジャイアンツ": ["#FFE6D0", "#844000", "#E49450"], "阪神タイガース": ["#FFF4B8", "#635700", "#D4BC2D"], "横浜DeNAベイスターズ": ["#DDF2FF", "#12628F", "#64B4DD"], "広島東洋カープ": ["#FADDDD", "#962323", "#D96666"], "東京ヤクルトスワローズ": ["#DFF3E5", "#28633A", "#71B283"], "中日ドラゴンズ": ["#E1E9FF", "#294E9B", "#748FD2"], "日本代表": ["#E8EEF8", "#173B67", "#6F8FB4"], "近鉄": ["#F2E7D9", "#6B4322", "#B58B62"], "ブルーウェーブ": ["#DCEEFF", "#164D82", "#6EA6D5"]};
const PACIFIC=new Set(["福岡ソフトバンクホークス","北海道日本ハムファイターズ","オリックス・バファローズ","東北楽天ゴールデンイーグルス","埼玉西武ライオンズ","千葉ロッテマリーンズ"]);
const OTHER=new Set(["日本代表","近鉄","ブルーウェーブ"]);
let order=OUENKA_TEAM_ORDER.get();

function groupOf(team){
 if(PACIFIC.has(team))return "P";
 if(OTHER.has(team))return "O";
 return "C";
}
function render(){
 const box=document.getElementById("teamList");box.innerHTML="";
 [["パ・リーグ","P"],["セ・リーグ","C"],["その他","O"]].forEach(([label,key])=>{
   const h=document.createElement("div");h.className="league";h.textContent=label;box.appendChild(h);
   const teams=order.filter(x=>groupOf(x)===key);
   teams.forEach((team,i)=>{
     const row=document.createElement("div");row.className="team";
     const c=TEAM_COLORS[team];
     if(c){row.style.background=c[0];row.style.color=c[1];row.style.borderLeftColor=c[2]}
     row.innerHTML=`<span class="num">${String(i+1).padStart(2,"0")}</span><span class="name">${team}</span><button class="move">↑</button><button class="move">↓</button>`;
     const btns=row.querySelectorAll("button");
     btns[0].disabled=i===0;
     btns[1].disabled=i===teams.length-1;
     btns[0].onclick=()=>move(team,-1,key);
     btns[1].onclick=()=>move(team,1,key);
     box.appendChild(row);
   });
 });
}
function move(team,delta,key){
 const groups={
   P:order.filter(x=>groupOf(x)==="P"),
   C:order.filter(x=>groupOf(x)==="C"),
   O:order.filter(x=>groupOf(x)==="O")
 };
 const list=groups[key],i=list.indexOf(team),j=i+delta;
 if(j<0||j>=list.length)return;
 [list[i],list[j]]=[list[j],list[i]];
 order=[...groups.P,...groups.C,...groups.O];
 render();
}
document.getElementById("save").onclick=()=>{OUENKA_TEAM_ORDER.set(order);const n=document.getElementById("notice");n.style.display="block";setTimeout(()=>n.style.display="none",1800)};
document.getElementById("reset").onclick=()=>{order=[...OUENKA_TEAM_ORDER.DEFAULT];render()};
render();
</script>
<section style="margin:24px auto;max-width:650px;padding:16px;border:1px solid #789;border-radius:12px">
<h2>iPhone 音声復旧</h2><p>他のアプリから戻った後に音が出ない場合、ここから音声エンジンだけを再起動します。再生中の曲は停止します。</p>
<button type="button" id="audioResetButton" style="padding:12px 18px;font-size:16px;cursor:pointer">音声エンジンをリセット</button>
<p id="audioResetResult" role="status" aria-live="polite"></p>
</section>
<script src="audio-recovery.js?v=53"></script>
<script>document.getElementById('audioResetButton').addEventListener('click',async function(){
 const out=document.getElementById('audioResetResult');out.textContent='音声を確認中…';
 try{out.textContent=await window.ouenkaAudioRecovery.reset()}catch(e){out.textContent='復旧できませんでした: '+e.message+'。iOSの音声サービス側の問題の可能性があります。'}
});</script>
</body></html>
