<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f3b"><title>ルーム対戦 | 応援歌BASE</title><link rel="stylesheet" href="play.css?v=20261028-r289"><link rel="stylesheet" href="quiz-room.css?v=20261028-r289"><link rel="stylesheet" href="ui-r177.css?v=20261028-r289"><link rel="stylesheet" href="site-theme.css?v=20261028-r289"><script src="site-theme.js?v=20261028-r289"></script><link rel="stylesheet" href="site-settings.css?v=20261028-r289"><script defer src="site-settings.js?v=20261028-r289"></script><link rel="stylesheet" href="shared-navigation.css?v=20261028-r289"><script defer src="shared-navigation.js?v=20261028-r289"></script><link rel="stylesheet" href="titlebar-type.css?v=20261028-r289"><script defer src="field-state.js?v=20261028-r289"></script></head><body><header><a class="button secondary" href="play.html#quiz">◀戻る</a></header><main><div class="play-hero"><div class="eyebrow">OUENKA BASE</div><h1>応援歌クイズ ルーム対戦</h1><p>参加コードで集まって、同じ問題に挑戦！</p></div><p id="roomStatus" role="status" aria-live="polite"></p>
<section id="roomSetup" class="panel"><label>参加名<input id="roomName" maxlength="20" autocomplete="nickname" placeholder="20文字まで"></label><h2>ルームに参加</h2><div class="filters"><label>参加コード<input id="roomCode" maxlength="10" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="8文字のコード"></label></div><button id="roomJoin">参加する</button><hr><h2>ルームを作成</h2><div class="filters"><label>問題数の候補<select id="roomCountPreset"><option value="5">5問</option><option value="10" selected>10問</option><option value="20">20問</option><option value="30">30問</option><option value="50">50問</option><option value="100">100問</option><option value="custom">直接入力</option></select></label><label>問題数を入力<input id="roomCount" type="number" min="1" max="100" step="1" value="10" inputmode="numeric"></label><label>出題<select id="roomKind"><option value="audio">応援歌を聴く</option><option value="lyrics">歌詞を読む</option></select></label><label>選択肢<select id="roomChoices"><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></label><label>球団<select id="roomTeam"><option value="">すべての球団</option></select></label><label>対象<select id="roomActive"><option value="all">現役・現在未使用</option><option value="active">現役のみ</option><option value="ob">現在未使用のみ</option></select></label></div><div id="roomAudioSettings" class="filters"><label>長さ<select id="roomLength"><option value="s10">10秒</option><option value="s5">5秒</option><option value="s20">20秒</option><option value="b1">1小節</option><option value="b2">2小節</option><option value="b4">4小節</option><option value="b8">8小節</option><option value="b16">16小節</option></select></label><label>出題位置<select id="roomExcerpt"><option value="random">曲の途中から</option><option value="start">曲の最初から</option></select></label></div><div id="roomLyricsSettings" hidden><label>表示する歌詞<select id="roomLyricLines"><option value="2">2行</option><option value="1">1行</option><option value="all">全文</option></select></label></div><p class="muted">ランダム出題では最初の1小節と最後の2小節を流しません。問題数は1〜100問。指定数の問題が作れない場合は、条件を広げるか問題数を減らしてください。</p><button id="roomCreate">この条件でルームを作る</button><p class="muted">2〜12人で対戦。正解は1点、同点は同順位です。各端末で「応援歌を聴く」を押して再生します。ルームは作成から2時間有効です。</p></section>
<section id="roomBattle" class="panel" hidden><div class="room-code-bar"><div><small>参加コード</small><strong id="roomDisplayCode"></strong></div><button id="roomCopy" class="secondary">コードをコピー</button></div><p id="roomPhase" role="status"></p><div id="roomQuestion" hidden><h2 id="roomProgress"></h2><blockquote id="roomPrompt" hidden></blockquote><div class="toolbar"><button id="roomListen">▶ 応援歌を聴く</button><button id="roomStop" class="secondary">■ 停止</button></div><p id="roomAudioStatus" role="status"></p><div id="roomAnswers" class="choices"></div><p id="roomFeedback" role="status" aria-live="polite"></p></div><div id="roomHostActions" class="toolbar"><button id="roomStart">対戦を開始</button><button id="roomReveal" class="secondary" hidden>回答を締め切って正解を表示</button><button id="roomNext" hidden>次の問題へ</button></div><h2 id="roomRankingTitle">参加メンバー</h2><ol id="roomMembers" class="room-members"></ol><button id="roomLeave" class="secondary">ルームから退出</button><p class="muted">全員の回答後に正解を表示。進行はホストが操作します。通信が切れた場合は、このページを再読み込みすると再接続できます。</p></section></main><script src="audio-recovery.js?v=20261028-r289"></script><script src="ouenka-medley-core.js?v=20261028-r289"></script><script src="quiz-metadata.js?v=20261028-r289"></script><script src="quiz-rules.js?v=20261028-r289"></script><script src="play-audio.js?v=20261028-r289"></script><script src="songbook-store.js?v=20261028-r289"></script><script src="quiz-room.js?v=20261028-r289"></script><script src="team-colors.js?v=20261028-r289"></script><script src="popular-sync.js?v=20261028-r289"></script><script src="ui-r177.js?v=20261028-r289"></script></body></html>
