<!doctype html><html lang="ja"><head><script src="community-stats.js?v=20261031-r323"></script><script src="songbook-store.js?v=20261031-r323"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>応援歌ドラフト | OUENKA BASE</title><link rel="stylesheet" href="play.css?v=20261031-r323"><link rel="stylesheet" href="ui-r177.css?v=20261031-r323"><style>header{position:sticky;top:0;z-index:10;background:#071f3b;display:flex;gap:10px;padding:10px;align-items:center;color:white}.draft-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.draft-card{padding:14px;background:#fff;border:2px solid var(--team,#668);border-radius:10px;color:#123;width:100%;text-align:left}.draft-card.selected{outline:3px solid #0585df}.draft-card strong,.draft-card small{display:block;margin-bottom:6px}.draft-card p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.draft-slots{display:grid;gap:6px;padding:0;list-style:none}.draft-slots li{padding:10px;border-left:5px solid #0b609b;background:#eef5fb;display:flex;gap:10px;align-items:center}.draft-slots b{min-width:45px}.draft-slots span{flex:1}#draftAssign{display:flex;gap:10px;align-items:end;flex-wrap:wrap}#draftAssign label{flex:1;min-width:125px}#draftAssign select{width:100%}[hidden]{display:none!important}@media(max-width:420px){.draft-card{padding:10px}.draft-card strong{font-size:16px}}</style><link rel="stylesheet" href="site-theme.css?v=20261031-r323"><script src="site-theme.js?v=20261031-r323"></script><link rel="stylesheet" href="site-settings.css?v=20261031-r323"><script defer src="site-settings.js?v=20261031-r323"></script><link rel="stylesheet" href="shared-navigation.css?v=20261031-r323"><script defer src="shared-navigation.js?v=20261031-r323"></script><link rel="stylesheet" href="titlebar-type.css?v=20261031-r323"><script defer src="field-state.js?v=20261031-r323"></script></head><body><header><a class="button secondary" href="index.html">◀戻る</a><button id="draftRestart" class="secondary" hidden>再作成</button></header><main><div class="play-hero"><h1>応援歌ドラフト</h1><p>4曲から1曲を選んで、自分のスタメンを作ろう。</p></div><p id="draftStatus" role="status" aria-live="polite">応援歌を読み込んでいます…</p><section id="draftModePicker" class="panel"><div class="draft-mode-cards"><button id="draftSoloMode"><strong>1人でドラフト</strong><small>4〜10択の選ばれた応援歌から打順を組もう。</small></button><button id="draftMultiMode"><strong>みんなでドラフト</strong><small>みんなで選ばれた応援歌をみんなでドラフトしよう。</small></button></div></section><section id="draftSetup" class="panel" hidden><button id="draftBackModes" class="secondary">遊び方を選び直す</button><label>選択肢<select id="draftChoiceCount"><option value="4">4択</option><option value="5">5択</option><option value="6">6択</option><option value="7">7択</option><option value="8">8択</option><option value="9">9択</option><option value="10">10択</option></select></label><p>野手9人と投手1人（投手の入力は任意）。スキップは3回まで。</p><label>球団<select id="draftTeam"><option value="">すべての球団</option></select></label><button id="draftStart" disabled>ドラフト開始</button><button id="draftRetry" hidden>読み込みを再試行</button></section><section id="draftGame" class="panel" hidden><h2 id="draftProgress"></h2><div id="draftChoices" class="draft-cards"></div><div id="draftAssign" hidden><label>打順・投手枠<select id="draftOrder"></select></label><label id="draftPositionLabel">ポジション<select id="draftPosition"></select></label><button id="draftConfirm">この曲で指名</button></div><div class="toolbar"><button id="draftSkip" class="secondary">スキップ（残り3回）</button><button id="draftStop" class="secondary">■ 停止</button></div></section><section id="draftRoster" class="panel" hidden><h2>指名したスタメン</h2><ol id="draftSlots" class="draft-slots"></ol><button type="button" id="draftOmitPitcher" class="secondary" hidden>投手なしで完成</button><div id="draftResult" hidden><button type="button" id="draftAddPitcher" class="secondary" hidden>投手を追加（任意）</button><label>タイトル<input id="draftTitle" value="応援歌ドラフト スタメン" maxlength="80"></label><div class="toolbar"><button id="draftSave">スタメンを保存</button><button id="draftExport">JSONを保存</button></div><p>保存した野手9人は「1-9作成」の保存済みから読み込めます。投手は1枠で、未入力でも保存できます。</p></div></section></main><script src="audio-recovery.js?v=20261031-r323"></script><script src="ouenka-transport.js?v=20261031-r323"></script><script src="ouenka-medley-core.js?v=20261031-r323"></script>
