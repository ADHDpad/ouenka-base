<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>応援歌BASE｜挿絵作成</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#122b48;background:#edf3fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#071f3b;color:white;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header small{color:#bbd0e5}.header-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}.header-actions button{background:#076bdb;border:1px solid #4f9fe9;color:white;padding:10px 14px;border-radius:8px;font-weight:750}.header-actions button:disabled{opacity:.5}.back{border:1px solid #7a9bbd;background:#133c65;color:white;border-radius:8px;padding:9px 15px}.wrap{max-width:1420px;margin:auto;padding:16px}.tabs{display:flex;gap:5px;overflow-x:auto;align-items:end;border-bottom:3px solid #075bc5;padding-top:8px}.tab{flex:1;min-width:145px;background:#dbe7f5;color:#173b62;border:1px solid #b3c8df;border-bottom:0;border-radius:11px 11px 0 0;padding:13px 9px;font-weight:750}.tab.active{background:#0866ce;color:white;padding-top:17px}.panel{background:white;border:1px solid #d1dfed;border-radius:0 0 12px 12px;padding:20px;min-height:500px;box-shadow:0 6px 22px #102d5010}.section{background:#f5f9ff;border:1px solid #d5e4f3;border-radius:10px;padding:15px;margin-bottom:14px}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:5px;font-size:13px;font-weight:650}input:not([type=file]):not([type=color]),select,textarea{width:100%;border:1px solid #b5cbe0;border-radius:6px;padding:9px;background:white;color:#153451}textarea{min-height:105px;resize:vertical}.btn{border:0;background:#0669dc;color:white;border-radius:7px;padding:10px 15px;font-weight:700}.btn.alt{background:#e3edf8;color:#103d69;border:1px solid #b6cce2}.btn.danger{background:#fff0f0;color:#a32525;border:1px solid #eab5b5}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.hint{font-size:12px;color:#58718b}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:750px}th,td{border-bottom:1px solid #d7e4f1;padding:8px 5px;text-align:left;font-size:13px}th{background:#e6f0fa}td input{min-width:62px}.designs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.design{border:2px solid #c6d7e8;background:white;border-radius:10px;padding:9px;text-align:left;color:#173a60}.design.active{border-color:#0676f4;box-shadow:0 0 0 2px #b4d8ff}.thumb{height:95px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;margin-bottom:8px;white-space:pre-line;font-weight:850;border:1px solid #aac1d6}.thumb.stripes{background:repeating-linear-gradient(135deg,#082f5c 0 30px,#1268be 30px 35px,#082f5c 35px 58px)!important;color:white}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}.photoCard{border:1px solid #d2e1ef;border-radius:10px;padding:12px;background:white}.photoBox{height:135px;background:#e2eaf4;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#57718b;margin:8px 0}.photoBox img{width:100%;height:100%;object-fit:cover}.playerlist{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.playerlist button{white-space:nowrap;padding:8px 10px;background:#e8f1fa;border:1px solid #bfd2e4;border-radius:7px}.playerlist button.active{background:#0669dc;color:white}.stage{aspect-ratio:16/9;background:#082c56;color:white;display:grid;grid-template-columns:40% 60%;overflow:hidden;border:2px solid #b4c9dd;max-width:750px}.stage .pic{background:#17456d;display:flex;align-items:center;justify-content:center;color:#bed3e8;overflow:hidden}.stage img{width:100%;height:100%;object-fit:cover}.stage .info{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;text-align:center;padding:18px;gap:5px}.stage .info strong{font-size:clamp(17px,3vw,35px)}.stage .lyrics{white-space:pre-line;font-size:clamp(12px,1.5vw,20px);line-height:1.7}.stage.nophoto{grid-template-columns:1fr}.stage.nophoto .pic{display:none}.stage.light{background:#fff;color:#072e5e}.stage.pop{background:#073e74;color:#fff;border:12px solid #ffce2c}.stage .stats{font-size:clamp(10px,1.2vw,16px);border-top:2px solid currentColor;border-bottom:2px solid currentColor;padding:8px 0;width:100%}.stage.fade{animation:fadein var(--duration,0.6s) ease both}.stage.slide{animation:slidein var(--duration,0.6s) ease both}.stage.zoom{animation:zoomin var(--duration,0.6s) ease both}@keyframes fadein{from{opacity:0}to{opacity:1}}@keyframes slidein{from{transform:translateX(12%);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes zoomin{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:750px){.grid,.three{grid-template-columns:1fr}.wrap{padding:8px}.panel{padding:12px}.tab{min-width:125px;font-size:13px}.stage .info{padding:7px}.stage .lyrics{font-size:11px}}
</style></head><body><header><button class="back" id="back">← 戻る</button><div><h1>応援歌BASE｜挿絵作成</h1><small>インデックスタブ式・独立試作版</small></div><div class="header-actions"><button id="previewMovie">▶ 動画プレビュー</button><button id="saveMovie">⬇ 動画を保存</button></div></header><main class="wrap"><nav class="tabs" role="tablist" aria-label="編集メニュー"><button class="tab active" data-tab="0" role="tab">① 成績登録</button><button class="tab" data-tab="1" role="tab">② デザイン登録</button><button class="tab" data-tab="2" role="tab">③ 挿絵登録</button><button class="tab" data-tab="3" role="tab">④ アニメーション</button><button class="tab" data-tab="4" role="tab">⑤ 動画登録</button></nav><div id="content" class="panel"></div><section id="moviePanel" class="panel" style="display:none;margin-top:14px;border-radius:12px"><h2>動画プレビュー（試作）</h2><canvas id="movieCanvas" width="1280" height="720" style="display:block;width:100%;max-width:900px;aspect-ratio:16/9;background:#092747;border-radius:8px"></canvas><div class="toolbar"><button class="btn" id="playMovie">▶ 再生</button><button class="btn alt" id="stopMovie">■ 停止</button><span id="movieStatus" class="hint">小節を基準に切り替えを確認できます。音声は未接続です。</span></div></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['奈良間 大己','選手 2','選手 3','選手 4','選手 5','選手 6','選手 7','選手 8','選手 9'];const init=()=>({year:'2025',team:'北海道日本ハム',players:names.map((name,i)=>({name,order:i+1,position:i===0?'SS':'',avg:'',hr:'',rbi:'',sb:'',ops:'',lyrics:'',photo:'',photoEnabled:true})),design:'photo-1',color:'#073e74',accent:'#55aaff',colorFade:true,animation:'fade',duration:.6,segments:[{player:0,bar:1,design:'photo-1',animation:'fade'}]});let state;try{state=JSON.parse(localStorage.getItem('ouenka_studio_tabs_v1'))||init();if(!Array.isArray(state.players)||state.players.length<1)state=init()}catch{state=init()}// 1-9から開いた場合だけ、その打順をフォームへ引き継ぐ。
if(new URLSearchParams(location.search).get('from')==='lineup'){
 try{
  const imported=JSON.parse(localStorage.getItem('ouenkaBaseIllustrationV1')||'null');
  if(Array.isArray(imported?.rows)&&imported.rows.some(r=>r.name)&&imported.transferId!==state.importTransferId){
   const prior=state.players||[];
   state.players=imported.rows.map((r,i)=>{
    const old=prior.find(p=>p.name===r.name&&p.order===i+1)||{};
    return {...old,name:r.name||'',order:i+1,position:r.position||'',avg:old.avg||'',hr:old.hr||'',rbi:old.rbi||'',sb:old.sb||'',ops:old.ops||'',lyrics:r.lyrics||old.lyrics||'',photo:old.photo||'',photoEnabled:old.photoEnabled??true};
   });
   state.year=imported.year||'';state.team=imported.team||'';state.title=imported.title||'';
   state.segments=(state.segments||[]).filter(s=>s.player<state.players.length);
   state.importTransferId=imported.transferId;
   localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state));
  }
 }catch(e){alert('1-9の引継ぎデータを読み込めませんでした。保存設定を確認してください。')}
}
let tab=0,chosen=0;const save=()=>{try{localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state))}catch{alert('保存容量が不足しています。写真を減らしてください。')}};const teamColors={'北海道日本ハム':['#07569c','#6db7ec'],'福岡ソフトバンク':['#f4c21b','#202020'],'千葉ロッテ':['#171d25','#bfc8d1'],'東北楽天':['#8d1738','#f0bd76'],'オリックス':['#12325c','#b79b54'],'埼玉西武':['#173d77','#8bc1eb'],'読売':['#ef721c','#202020'],'阪神':['#f2c900','#202020'],'広島':['#b8202d','#eab0b4'],'中日':['#0755ac','#8cbbed'],'横浜DeNA':['#0873c6','#83d4f3'],'東京ヤクルト':['#176e47','#9ad0ad']};const designs=[['photo-1','① シンプル','写真あり'],['photo-4','④ スタイリッシュ','写真あり'],['photo-5','⑤ 歌詞カード風','写真あり'],['photo-7','⑦ ポップ','写真あり'],['photo-10','⑩ ミニマル','写真あり'],['none-1','① シンプル','写真なし'],['none-5','⑤ 歌詞カード風','写真なし']];const options=arr=>arr.map(x=>`<option value="${escape(x[0])}">${escape(x[1])}</option>`).join('');function playerOptions(selected){return state.players.map((p,i)=>`<option value="${i}" ${i===+selected?'selected':''}>${i+1}番 ${escape(p.name)}</option>`).join('')};function designOptions(selected){return designs.map(d=>`<option value="${d[0]}" ${d[0]===selected?'selected':''}>${d[1]}（${d[2]}）</option>`).join('')};function playerButtons(){return `<div class="playerlist">${state.players.map((p,i)=>`<button data-player="${i}" class="${chosen===i?'active':''}">${i+1} ${escape(p.name)}</button>`).join('')}</div>`};function statsTab(){return `<h2>① 成績登録</h2><div class="section"><h3>9選手の成績を一括編集</h3><div class="toolbar"><label class="field">年度<input id="year" value="${escape(state.year)}" style="width:120px"></label><label class="field">球団<input id="team" value="${escape(state.team)}" style="width:200px"></label><button class="btn" id="npb">NPB公式選手検索 ↗</button><button class="btn alt" id="npbBatch">NPB公式から9人を一括検索（試験）</button></div><p class="hint">一括検索はブラウザの外部サイト通信制限により失敗する場合があります。未確認の数値は登録しません。NPB公式の選手別年度記録を確認してください。</p><div class="scroll"><table><thead><tr><th>打順</th><th>選手名</th><th>守備</th><th>AVG</th><th>HR</th><th>RBI</th><th>SB</th><th>OPS</th></tr></thead><tbody>${state.players.map((p,i)=>`<tr><td>${i+1}</td>${['name','position','avg','hr','rbi','sb','ops'].map(k=>`<td><input data-stat="${i}" data-key="${k}" value="${escape(p[k])}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`};function designTab(){return `<h2>② デザイン登録</h2><div class="section"><h3>採用した7種類から選択</h3><div class="designs">${designs.map(d=>`<button class="design ${state.design===d[0]?'active':''}" data-design="${d[0]}"><div class="thumb ${d[0].includes('4')?'stripes':''}" style="background:${d[0].includes('5')||d[0].includes('10')?'#f6fbff':state.color};color:${d[0].includes('5')||d[0].includes('10')?'#073e74':'white'}">${d[2]==='写真あり'?'▣ PHOTO  |  ':''}58\n選手名\nAVG / HR / RBI</div><b>${d[1]}</b><div class="hint">${d[2]}</div></button>`).join('')}</div></div><div class="section"><h3>カラー設定</h3><div class="toolbar"><label class="field">メインカラー<input type="color" id="color" value="${escape(state.color)}"></label><label class="field">アクセントカラー<input type="color" id="accent" value="${escape(state.accent)}"></label></div><label style="display:block;margin:8px 0"><input type="checkbox" id="colorFade" ${state.colorFade?'checked':''} > 色を徐々に明るくする（動画中）</label><button class="btn alt" id="teamColor">球団の初期カラーに戻す</button><button class="btn alt" id="previewDesign">デザインをプレビュー</button><div id="designPreview" style="margin-top:12px"></div></div>`};function photoTab(){return `<h2>③ 挿絵登録</h2><p class="hint">9選手それぞれの写真をアルバムから選択できます。写真は透過せず長方形のまま表示します。</p><div class="photos">${state.players.map((p,i)=>`<div class="photoCard"><b>${i+1}番　${escape(p.name)}</b><div class="photoBox">${p.photo?`<img src="${p.photo}" alt="${escape(p.name)}">`:'写真未登録'}</div><label><input type="checkbox" data-photoenabled="${i}" ${p.photoEnabled?'checked':''}> 写真を使用する</label><div class="toolbar"><label class="btn" style="cursor:pointer">写真を選択<input type="file" accept="image/*" data-photo="${i}" hidden></label><button class="btn danger" data-clearphoto="${i}">削除</button></div></div>`).join('')}</div>`};function animationTab(){return `<h2>④ アニメーション</h2><div class="grid"><div class="section"><h3>切り替え演出を選択</h3>${[['none','瞬時に切り替え'],['fade','フェード'],['slide','スライド'],['zoom','ズーム']].map(a=>`<label style="display:block;padding:10px"><input type="radio" name="animation" value="${a[0]}" ${state.animation===a[0]?'checked':''}> ${a[1]}</label>`).join('')}<label class="field">切り替え時間（秒）<input type="number" id="duration" min="0" max="3" step="0.1" value="${state.duration}"></label><div class="toolbar"><button class="btn" id="playAnimation">アニメーションを確認</button></div></div><div class="section"><h3>プレビュー</h3><div id="animationPreview"></div><p class="hint">アニメーションは映像の切り替えにだけ適用。既存の1-9音源再生方式には影響しません。</p></div></div>`};function videoTab(){return `<h2>⑤ 動画登録｜小節ごとの挿絵切り替え</h2><div class="section"><h3>切り替え区間</h3><p class="hint">開始小節を指定して、選手・デザイン・演出を設定します。曲の長さは後で実際のMIDI情報と照合します。</p><div class="scroll"><table><thead><tr><th>選手</th><th>開始小節</th><th>デザイン</th><th>演出</th><th>操作</th></tr></thead><tbody>${state.segments.map((s,i)=>`<tr><td><select data-seg="${i}" data-key="player">${playerOptions(s.player)}</select></td><td><input type="number" min="1" max="128" value="${s.bar}" data-seg="${i}" data-key="bar"></td><td><select data-seg="${i}" data-key="design">${designOptions(s.design)}</select></td><td><select data-seg="${i}" data-key="animation">${options([['none','瞬時'],['fade','フェード'],['slide','スライド'],['zoom','ズーム']])}</select></td><td><button class="btn danger" data-remove="${i}">削除</button></td></tr>`).join('')}</tbody></table></div><div class="toolbar"><button class="btn" id="addSegment">＋ 切り替えを追加</button><button class="btn alt" id="export">設定をJSON保存</button></div></div><div class="section"><h3>歌詞の編集（選手別）</h3>${playerButtons()}<label class="field">${escape(state.players[chosen].name)} の歌詞<textarea id="lyrics" placeholder="1-9から取得する予定の歌詞を入力">${escape(state.players[chosen].lyrics)}</textarea></label></div><div class="section"><h3>挿絵プレビュー</h3><div id="videoPreview"></div><p class="hint">この試作では動画のMP4出力・音源との同期は未実装です。</p></div>`};function preview(p,design,animation='none'){const noPhoto=design.startsWith('none-')||!p.photoEnabled;const light=design.includes('5')||design.includes('10');const cls=`stage ${noPhoto?'nophoto':''} ${light?'light':''} ${design.includes('7')?'pop':''} ${animation}`;const stats=`AVG ${p.avg||'---'}　HR ${p.hr||'-'}　RBI ${p.rbi||'-'}　SB ${p.sb||'-'}　OPS ${p.ops||'---'}`;return `<div class="${cls}" style="${!light?`background:${state.color};`:''}--duration:${state.duration}s"><div class="pic">${p.photo?`<img src="${p.photo}" alt="">`:'写真を選択'}</div><div class="info"><div>${escape(state.team)}</div><strong>${escape(p.name)}</strong><div>${p.order}番　${escape(p.position||'—')}</div><div class="stats">${escape(stats)}</div><div class="lyrics">${escape(p.lyrics||'ここに応援歌の歌詞を表示\n（最大4行を標準想定）')}</div></div></div>`};function render(){document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('active',i===tab);b.setAttribute('aria-selected',String(i===tab))});$('content').innerHTML=[statsTab,designTab,photoTab,animationTab,videoTab][tab]();if(tab===1)$('designPreview').innerHTML=preview(state.players[chosen],state.design);if(tab===3)$('animationPreview').innerHTML=preview(state.players[chosen],state.design);if(tab===4){$('videoPreview').innerHTML=preview(state.players[chosen],state.segments.find(s=>+s.player===chosen)?.design||state.design);$('content').querySelectorAll('[data-seg][data-key="animation"]').forEach(el=>el.value=state.segments[+el.dataset.seg].animation)}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});$('back').textContent='← 1-9に戻る';$('back').onclick=()=>{location.href='./1-9.html'};
$('content').addEventListener('input',e=>{const t=e.target;if(t.dataset.stat!==undefined){state.players[+t.dataset.stat][t.dataset.key]=t.value;save()}else if(t.id==='year'||t.id==='team'){state[t.id]=t.value;if(t.id==='team'){const c=Object.entries(teamColors).find(([name])=>t.value.includes(name));if(c){state.color=c[1][0];state.accent=c[1][1]}}save()}else if(t.id==='color'||t.id==='accent'){state[t.id]=t.value;save()}else if(t.id==='colorFade'){state.colorFade=t.checked;save()}else if(t.id==='duration'){state.duration=Math.max(0,Math.min(3,Number(t.value)||0));save()}else if(t.id==='lyrics'){state.players[chosen].lyrics=t.value;save()}else if(t.dataset.seg!==undefined){const s=state.segments[+t.dataset.seg];s[t.dataset.key]=['bar','player'].includes(t.dataset.key)?Number(t.value):t.value;save()}else if(t.dataset.photoenabled!==undefined){state.players[+t.dataset.photoenabled].photoEnabled=t.checked;save()}else if(t.name==='animation'){state.animation=t.value;save()}});
$('content').addEventListener('change',async e=>{const t=e.target;if(t.dataset.photo!==undefined){const f=t.files?.[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,1000/im.width,1000/im.height);c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.players[+t.dataset.photo].photo=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);save();render()};im.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした')};im.src=url}else if(t.dataset.seg!==undefined){const s=state.segments[+t.dataset.seg];s[t.dataset.key]=['bar','player'].includes(t.dataset.key)?Number(t.value):t.value;save()}});
$('content').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='npb'){window.open('https://npb.jp/bis/players/index.html','_blank','noopener,noreferrer')}else if(t.id==='npbBatch'){npbBatch()}else if(t.id==='teamColor'){const c=Object.entries(teamColors).find(([name])=>state.team.includes(name));if(c){state.color=c[1][0];state.accent=c[1][1];save();render()}else alert('球団名から色を特定できませんでした。')} else if(t.dataset.design){state.design=t.dataset.design;save();render()}else if(t.dataset.clearphoto!==undefined){state.players[+t.dataset.clearphoto].photo='';save();render()}else if(t.dataset.player!==undefined){chosen=+t.dataset.player;render()}else if(t.id==='previewDesign'){render()}else if(t.id==='playAnimation'){const el=$('animationPreview');el.innerHTML=preview(state.players[chosen],state.design,state.animation)}else if(t.id==='addSegment'){state.segments.push({player:chosen,bar:1,design:state.design,animation:state.animation});save();render()}else if(t.dataset.remove!==undefined){state.segments.splice(+t.dataset.remove,1);save();render()}else if(t.id==='export'){const blob=new Blob([JSON.stringify({...state,players:state.players.map(p=>({...p,photo:p.photo?'[画像データ省略]':''}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='挿絵設定_試作.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
// NPB検索: 同一オリジン制限を正しく検出し、架空データを登録しない。
async function npbBatch(){
 const btn=$('npbBatch');btn.disabled=true;btn.textContent='NPB公式を照会中…';
 let imported=0;let blocked=false;
 for(let i=0;i<state.players.length;i++){
  const p=state.players[i];if(!p.name||/^選手\s*\d+$/.test(p.name))continue;
  try{
   const u='https://npb.jp/bis/players/search/result?search_keyword='+encodeURIComponent(p.name.replace(/\s/g,''));
   const res=await fetch(u,{mode:'cors',signal:AbortSignal.timeout(4500)});
   if(!res.ok)throw Error('HTTP '+res.status);
   // 検索結果だけでは選手ID・年度の確定ができない。誤登録を避ける。
   await res.text();
  }catch(e){blocked=true;break}
 }
 btn.disabled=false;btn.textContent='NPB公式から9人を一括検索（試験）';
 alert(blocked?'NPB公式サイトへのブラウザ直接アクセスが制限されました。自動登録には専用の取得APIが必要です。数値は変更していません。':'NPBの検索結果にはアクセスできましたが、選手・年度の同定が未実装のため、数値は登録していません。');
}
// 音源とは独立した試作動画。4拍×8小節×1人の仮タイムライン。
const movieCanvas=$('movieCanvas'),mctx=movieCanvas.getContext('2d');
let movieRAF=0,movieStart=0,movieRecorder=null,movieStream=null;
const movieImages=new Map();
function movieImage(src){if(!src)return null;if(!movieImages.has(src)){const im=new Image();im.src=src;movieImages.set(src,im)}return movieImages.get(src)}
function hexToRgb(h){const v=h.replace('#','');return [0,2,4].map(i=>parseInt(v.slice(i,i+2),16)||0)}
function brighten(h,t){const a=hexToRgb(h);return 'rgb('+a.map(v=>Math.round(v+(255-v)*t)).join(',')+')'}
function movieText(txt,x,y,size,color='#fff',align='center',weight=700){mctx.font=`${weight} ${size}px sans-serif`;mctx.textAlign=align;mctx.fillStyle=color;mctx.fillText(String(txt),x,y)}
function drawMovie(time){
 const ctx=mctx,w=1280,h=720;ctx.clearRect(0,0,w,h);
 const barsPerPlayer=8,secPerBar=1.35,secPerPlayer=barsPerPlayer*secPerBar,total=state.players.length*secPerPlayer;
 const sec=Math.max(0,Math.min(time,total-.001)),pi=Math.floor(sec/secPerPlayer),local=sec-pi*secPerPlayer,bar=Math.floor(local/secPerBar)+1;
 const p=state.players[pi];const seq=state.segments.filter(s=>+s.player===pi&&+s.bar<=bar).sort((a,b)=>+a.bar-+b.bar);
 const seg=seq.at(-1),design=seg?.design||state.design,noPhoto=design.startsWith('none-')||!p.photoEnabled;
 const light=design.includes('5')||design.includes('10');const base=light?'#f6faff':state.color;
 const grad=ctx.createLinearGradient(0,0,1280,720);grad.addColorStop(0,base);grad.addColorStop(1,state.colorFade?brighten(base,Math.min(.42,local/secPerPlayer*.42)):base);ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);
 const fg=light?'#082d57':'#fff';let infoX=0,infoW=1280;
 if(!noPhoto){infoX=480;infoW=800;ctx.fillStyle='#173a5b';ctx.fillRect(0,0,480,720);const im=movieImage(p.photo);if(im?.complete&&im.naturalWidth){const sc=Math.max(480/im.width,720/im.height),sw=480/sc,sh=720/sc;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,480,720)}else movieText('写真未登録',240,365,32,'#c5d9eb')}
 if(design.includes('4')){ctx.fillStyle=state.accent;ctx.fillRect(infoX+22,0,9,720)}
 if(design.includes('7')){ctx.fillStyle='#f4c827';ctx.fillRect(infoX,420,infoW,65)}
 const mid=infoX+infoW/2;
 movieText(state.team,mid,75,34,fg);movieText(`${p.order}番　${p.position||'—'}`,mid,145,35,fg);
 movieText(p.name,mid,245,58,fg);
 ctx.strokeStyle=state.accent;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(infoX+45,285);ctx.lineTo(1240,285);ctx.stroke();
 movieText(`AVG ${p.avg||'---'}    HR ${p.hr||'-'}    RBI ${p.rbi||'-'}    SB ${p.sb||'-'}    OPS ${p.ops||'---'}`,mid,348,25,fg);
 const lyrics=(p.lyrics||'応援歌の歌詞を入力してください').split('\n').slice(0,6);
 lyrics.forEach((l,i)=>movieText(l,mid,460+i*47,Math.min(noPhoto?36:31,34),fg));
 // 小節切替時に指定されたフェード／スライド／ズームを描画側に適用
 if(seg){const since=(bar-Number(seg.bar))*secPerBar+local%secPerBar;const d=Math.max(.01,Number(state.duration)||.6);const v=Math.max(0,1-Math.min(1,since/d));if(seg.animation==='fade'){ctx.fillStyle=`rgba(0,0,0,${v})`;ctx.fillRect(0,0,w,h)}else if(seg.animation==='slide'){ctx.fillStyle=base;ctx.fillRect(w*(1-v),0,w*v,h)}else if(seg.animation==='zoom'){ctx.fillStyle=`rgba(255,255,255,${v*.35})`;ctx.fillRect(0,0,w,h)}}
 ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,690,w,30);movieText(`${pi+1}番 ${p.name}　${bar}小節目　${sec.toFixed(1)} / ${total.toFixed(1)}秒`,640,712,17,'white');
 return total;
}
function stopMovie(){if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=0;if(movieRecorder?.state==='recording')movieRecorder.stop();}
function startMovie(record=false){
 stopMovie();$('moviePanel').style.display='block';$('movieStatus').textContent=record?'動画を生成しています。画面を閉じずにお待ちください。':'動画を再生中（音声なし・仮の小節時間）';
 movieStart=performance.now();drawMovie(0);
 if(record){if(!movieCanvas.captureStream||!window.MediaRecorder){alert('このブラウザは動画書き出しに対応していません。');return}
  movieStream=movieCanvas.captureStream(30);
  const types=['video/mp4;codecs=avc1.42E01E','video/webm;codecs=vp9','video/webm'];const type=types.find(t=>MediaRecorder.isTypeSupported(t));
  if(!type){alert('このブラウザには対応する動画形式がありません。');return}
  const chunks=[];movieRecorder=new MediaRecorder(movieStream,{mimeType:type});
  movieRecorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  movieRecorder.onstop=()=>{movieStream?.getTracks().forEach(t=>t.stop());if(!chunks.length)return;const blob=new Blob(chunks,{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='応援歌BASE_挿絵動画_試作.'+(type.includes('mp4')?'mp4':'webm');a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);$('movieStatus').textContent='保存が完了しました（音声なしの試作動画）。'};
  movieRecorder.start(1000);
 }
 function tick(now){const sec=(now-movieStart)/1000,total=drawMovie(sec);if(sec<total){movieRAF=requestAnimationFrame(tick)}else{movieRAF=0;if(movieRecorder?.state==='recording')movieRecorder.stop();else $('movieStatus').textContent='プレビュー終了'}}
 movieRAF=requestAnimationFrame(tick);
 $('moviePanel').scrollIntoView({behavior:'smooth',block:'start'});
}
$('previewMovie').onclick=()=>startMovie(false);$('saveMovie').onclick=()=>startMovie(true);$('playMovie').onclick=()=>startMovie(false);$('stopMovie').onclick=()=>{stopMovie();$('movieStatus').textContent='停止しました'};
render();})();
</script></body></html>
