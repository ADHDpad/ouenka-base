 const aliases={'日本ハム':'北海道日本ハムファイターズ','日ハム':'北海道日本ハムファイターズ','ソフトバンク':'福岡ソフトバンクホークス','楽天':'東北楽天ゴールデンイーグルス','西武':'埼玉西武ライオンズ','ロッテ':'千葉ロッテマリーンズ','オリックス':'オリックス・バファローズ','巨人':'読売ジャイアンツ','読売':'読売ジャイアンツ','阪神':'阪神タイガース','DeNA':'横浜DeNAベイスターズ','横浜':'横浜DeNAベイスターズ','広島':'広島東洋カープ','中日':'中日ドラゴンズ','ヤクルト':'東京ヤクルトスワローズ','近鉄':'大阪近鉄バファローズ','ブルーウェーブ':'オリックス・ブルーウェーブ','侍ジャパン':'日本代表'};

}

let jerseyCatalogStarted=false;async function fillJerseys(){if(jerseyCatalogStarted)return;jerseyCatalogStarted=true;try{const r=await fetch('https://ouenka-base-data.ninzin5600.workers.dev/songs');if(!r.ok)return;const data=await r.json();for(const p of state.players){if(String(p.jerseyNumber??''))continue;const song=data.songs?.find(s=>normalizeSelectedName(s.player_name||s.name)===normalizeSelectedName(p.registeredName||p.name)&&String(s.production_number||s.productionNumber||1)===String(p.productionNumber||1));if(song)p.jerseyNumber=String(song.uniform_number??song.uniformNumber??song.jerseyNumber??'')}save();render()}catch{}}fillJerseys();
function statsTab(){return `<h2>① 成績登録</h2><div class="section"><h3>選手の成績を一括取得・編集</h3><p class="hint">キャリアハイは1年分の成績です。打者は300打席以上でOPS最高、投手は50投球回以上で防御率最低の年。該当年がなければ最多打席・最多投球回の年を使います。NPB公式データ（取得日：${window.OuenkaNpbDirectory?.retrievedAt?new Date(window.OuenkaNpbDirectory.retrievedAt).toLocaleDateString('ja-JP'):'—'}）を使用します。球団の指定は不要です。選手名と指定年でNPB一軍成績を探し、同じ年に移籍した選手は全球団分を合算します。「動画の表示名」は自由に変更できます。再生する応援歌・順番は1-9画面で選んだ内容を使用します。</p><div class="toolbar"><label class="field">年度<select id="year" style="width:180px">${yearOptions()}</select></label><button class="btn alt" id="npbBatch">NPB公式から成績を一括取得</button></div><p class="hint">投手・Pは投手成績、それ以外は打撃成績を取得します。二刀流などは「成績の種類」で切り替えられます。打順表示は9番まで。10人目以降はポジションだけ表示します。未取得の選手の数値は変更しません。</p><p class="hint">WHIP＝（被安打＋四球）÷投球回。NPB公式の数値から計算し小数第2位まで表示します。投球回0は「-」。</p><p id="npbStatus" class="hint"></p></div>${statsTable(false)}${statsTable(true)}`};function teamThemePicker(){return `<section class="section"><h3>球団カラー</h3><div class="toolbar"><label class="field theme-team-field">球団を選択<select id="designTeam">${teamOptions()}</select></label><label class="player-color-toggle"><input type="checkbox" id="playerTeamColors" ${state.playerTeamColors?'checked':''}><span>選手ごとにカラーを設定</span></label><div class="theme-swatches" aria-label="現在の球団カラー"><span style="background:${escape(state.teamDark)}" title="濃い背景色"></span><span style="background:${escape(state.color)}" title="メインカラー"></span><span style="background:${escape(state.accent)}" title="アクセントカラー"></span></div><button type="button" class="btn alt" id="teamColor">球団の初期カラーに戻す</button></div><p class="hint">選ぶと各案の背景・区切り線・アクセントと保存動画に反映します。成績は選手名と年度で取得します。文字色は白で統一しています。</p></section>`}
let designPage=null;const sceneDesignPages=new WeakMap();const DESIGN_PAGE_SIZE=10;
function designPicker(p,sceneIndex=null){const scene=sceneIndex===null?null:state.segments[sceneIndex],selected=scene?scene.design:state.design,pages=Math.ceil(designs.length/DESIGN_PAGE_SIZE);let page=scene?sceneDesignPages.get(scene):designPage;if(page==null)page=Math.max(0,Math.floor(designs.findIndex(d=>d[0]===selected)/DESIGN_PAGE_SIZE));page=Math.max(0,Math.min(pages-1,page));if(scene)sceneDesignPages.set(scene,page);else designPage=page;
const controls=`<nav class="design-pagination" aria-label="フォーマットのページ"><button type="button" class="btn alt" data-design-page="${page-1}" ${page===0?'disabled':''}>◀ 前へ</button>${Array.from({length:pages},(_,i)=>`<button type="button" class="btn ${i===page?'':'alt'}" data-design-page="${i}" ${i===page?'aria-current="page"':''}>${i+1}</button>`).join('')}<button type="button" class="btn alt" data-design-page="${page+1}" ${page===pages-1?'disabled':''}>次へ ▶</button><span role="status" aria-live="polite">${page+1} / ${pages}ページ（全${designs.length}種類）</span></nav>`;

function drawPhotoCredit(ctx,credit,rect){if(!credit||!rect)return;const [x,y,w,h]=rect;ctx.save();ctx.shadowColor='transparent';ctx.fillStyle='rgba(0,0,0,.8)';ctx.fillRect(x+4,y+h-35,w-8,31);ctx.font='10px sans-serif';ctx.fillStyle='#ffffff';ctx.textAlign='left';ctx.fillText('Photo: '+credit.author+' / '+credit.license,x+9,y+h-22,w-20);ctx.fillText(credit.sourceShort+' / cropped, resized',x+9,y+h-8,w-20);ctx.restore()}

function photoAdjustControls(p,kind,index,includePreview=true){return `<div class="section photo-adjust" style="padding:9px;margin-top:8px"><b>表示変更</b>${[['photoZoom','大きさ',.5,3,.01,1],['photoX','左右位置',-100,100,1,0],['photoY','上下位置',-100,100,1,0]].map(([key,label,min,max,step,def])=>`<label class="field">${label}<input type="range" min="${min}" max="${max}" step="${step}" value="${p[key]??def}" data-crop-kind="${kind}" data-crop-index="${index}" data-crop-key="${key}"><output data-crop-output="${kind}-${index}-${key}">${key==='photoZoom'?Math.round((p[key]??def)*100)+'%':p[key]??def}</output></label>`).join('')}<button type="button" class="btn alt" data-crop-reset="${kind}" data-crop-index="${index}">大きさ・位置をリセット</button>${includePreview?`<canvas data-crop-preview="${kind}-${index}" width="640" height="360" style="display:block;width:100%;height:auto;aspect-ratio:16/9;margin-top:8px;background:#071d33"></canvas>`:''}</div>`}

function photoTab(){return `<h2>③ 挿絵登録</h2><p class="hint">選手ごとに写真を登録し、横の表示変更で大きさ・上下左右の位置を調整できます。</p><div class="photo-register-list">${state.players.map((p,i)=>`<div class="photo-register-row"><div class="photo-register-meta"><b>${escape(playerLabel(p,i))}</b>${photoCreditHtml(p)}<label><input type="checkbox" data-photoenabled="${i}" ${p.photoEnabled?'checked':''}> 写真を使用する</label><div class="toolbar"><label class="btn" style="cursor:pointer">写真を選択<input type="file" accept="image/*" data-photo="${i}" hidden></label><button class="btn danger" data-clearphoto="${i}">削除</button></div><small class="hint">${p.photo?'写真登録済み':'写真未登録'}</small></div><div class="photo-register-adjust">${photoAdjustControls(p,'player',i,false)}</div><div class="photo-register-preview"><b>挿絵プレビュー</b><canvas data-crop-preview="player-${i}" width="640" height="360" style="display:block;width:100%;height:auto;aspect-ratio:16/9;margin-top:8px;background:#071d33"></canvas></div></div>`).join('')}</div>`};const ANIMATIONS=[['cinema','シネマ・ゆっくり寄せる'],['diagonal-reveal','斜めに開く'],['curtain','中央からカーテン'],['float-in','ふわっと浮かび上がる'],['none','瞬時に切り替え'],['fadein','フェードイン'],['slide','右からスライド'],['slide-left','左からスライド'],['slide-up','下からスライド'],['slide-down','上からスライド'],['zoom','ズームイン'],['zoom-out','ズームアウト'],['wipe-right','左からワイプ'],['wipe-left','右からワイプ'],['iris','円形に開く'],['pop','ポップアップ']];

function applySceneAnimation(ctx,mode,progress,w=1280,h=720){const p=Math.max(0,Math.min(1,progress)),ease=p*p*p*(p*(p*6-15)+10);if(p>=1||mode==='none')return;switch(mode){case 'cinema':{const scale=1.06-.06*ease;ctx.translate(w*(1-scale)/2,h*(1-scale)/2);ctx.scale(scale,scale);ctx.globalAlpha=Math.min(1,p*3);break}case 'diagonal-reveal':{const edge=(w+h)*(ease);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(edge,0);ctx.lineTo(edge-h,h);ctx.lineTo(0,h);ctx.closePath();ctx.clip();break}case 'curtain':ctx.beginPath();ctx.rect(w*(1-ease)/2,0,w*ease,h);ctx.clip();break;case 'float-in':ctx.translate(0,h*.055*(1-ease));ctx.globalAlpha=ease;break;case 'fadein':ctx.globalAlpha=ease;break;case 'slide':ctx.translate(w*(1-ease),0);break;case 'slide-left':ctx.translate(-w*(1-ease),0);break;case 'slide-up':ctx.translate(0,h*(1-ease));break;case 'slide-down':ctx.translate(0,-h*(1-ease));break;case 'zoom':case 'zoom-out':case 'pop':{let scale=mode==='zoom'?.78+.22*ease:mode==='zoom-out'?1.24-.24*ease:.75+.25*(1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2));ctx.translate(w*(1-scale)/2,h*(1-scale)/2);ctx.scale(scale,scale);if(mode==='pop')ctx.globalAlpha=Math.min(1,p*4);break}case 'wipe-right':ctx.beginPath();ctx.rect(0,0,w*ease,h);ctx.clip();break;case 'wipe-left':ctx.beginPath();ctx.rect(w*(1-ease),0,w*ease,h);ctx.clip();break;case 'iris':ctx.beginPath();ctx.arc(w/2,h/2,Math.hypot(w,h)/2*ease,0,Math.PI*2);ctx.clip();break}}
async function playAnimationPreview(){if(state.animation==='none'){const host=$('animationPreview');host.innerHTML=preview(state.players[chosen],state.design)+'<p role="status">演出なしを選択中です。動きを確認するにはフェードインなどを選択してください。</p>';return}try{await loadSelectedFonts()}catch(e){alert(e.message);return}if(animationPreviewRAF)cancelAnimationFrame(animationPreviewRAF);const host=$('animationPreview');host.innerHTML='<canvas id="animationCanvas" width="1280" height="720" style="display:block;width:100%;aspect-ratio:16/9"></canvas>';const canvas=$('animationCanvas'),ctx=canvas.getContext('2d'),started=performance.now(),duration=Math.max(0,Number(state.duration)||0)*1000,card=document.createElement('canvas');card.width=1280;card.height=720;renderPlayerCard(card.getContext('2d'),state.players[chosen],state.design);const previousCard=document.createElement('canvas');previousCard.width=1280;previousCard.height=720;if(state.players.length>1)renderPlayerCard(previousCard.getContext('2d'),state.players[chosen>0?chosen-1:state.players.length-1],state.design);else{const previousContext=previousCard.getContext('2d');previousContext.fillStyle=state.teamDark||'#071f3b';previousContext.fillRect(0,0,1280,720)}function tick(now){if(!$('animationCanvas')||$('animationCanvas')!==canvas)return;const p=duration?Math.min(1,(now-started)/duration):1;ctx.drawImage(previousCard,0,0);ctx.save();applySceneAnimation(ctx,state.animation,p);ctx.drawImage(card,0,0);ctx.restore();animationPreviewRAF=p<1?requestAnimationFrame(tick):0}tick(started)}
