<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>応援歌BASE｜挿絵作成</title><style>
:root{font-family:system-ui,'Yu Gothic',sans-serif;color:#122b48;background:#edf3fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:#071f3b;color:white;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header small{color:#bbd0e5}.header-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}.header-actions button{background:#076bdb;border:1px solid #4f9fe9;color:white;padding:10px 14px;border-radius:8px;font-weight:750}.header-actions button:disabled{opacity:.5}.back{border:1px solid #7a9bbd;background:#133c65;color:white;border-radius:8px;padding:9px 15px}.wrap{max-width:1420px;margin:auto;padding:16px}.tabs{display:flex;gap:5px;overflow-x:auto;align-items:end;border-bottom:3px solid #075bc5;padding-top:8px}.tab{flex:1;min-width:145px;background:#dbe7f5;color:#173b62;border:1px solid #b3c8df;border-bottom:0;border-radius:11px 11px 0 0;padding:13px 9px;font-weight:750}.tab.active{background:#0866ce;color:white;padding-top:17px}.panel{background:white;border:1px solid #d1dfed;border-radius:0 0 12px 12px;padding:20px;min-height:500px;box-shadow:0 6px 22px #102d5010}.section{background:#f5f9ff;border:1px solid #d5e4f3;border-radius:10px;padding:15px;margin-bottom:14px}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:grid;gap:5px;font-size:13px;font-weight:650}input:not([type=file]):not([type=color]),select,textarea{width:100%;border:1px solid #b5cbe0;border-radius:6px;padding:9px;background:white;color:#153451}textarea{min-height:105px;resize:vertical}.btn{border:0;background:#0669dc;color:white;border-radius:7px;padding:10px 15px;font-weight:700}.btn.alt{background:#e3edf8;color:#103d69;border:1px solid #b6cce2}.btn.danger{background:#fff0f0;color:#a32525;border:1px solid #eab5b5}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}.hint{font-size:12px;color:#58718b}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:750px}th,td{border-bottom:1px solid #d7e4f1;padding:8px 5px;text-align:left;font-size:13px}th{background:#e6f0fa}td input{min-width:62px}.designs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.design{border:2px solid #c6d7e8;background:white;border-radius:10px;padding:9px;text-align:left;color:#173a60}.design.active{border-color:#0676f4;box-shadow:0 0 0 2px #b4d8ff}.thumb{height:95px;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;margin-bottom:8px;white-space:pre-line;font-weight:850;border:1px solid #aac1d6}.thumb.stripes{background:repeating-linear-gradient(135deg,#082f5c 0 30px,#1268be 30px 35px,#082f5c 35px 58px)!important;color:white}.photos{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:10px}.photoCard{border:1px solid #d2e1ef;border-radius:10px;padding:12px;background:white}.photoBox{height:135px;background:#e2eaf4;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#57718b;margin:8px 0}.photoBox img{width:100%;height:100%;object-fit:cover}.playerlist{display:flex;gap:6px;overflow:auto;margin-bottom:12px}.playerlist button{white-space:nowrap;padding:8px 10px;background:#e8f1fa;border:1px solid #bfd2e4;border-radius:7px}.playerlist button.active{background:#0669dc;color:white}.stage{aspect-ratio:16/9;background:#082c56;color:white;display:grid;grid-template-columns:40% 60%;overflow:hidden;border:2px solid #b4c9dd;max-width:750px}.stage .pic{background:#17456d;display:flex;align-items:center;justify-content:center;color:#bed3e8;overflow:hidden}.stage img{width:100%;height:100%;object-fit:cover}.stage .info{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;text-align:center;padding:18px;gap:5px}.stage .info strong{font-size:clamp(17px,3vw,35px)}.stage .lyrics{white-space:pre-line;font-size:clamp(12px,1.5vw,20px);line-height:1.7}.stage.nophoto{grid-template-columns:1fr}.stage.nophoto .pic{display:none}.stage.light{background:#fff;color:#072e5e}.stage.pop{background:#073e74;color:#fff;border:12px solid #ffce2c}.stage .stats{font-size:clamp(10px,1.2vw,16px);border-top:2px solid currentColor;border-bottom:2px solid currentColor;padding:8px 0;width:100%}.stage.slide{animation:slidein var(--duration,0.6s) ease both}.stage.zoom{animation:zoomin var(--duration,0.6s) ease both}@keyframes slidein{from{transform:translateX(12%);opacity:0}to{transform:translateX(0);opacity:1}}@keyframes zoomin{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}@media(max-width:750px){.grid,.three{grid-template-columns:1fr}.wrap{padding:8px}.panel{padding:12px}.tab{min-width:125px;font-size:13px}.stage .info{padding:7px}.stage .lyrics{font-size:11px}}

</style></head><body><header><button class="back" id="back">← 戻る</button><div><h1>応援歌BASE｜挿絵作成</h1><small>インデックスタブ式・独立試作版</small></div><div class="header-actions"><button id="previewMovie">▶ 動画プレビュー</button><button id="saveMovie">⬇ 動画を保存</button></div></header><main class="wrap"><nav class="tabs" role="tablist" aria-label="編集メニュー"><button class="tab active" data-tab="0" role="tab">① 成績登録</button><button class="tab" data-tab="1" role="tab">② デザイン登録</button><button class="tab" data-tab="2" role="tab">③ 挿絵登録</button><button class="tab" data-tab="3" role="tab">④ アニメーション</button><button class="tab" data-tab="4" role="tab">⑤ 動画登録</button><button class="tab" data-tab="5" role="tab">⑥ タイトル</button><button class="tab" data-tab="6" role="tab">⑦ サムネ</button></nav><div id="content" class="panel"></div><section id="moviePanel" class="panel" style="display:none;margin-top:14px;border-radius:12px"><h2>動画プレビュー（試作）</h2><canvas id="movieCanvas" width="1280" height="720" style="display:block;width:100%;max-width:900px;aspect-ratio:16/9;background:#092747;border-radius:8px"></canvas><div class="toolbar"><button class="btn" id="playMovie">▶ 再生</button><button class="btn alt" id="stopMovie">■ 停止</button><span id="movieStatus" class="hint">作成した1-9の音楽に合わせて挿絵を切り替えます。</span></div></section></main>
<script src="./ouenka-studio-audio.js?v=79"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['奈良間 大己','選手 2','選手 3','選手 4','選手 5','選手 6','選手 7','選手 8','選手 9'];const teamColors={
 '北海道日本ハムファイターズ':['#07549a','#1392c6','#062e55'],
 '福岡ソフトバンクホークス':['#d6a500','#f3c930','#665000'],
 '東北楽天ゴールデンイーグルス':['#8d1538','#bf3157','#510c24'],
 '埼玉西武ライオンズ':['#153e70','#3278ac','#071f41'],
 '千葉ロッテマリーンズ':['#202c39','#536477','#0b1017'],
 'オリックス・バファローズ':['#172c59','#5477a4','#0c1733'],
 '読売ジャイアンツ':['#a84c05','#ed861c','#5e2803'],
 '阪神タイガース':['#c49a00','#e4c738','#3c3500'],
 '横浜DeNAベイスターズ':['#0752a0','#269ad5','#032b60'],
 '広島東洋カープ':['#a9132b','#e34150','#620818'],
 '中日ドラゴンズ':['#0753a2','#2d90d2','#032f61'],
 '東京ヤクルトスワローズ':['#087c69','#30a895','#06463e']
};
function findTeamPalette(team){
 const aliases={'日本ハム':'北海道日本ハムファイターズ','日ハム':'北海道日本ハムファイターズ','ソフトバンク':'福岡ソフトバンクホークス','楽天':'東北楽天ゴールデンイーグルス','西武':'埼玉西武ライオンズ','ロッテ':'千葉ロッテマリーンズ','オリックス':'オリックス・バファローズ','巨人':'読売ジャイアンツ','読売':'読売ジャイアンツ','阪神':'阪神タイガース','DeNA':'横浜DeNAベイスターズ','横浜':'横浜DeNAベイスターズ','広島':'広島東洋カープ','中日':'中日ドラゴンズ','ヤクルト':'東京ヤクルトスワローズ'};
 if(teamColors[team])return teamColors[team];const alias=Object.keys(aliases).find(a=>String(team||'').includes(a));return alias?teamColors[aliases[alias]]:null;
}
function applyTeamPalette(){const palette=findTeamPalette(state.team);if(!palette)return false;state.color=palette[0];state.accent=palette[1];state.teamDark=palette[2];state.fadeEndColor=state.fadeMode==='darken'?palette[2]:state.fadeMode==='none'?palette[0]:palette[1];return true}
const init=()=>({year:'2025',team:'北海道日本ハム',players:names.map((name,i)=>({name,order:i+1,position:i===0?'SS':'',avg:'',hr:'',rbi:'',sb:'',ops:'',lyrics:'',photo:'',photoEnabled:true})),design:'photo-1',color:'#07549a',accent:'#1392c6',fadeMode:'brighten',fadeEndColor:'#6b8faf',animation:'none',duration:.6,segments:[{player:0,bar:1,design:'photo-1',animation:'none'}]});let state;try{state=JSON.parse(localStorage.getItem('ouenka_studio_tabs_v1'))||init();if(!Array.isArray(state.players)||state.players.length<1)state=init()}catch{state=init()}// 1-9から開いた場合だけ、その打順をフォームへ引き継ぐ。
if(new URLSearchParams(location.search).get('from')==='lineup'){
 try{
  const imported=JSON.parse(localStorage.getItem('ouenkaBaseIllustrationV1')||'null');
  if(Array.isArray(imported?.rows)&&imported.rows.some(r=>r.name)&&imported.transferId!==state.importTransferId){
   const prior=state.players||[];
   state.players=imported.rows.map((r,i)=>{
    const old=prior.find(p=>p.name===r.name&&p.order===i+1)||{};
    return {...old,name:r.name||'',order:i+1,position:r.position||'',avg:old.avg||'',hr:old.hr||'',rbi:old.rbi||'',sb:old.sb||'',ops:old.ops||'',lyrics:r.lyrics||'',songId:r.songId||'',productionNumber:r.productionNumber||'',reuseName:r.reuseName||'',reuseProductionNumber:r.reuseProductionNumber||'',audioUrl:r.audioUrl||'',melodyUrl:r.melodyUrl||'',accompanimentUrl:r.accompanimentUrl||'',introAccompanimentUrl:r.introAccompanimentUrl||'',photo:old.photo||'',photoEnabled:old.photoEnabled??true};
   });
   state.year=imported.year||'';state.team=imported.team||imported.rows.find(r=>r.name&&r.team)?.team||'';state.title=imported.title||'';
   state.segments=(state.segments||[]).filter(s=>s.player<state.players.length);
   applyTeamPalette();state.lyricsPaletteVersion=1;state.lyricsFetchFailed=!!imported.lyricsFetchFailed;state.importTransferId=imported.transferId;
   localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state));
  }
 }catch(e){alert('1-9の引継ぎデータを読み込めませんでした。保存設定を確認してください。')}
}
if(state.animation==='fade')state.animation='none';state.segments.forEach(s=>{if(s.animation==='fade')s.animation='none'});if(state.lyricsPaletteVersion!==1){applyTeamPalette();state.lyricsPaletteVersion=1;try{localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state))}catch(e){}}
state.fadeMode=state.fadeMode|| (state.colorFade===false?'none':'brighten');state.fadeEndColor=state.fadeEndColor||suggestFadeEnd(state.color,state.fadeMode);
state.titleCard=state.titleCard||{heading:state.title||'1-9 応援歌',subtitle:'',photo:'',photoEnabled:false,color:state.color,accent:state.accent};
state.thumbnailCard=state.thumbnailCard||{...state.titleCard};
let tab=0,chosen=0,chosenSegment=-1;const save=()=>{try{localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state))}catch{alert('保存容量が不足しています。写真を減らしてください。')}};const designs=[['photo-1','① シンプル','写真あり'],['photo-4','④ スタイリッシュ','写真あり'],['photo-5','⑤ 歌詞カード風','写真あり'],['photo-7','⑦ ポップ','写真あり'],['photo-10','⑩ ミニマル','写真あり'],['none-1','① シンプル','写真なし'],['none-5','⑤ 歌詞カード風','写真なし']];const options=arr=>arr.map(x=>`<option value="${escape(x[0])}">${escape(x[1])}</option>`).join('');function playerOptions(selected){return state.players.map((p,i)=>`<option value="${i}" ${i===+selected?'selected':''}>${i+1}番 ${escape(p.name)}</option>`).join('')};function designOptions(selected){return designs.map(d=>`<option value="${d[0]}" ${d[0]===selected?'selected':''}>${d[1]}（${d[2]}）</option>`).join('')};function playerButtons(){return `<div class="playerlist">${state.players.map((p,i)=>`<button data-player="${i}" class="${chosen===i?'active':''}">${i+1} ${escape(p.name)}</button>`).join('')}</div>`};function statsTab(){return `<h2>① 成績登録</h2><div class="section"><h3>9選手の成績を一括編集</h3><div class="toolbar"><label class="field">年度<input id="year" value="${escape(state.year)}" style="width:120px"></label><label class="field">球団<input id="team" value="${escape(state.team)}" style="width:200px"></label><button class="btn" id="npb">NPB公式選手検索 ↗</button><button class="btn alt" id="npbBatch">NPB公式から9人を一括検索（試験）</button></div><p class="hint">一括検索はブラウザの外部サイト通信制限により失敗する場合があります。未確認の数値は登録しません。NPB公式の選手別年度記録を確認してください。</p><div class="scroll"><table><thead><tr><th>打順</th><th>選手名</th><th>守備</th><th>AVG</th><th>HR</th><th>RBI</th><th>SB</th><th>OPS</th></tr></thead><tbody>${state.players.map((p,i)=>`<tr><td>${i+1}</td>${['name','position','avg','hr','rbi','sb','ops'].map(k=>`<td><input data-stat="${i}" data-key="${k}" value="${escape(p[k])}"></td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`};function designTab(){return `<h2>② デザイン登録</h2><div class="section"><h3>採用した7種類から選択</h3><div class="designs">${designs.map(d=>`<button class="design ${state.design===d[0]?'active':''}" data-design="${d[0]}"><div class="thumb ${d[0].includes('4')?'stripes':''}" style="background:${d[0].includes('5')||d[0].includes('10')?'#f6fbff':state.color};color:${d[0].includes('5')||d[0].includes('10')?'#073e74':'white'}">${d[2]==='写真あり'?'▣ PHOTO  |  ':''}58\n選手名\nAVG / HR / RBI</div><b>${d[1]}</b><div class="hint">${d[2]}</div></button>`).join('')}</div></div><div class="section"><h3>カラー設定</h3><div class="toolbar"><label class="field">メインカラー<input type="color" id="color" value="${escape(state.color)}"></label><label class="field">アクセントカラー<input type="color" id="accent" value="${escape(state.accent)}"></label></div><div class="toolbar"><label class="field">背景グラデーション<select id="fadeMode">${[['brighten','徐々に明るく'],['darken','徐々に暗く'],['none','フェードなし']].map(([value,label])=>`<option value="${value}" ${state.fadeMode===value?'selected':''}>${label}</option>`).join('')}</select></label><label class="field">${state.fadeMode==='none'?'固定カラー（メインカラー）':'グラデーションの終了色'}<input type="color" id="fadeEndColor" value="${escape(state.fadeMode==='none'?state.color:state.fadeEndColor)}" ${state.fadeMode==='none'?'disabled':''}></label></div><p class="hint">メインカラーからグラデーションの終了色へ変わります。明るく／暗くを選ぶと、その方向の色を自動設定します。フェード後の色も調整できます。</p><button class="btn alt" id="teamColor">球団の初期カラーに戻す</button><button class="btn alt" id="previewDesign">デザインをプレビュー</button><div id="designPreview" style="margin-top:12px"></div></div>`};function photoTab(){return `<h2>③ 挿絵登録</h2><p class="hint">9選手それぞれの写真をアルバムから選択できます。写真は透過せず長方形のまま表示します。</p><div class="photos">${state.players.map((p,i)=>`<div class="photoCard"><b>${i+1}番　${escape(p.name)}</b><div class="photoBox">${p.photo?`<img src="${p.photo}" alt="${escape(p.name)}">`:'写真未登録'}</div><label><input type="checkbox" data-photoenabled="${i}" ${p.photoEnabled?'checked':''}> 写真を使用する</label><div class="toolbar"><label class="btn" style="cursor:pointer">写真を選択<input type="file" accept="image/*" data-photo="${i}" hidden></label><button class="btn danger" data-clearphoto="${i}">削除</button></div></div>`).join('')}</div>`};function animationTab(){return `<h2>④ アニメーション</h2><div class="grid"><div class="section"><h3>切り替え演出を選択</h3>${[['none','瞬時に切り替え'],['slide','スライド'],['zoom','ズーム']].map(a=>`<label style="display:block;padding:10px"><input type="radio" name="animation" value="${a[0]}" ${state.animation===a[0]?'checked':''}> ${a[1]}</label>`).join('')}<label class="field">切り替え時間（秒）<input type="number" id="duration" min="0" max="3" step="0.1" value="${state.duration}"></label><div class="toolbar"><button class="btn" id="playAnimation">アニメーションを確認</button></div></div><div class="section"><h3>プレビュー</h3><div id="animationPreview"></div><p class="hint">アニメーションは映像の切り替えにだけ適用。既存の1-9音源再生方式には影響しません。</p></div></div>`};function scenePlayer(player,scene){return {...player,lyrics:scene&&Object.hasOwn(scene,'lyrics')?scene.lyrics:player.lyrics,photo:scene&&Object.hasOwn(scene,'photo')?scene.photo:player.photo,photoEnabled:scene&&Object.hasOwn(scene,'photoEnabled')?scene.photoEnabled:player.photoEnabled}}
function segmentValue(el){return el.type==='checkbox'?el.checked:['bar','player'].includes(el.dataset.key)?Math.max(el.dataset.key==='bar'?1:0,Math.floor(Number(el.value)||0)):el.value}

function videoTab(){return `<h2>⑤ 動画登録｜1曲の中で挿絵を切り替え</h2><p class="hint">歌詞の続きを2枚目へ載せる場合も、写真・デザインを変える場合も、挿絵ごとに設定できます。</p><div class="section"><h3>応援歌と歌詞</h3>${playerButtons()}<label class="field">${escape(state.players[chosen].name)} の歌詞<textarea id="lyrics">${escape(state.players[chosen].lyrics)}</textarea></label><div class="toolbar"><button class="btn" id="splitLyrics">歌詞を2枚に分ける</button><button class="btn alt" id="addSegment">＋ この選手の挿絵を追加</button></div><p class="hint">2枚目の開始小節を指定してください。前奏を含めて、その選手の音源開始から数えます。</p></div><div class="section"><h3>挿絵ごとの設定</h3>${state.segments.map((scene,i)=>{const player=scenePlayer(state.players[scene.player],scene);return `<div class="section"><h3>挿絵 ${i+1}</h3><div class="three"><label class="field">選手<select data-seg="${i}" data-key="player">${playerOptions(scene.player)}</select></label><label class="field">開始小節<input type="number" min="1" step="1" value="${scene.bar}" data-seg="${i}" data-key="bar"></label><label class="field">デザイン<select data-seg="${i}" data-key="design">${designOptions(scene.design)}</select></label></div><label class="field">この挿絵の歌詞<textarea data-seg="${i}" data-key="lyrics">${escape(player.lyrics)}</textarea></label><div class="toolbar"><label><input type="checkbox" data-seg="${i}" data-key="photoEnabled" ${player.photoEnabled?'checked':''}> 写真を使用</label><label class="btn">この挿絵の写真を選択<input type="file" data-scenephoto="${i}" accept="image/*" hidden></label><button class="btn alt" data-resetscenephoto="${i}">選手の写真に戻す</button><button class="btn alt" data-previewscene="${i}">プレビュー</button><button class="btn danger" data-remove="${i}">削除</button></div>${player.photo?`<img src="${escape(player.photo)}" alt="挿絵の写真" style="max-width:180px;max-height:120px;object-fit:cover">`:''}</div>`}).join('')}</div><div class="section"><h3>挿絵プレビュー</h3><div id="videoPreview"></div><p class="hint">上部の動画プレビューで1-9のBGMと一緒に確認できます。</p></div><button class="btn alt" id="export">設定をJSON保存</button>`}
