(()=>{'use strict';const $=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const names=['奈良間 大己','選手 2','選手 3','選手 4','選手 5','選手 6','選手 7','選手 8','選手 9'];const teamColors={

 '横浜DeNAベイスターズ':['#0752a0','#269ad5','#032b60'],

function findTeamPalette(team){
 const aliases={'日本ハム':'北海道日本ハムファイターズ','日ハム':'北海道日本ハムファイターズ','ソフトバンク':'福岡ソフトバンクホークス','楽天':'東北楽天ゴールデンイーグルス','西武':'埼玉西武ライオンズ','ロッテ':'千葉ロッテマリーンズ','オリックス':'オリックス・バファローズ','巨人':'読売ジャイアンツ','読売':'読売ジャイアンツ','阪神':'阪神タイガース','DeNA':'横浜DeNAベイスターズ','横浜':'横浜DeNAベイスターズ','広島':'広島東洋カープ','中日':'中日ドラゴンズ','ヤクルト':'東京ヤクルトスワローズ'};
 if(teamColors[team])return teamColors[team];const alias=Object.keys(aliases).find(a=>String(team||'').includes(a));return alias?teamColors[aliases[alias]]:null;
}
function applyTeamPalette(){const palette=findTeamPalette(state.team);if(!palette)return false;state.color=palette[0];state.accent=palette[1];state.teamDark=palette[2];state.fadeEndColor=state.fadeMode==='darken'?palette[2]:state.fadeMode==='none'?palette[0]:palette[1];return true}
const init=()=>({year:'2025',team:'北海道日本ハム',players:names.map((name,i)=>({name,order:i+1,position:i===0?'SS':'',avg:'',hr:'',rbi:'',sb:'',ops:'',lyrics:'',photo:'',photoEnabled:true})),design:'photo-1',color:'#07549a',accent:'#1392c6',fadeMode:'card',fadeEndColor:'#6b8faf',animation:'none',duration:.6,segments:[{player:0,bar:1,design:'photo-1',animation:'none'}]});let state;try{state=JSON.parse(localStorage.getItem('ouenka_studio_tabs_v1'))||init();if(!Array.isArray(state.players)||state.players.length<1)state=init()}catch{state=init()}// 1-9から開いた場合だけ、その打順をフォームへ引き継ぐ。

   const prior=state.players||[];
   state.players=imported.rows.map((r,i)=>{

   });
   state.year=imported.year||'';state.team=imported.team||imported.rows.find(r=>r.name&&r.team)?.team||'';state.title=imported.title||'';
   state.segments=(state.segments||[]).filter(s=>s.player<state.players.length);
   if(state.lyricsPaletteVersion!==2)state.fadeMode='card';applyTeamPalette();state.lyricsPaletteVersion=2;state.lyricsFetchFailed=!!imported.lyricsFetchFailed;state.importTransferId=imported.transferId;
   localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state));
  }
 }catch(e){alert('1-9の引継ぎデータを読み込めませんでした。保存設定を確認してください。')}
}
if(state.animation==='fade')state.animation='none';state.segments.forEach(s=>{if(s.animation==='fade')s.animation='none'});if(state.lyricsPaletteVersion!==2){state.fadeMode='card';applyTeamPalette();state.lyricsPaletteVersion=2;try{localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state))}catch(e){}}
state.fadeMode=state.fadeMode||'card';state.frameColor=state.frameColor||'#000000';state.npbApi='https://ouenka-base-npb-stats.ninzin5600.workers.dev';state.fadeEndColor=state.fadeEndColor||suggestFadeEnd(state.color,state.fadeMode);
state.titleCard=state.titleCard||{heading:state.title||'1-9 応援歌',subtitle:'',photo:'',photoEnabled:false,color:state.color,accent:state.accent};

const FONT_PRESETS={

function fontPreset(key){return FONT_PRESETS[key]||FONT_PRESETS.gothic}
function fontWeight(key,weight=700){return key==='bold'?900:weight}

function fontSettings(){return `<div class="section"><h3>フォント設定</h3><div class="three">${[['name','選手名'],['lyrics','歌詞'],['stats','成績・打順・ポジション']].map(([group,label])=>`<label class="field">${label}<select data-fontgroup="${group}">${fontOptions(state.fonts[group])}</select><span>文字サイズ<input type="number" min="12" max="100" step="1" data-fontsize="${group}" value="${fontSize(group)}"></span></label>`).join('')}</div><p class="hint">プレビュー・保存動画に反映します。端末にないフォントは近い書体で表示されます。</p></div>`}
let tab=0,chosen=0,chosenSegment=-1;const save=()=>{try{localStorage.setItem('ouenka_studio_tabs_v1',JSON.stringify(state))}catch{alert('保存容量が不足しています。写真を減らしてください。')}};const designs=[['photo-1','① シンプル','写真あり'],['photo-4','④ スタイリッシュ','写真あり'],['photo-5','⑤ 歌詞カード風','写真あり'],['photo-7','⑦ ポップ','写真あり'],['photo-10','⑩ ミニマル','写真あり'],['none-1','① シンプル','写真なし'],['none-5','⑤ 歌詞カード風','写真なし'],['photo-yellow','⑧ 成績を黄色で区切る','写真あり'],['none-yellow','⑧ 成績を黄色で区切る','写真なし']];const options=arr=>arr.map(x=>`<option value="${escape(x[0])}">${escape(x[1])}</option>`).join('');function playerOptions(selected){return state.players.map((p,i)=>`<option value="${i}" ${i===+selected?'selected':''}>${i+1}番 ${escape(p.name)}</option>`).join('')};function designOptions(selected){return designs.map(d=>`<option value="${d[0]}" ${d[0]===selected?'selected':''}>${d[1]}（${d[2]}）</option>`).join('')};function playerButtons(){return `<div class="playerlist">${state.players.map((p,i)=>`<button data-player="${i}" class="${chosen===i?'active':''}">${i+1} ${escape(p.name)}</button>`).join('')}</div>`};function canonicalTeam(team){if(teamColors[team])return team;const palette=findTeamPalette(team);return Object.keys(teamColors).find(name=>teamColors[name]===palette)||team||''}

function statsTab(){return `<h2>① 成績登録</h2><div class="section"><h3>選手の成績を一括編集</h3><div class="toolbar"><label class="field">年度<select id="year" style="width:120px">${yearOptions()}</select></label><label class="field">球団<select id="team" style="width:240px">${teamOptions()}</select></label><button class="btn" id="npb">NPB公式選手検索 ↗</button><button class="btn alt" id="npbBatch">NPB公式から成績を一括取得</button></div><p class="hint">選んだ年度・球団の公式打撃成績を照合します。選手名はスペースを除いて照合。見つからない選手の数値は変更しません。OPSは公表の出塁率と長打率の合計です。</p><div class="scroll"><table><thead><tr><th>打順</th><th>選手名</th><th>守備</th><th>AVG</th><th>HR</th><th>RBI</th><th>SB</th><th>OPS</th></tr></thead><tbody>${state.players.map((p,i)=>`<tr><td>${i+1}</td>${['name','position','avg','hr','rbi','sb','ops'].map(k=>`<td><input data-stat="${i}" data-key="${k}" value="${escape(p[k])}"></td>`).join('')}</tr>`).join('')}</tbody></table></div><p id="npbStatus" class="hint"></p></div>`};function designTab(){return `<h2>② デザイン登録</h2>${fontSettings()}<div class="section"><h3>デザインを選択</h3><div class="designs">${designs.map(d=>`<button class="design ${state.design===d[0]?'active':''}" data-design="${d[0]}"><div class="thumb ${d[0].includes('4')?'stripes':''}" style="background:${d[0].includes('5')||d[0].includes('10')?'#f6fbff':state.color};color:${d[0].includes('5')||d[0].includes('10')?'#073e74':'white'}">${d[2]==='写真あり'?'▣ PHOTO  |  ':''}58\n選手名\nAVG / HR / RBI</div><b>${d[1]}</b><div class="hint">${d[2]}</div></button>`).join('')}</div></div><div class="section"><h3>カラー設定</h3><div class="toolbar"><label class="field">写真枠の色<input type="color" id="frameColor" value="${escape(state.frameColor)}"></label><label class="field">濃い背景色<input type="color" id="teamDark" value="${escape(state.teamDark||'#062e55')}"></label><label class="field">メインカラー<input type="color" id="color" value="${escape(state.color)}"></label><label class="field">アクセントカラー<input type="color" id="accent" value="${escape(state.accent)}"></label></div><div class="toolbar"><label c button class="btn" id="playAnimation">アニメーションを確認</button></div></div><div class="section"><h3>プレビュー</h3><div id="animationPreview"></div><p class="hint">アニメーションは映像の切り替えにだけ適用。既存の1-9音源再生方式には影響しません。</p></div></div>`};function scenePlayer(player,scene){return {...player,lyrics:scene&&Object.hasOwn(scene,'lyrics')?scene.lyrics:player.lyrics,photo:scene&&Object.hasOwn(scene,'photo')?scene.photo:player.photo,photoEnabled:scene&&Object.hasOwn(scene,'photoEnabled')?scene.photoEnabled:player.photoEnabled}}

function statsHtml(p,design){const yellow=design.includes('yellow')||design.includes('7'),rows=[[['AVG',p.avg||'---'],['HR',p.hr||'-'],['RBI',p.rbi||'-']],[['SB',p.sb||'-'],['OPS',p.ops||'---']]];return `<div class="stats-grid ${yellow?'yellow':''}" style="${escape(textStyle('stats')+';font-size:'+fontSize('stats')/12.8+'cqw')}">${rows.map(row=>`<div class="stat-row">${row.map(([label,value])=>`<span><small>${label}</small><b>${escape(value)}</b></span>`).join('')}</div>`).join('')}</div>`}
function preview(p,design,animation='none'){const noPhoto=design.startsWith('none-')||!p.photoEnabled;const light=design.includes('5')||design.includes('10');const cls=`stage ${noPhoto?'nophoto':''} ${light?'light':''} ${design.includes('7')?'pop':''} ${animation}`;const stats=`AVG ${p.avg||'---'}　HR ${p.hr||'-'}　RBI ${p.rbi||'-'}　SB ${p.sb||'-'}　OPS ${p.ops||'---'}`;return `<div class="${cls}" style="background:${backgroundCss(state.color)};color:${contrastColor(state.color)};--duration:${state.duration}s;"><div class="pic">${p.photo?`<img src="${p.photo}" alt="">`:'写真を選択'}</div><div class="info"><strong style="${escape(textStyle('name')+';font-size:'+fontSize('name')/12.8+'cqw')}">${escape(p.name)}</strong><div style="${escape(textStyle('stats'))}">${p.order}番　${escape(p.position||'—')}</div>${statsHtml(p,design)}<div class="lyrics" style="${escape(textStyle('lyrics')+';font-size:'+fontSize('lyrics')/12.8+'cqw')}">${escape(p.lyrics||'ここに応援歌の歌詞を表示\n（最大4行を標準想定）')}</div></div></div>`};function render(){refreshFrameColor();document.querySelectorAll('.tab').forEach((b,i)=>{b.classList.toggle('active',i===tab);b.setAttribute('aria-selected',String(i===tab))});$('content').innerHTML=[statsTab,designTab,photoTab,animationTab,videoTab,titleTab,thumbnailTab][tab]();if(tab===1)$('designPreview').innerHTML=preview(state.players[chosen],state.design);if(tab===3)$('animationPreview').innerHTML=preview(state.players[chosen],state.design);if(tab===4){$('videoPreview').innerHTML=scenePreview()}if(tab===5||tab===6)drawCover(tab===5?'titleCard':'thumbnailCard')}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.tab;render()});$('back').textContent='← 1-9に戻る';$('back').onclick=()=>{location.href='./1-9.html'};
$('content').addEventListener('input',e=>{const t=e.target;if(t.dataset.fontsize){state.fontSizes[t.dataset.fontsize]=Math.max(12,Math.min(100,Number(t.value)||12));save();refreshColorPreview()}else if(t.dataset.fontgroup){state.fonts[t.dataset.fontgroup]=t.value;save();render()}else if(t.dataset.cover){state[t.dataset.cover][t.dataset.field]=t.type==='checkbox'?t.checked:t.type==='number'?Math.max(12,Math.min(180,Number(t.value)||12)):t.value;save();drawCover(t.dataset.cover)}else if(t.dataset.stat!==undefined){state.players[+t.dataset.stat][t.dataset.key]=t.value;save()}else if(t.id==='npbApi'){state.npbApi=t.value.trim();save()}else if(t.id==='year'||t.id==='team'){state[t.id]=t.value;if(t.id==='team')applyTeamPalette();save()}else if(t.id==='frameColor'){state.frameColor=t.value;save();refreshFrameColor();refreshColorPreview()}else if(t.id==='teamDark'){state.teamDark=t.value;save();refreshColorPreview()}else if(t.id==='color'||t.id==='accent'){state[t.id]=t.value;if(t.id==='color')state.fadeEndColor=suggestFadeEnd(state.color,state.fadeMode);save();refreshColorPreview()}else if(t.id==='fadeMode'){state.fadeMode=t.value;state.fadeEndColor=suggestFadeEnd(state.color,state.fadeMode);save();render()}else if(t.id==='fadeEndColor'){if(state.fadeMode==='card'){state.accent=t.value;state.fadeEndColor=t.value}else state.fadeEndColor=constrainFadeEnd(state.color,t.value,state.fadeMode);t.value=state.fadeEndColor;save();refreshColorPreview()}else if(t.id==='duration'){state.duration=Math.max(0,Math.min(3,Number(t.value)||0));save()}else if(t.id==='lyrics'){state.players[chosen].lyrics=t.value;save()}else if(t.dataset.seg!==undefined){const s=state.segments[+t.dataset.seg];s[t.dataset.key]=segmentValue(t);save()}else if(t.dataset.photoenabled!==undefined){state.players[+t.dataset.photoenabled].photoEnabled=t.checked;save()}else if(t.name==='animation'){state.animation=t.value;save()}});
$('content').addEventListener('change',async e=>{const t=e.target;if(t.dataset.scenephoto!==undefined||t.dataset.coverphoto){await assignImage(t);return}if(t.dataset.photo!==undefined){const f=t.files?.[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{const c=document.createElement('canvas');const scale=Math.min(1,1000/im.width,1000/im.height);c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);state.players[+t.dataset.photo].photo=c.toDataURL('image/jpeg',.7);URL.revokeObjectURL(url);save();render()};im.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした')};im.src=url}else if(t.dataset.seg!==undefined){const s=state.segments[+t.dataset.seg];s[t.dataset.key]=segmentValue(t);save()}});
$('content').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.savecover){saveCover(t.dataset.savecover);return}if(t.dataset.copycover){const other=t.dataset.copycover==='titleCard'?'thumbnailCard':'titleCard';state[other]={...state[t.dataset.copycover]};save();$('coverStatus').textContent='タイトルとサムネを同じ内容にしました。';return}if(t.dataset.previewscene!==undefined){chosenSegment=+t.dataset.previewscene;chosen=state.segments[chosenSegment].player;render();return}if(t.dataset.resetscenephoto!==undefined){const scene=state.segments[+t.dataset.resetscenephoto];delete scene.photo;delete scene.photoEnabled;save();render();return}if(t.id==='splitLyrics'){splitLyrics();return}if(t.id==='npb'){window.open('https://npb.jp/bis/players/index.html','_blank','noopener,noreferrer')}else if(t.id==='npbBatch'){npbBatch()}else if(t.id==='teamColor'){if(applyTeamPalette()){save();render()}else alert('球団名から色を特定できませんでした。')} else if(t.dataset.design){state.design=t.dataset.design;save();render()}else if(t.dataset.clearphoto!==undefined){state.players[+t.dataset.clearphoto].photo='';save();render()}else if(t.dataset.player!==undefined){chosen=+t.dataset.player;chosenSegment=-1;render()}else if(t.id==='previewDesign'){render()}else if(t.id==='playAnimation'){const el=$('animationPreview');el.innerHTML=preview(state.players[chosen],state.design,state.animation)}else if(t.id==='addSegment'){const existing=state.segments.filter(s=>s.player===chosen);state.segments.push({player:chosen,bar:existing.length?Math.max(...existing.map(s=>+s.bar))+4:1,design:state.design,animation:state.animation,lyrics:state.players[chosen].lyrics,photo:state.players[chosen].photo,photoEnabled:state.players[chosen].photoEnabled});chosenSegment=state.segments.length-1;save();render()}else if(t.dataset.remove!==undefined){state.segments.splice(+t.dataset.remove,1);chosenSegment=-1;save();render()}else if(t.id==='export'){const blob=new Blob([JSON.stringify({...state,players:state.players.map(p=>({...p,photo:p.photo?'[画像データ省略]':''}))},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='挿絵設定_試作.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}});
function splitLyrics(){const lines=String(state.players[chosen].lyrics||'').split('\n').filter(l=>l.trim());if(lines.length<2){alert('2行以上の歌詞を入力してください。');return}const middle=Math.ceil(lines.length/2);const first=state.segments.find(scene=>scene.player===chosen&&+scene.bar===1);const base={player:chosen,design:state.design,animation:state.animation,photo:state.players[chosen].photo,photoEnabled:state.players[chosen].photoEnabled};if(first)first.lyrics=lines.slice(0,middle).join('\n');else state.segments.push({...base,bar:1,lyrics:lines.slice(0,middle).join('\n')});state.segments.push({...base,bar:5,lyrics:lines.slice(middle).join('\n')});chosenSegment=state.segments.length-1;save();render()}
async function assignImage(input){const file=input.files?.[0];if(!file)return;const scene=input.dataset.scenephoto!==undefined?state.segments[+input.dataset.scenephoto]:null,card=input.dataset.coverphoto?state[input.dataset.coverphoto]:null;const target=scene||card;if(!target)return;const url=URL.createObjectURL(file),im=new Image();try{await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=url});const canvas=document.createElement('canvas'),scale=Math.min(1,1400/im.width,1400/im.height);canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);target.photo=canvas.toDataURL('image/jpeg',.8);target.photoEnabled=true;save();render()}catch(e){alert('写真を読み込めませんでした。')}finally{URL.revokeObjectURL(url)}}
async function drawCover(kind,targetCanvas=null){const canvas=targetCanvas||$('coverCanvas');if(!canvas)return;const card=state[kind],ctx=canvas.getContext('2d');ctx.save();ctx.scale(canvas.width/1920,canvas.height/1080);paintBackground(ctx,1920,1080,card.color);let textX=960,textWidth=1740;if(card.photoEnabled&&card.photo){const im=movieImage(card.photo);if(!im.complete){await new Promise(resolve=>{im.addEventListener('load',resolve,{once:true});im.addEventListener('error',resolve,{once:true})})}if(!targetCanvas&&$('coverCanvas')!==canvas){ctx.restore();return}if(im.naturalWidth){const scale=Math.max(720/im.width,1080/im.height);ctx.save();ctx.beginPath();ctx.rect(0,0,720,1080);ctx.clip();ctx.drawImage(im,(720-im.width*scale)/2,(1080-im.height*scale)/2,im.width*scale,im.height*scale);ctx.restore();ctx.strokeStyle=state.frameColor;ctx.lineWidth=8;ctx.strokeRect(4,4,712,1072);textX=1320;textWidth=1050}}const fg=contrastColor(card.color);ctx.textAlign='center';ctx.fillStyle=fg;const lines=String(card.heading||'').split('\n');const size=Math.min(Number(card.headingSize)||110,500/Math.max(1,lines.length));ctx.font=canvasFont(card.font||state.fonts.name,size,800);lines.forEach((line,i)=>ctx.fillText(line,textX,440+i*size*1.3,textWidth));ctx.fillStyle=card.accent;ctx.fillRect(textX-textWidth/2,775,textWidth,10);ctx.fillStyle=fg;ctx.font=canvasFont(card.font||state.fonts.name,Number(card.subtitleSize)||48,500);ctx.fillText(card.subtitle||'',textX,880,textWidth);ctx.font=canvasFont(card.font||state.fonts.name,30,500);ctx.fillText('OUENKA BASE',textX,1000,textWidth);ctx.restore()}
async function saveCover(kind){await drawCover(kind);const canvas=$('coverCanvas');if(!canvas)return;canvas.toBlob(async blob=>{if(!blob)return;const name=(kind==='titleCard'?'タイトル':'サムネ')+'.png',file=new File([blob],name,{type:'image/png'});try{if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=name;link.textContent=name+'をダウンロード';const area=$('coverStatus');if(area){area.replaceChildren(link)}link.click()},'image/png')}
function drawLyrics(value,x,y,width,height,color){let size=fontSize('lyrics'),lines=[];for(;size>=12;size--){mctx.font=canvasFont(state.fonts.lyrics,size,700);lines=[];for(const line of String(value).split('\n')){let part='';for(const char of line){if(part&&mctx.measureText(part+char).width>width){lines.push(part);part=char}else part+=char}lines.push(part)}if(lines.length*size*1.35<=height)break}const lineHeight=Math.min(size*1.35,height/Math.max(1,lines.length));lines.forEach((line,i)=>movieText(line,x,y+lineHeight*(i+1),Math.min(size,lineHeight/1.2),color,'center',700,'lyrics'))}

 const year=Number(state.year),team=canonicalTeam(state.team);if(!year||!team){alert('年度と球団を選択してください。');return}

// 既存1-9エンジンの音源と開始時刻を共有し、AudioContextの時計で描画する。

const movieImages=new Map();
function movieImage(src){if(!src)return null;if(!movieImages.has(src)){const im=new Image();im.src=src;movieImages.set(src,im)}return movieImages.get(src)}
function hexToRgb(h){const v=h.replace('#','');return [0,2,4].map(i=>parseInt(v.slice(i,i+2),16)||0)}
function toHex(rgb){return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mixColor(a,b,t){t=Math.max(0,Math.min(1,t));const x=hexToRgb(a),y=hexToRgb(b);return toHex(x.map((v,i)=>v+(y[i]-v)*t))}
function brightness(color){return hexToRgb(color).reduce((sum,v,i)=>sum+v*[.2126,.7152,.0722][i],0)}
function contrastColor(color){return brightness(color)>145?'#082d57':'#ffffff'}
function suggestFadeEnd(color,mode){const palette=findTeamPalette(state.team);if(palette&&color.toLowerCase()===palette[0].toLowerCase())return mode==='none'?color:mode==='darken'?palette[2]:palette[1];return mode==='none'?color:mixColor(color,mode==='darken'?'#000000':'#ffffff',.42)}
function constrainFadeEnd(color,end,mode){if(mode==='none')return color;return (mode==='darken'?brightness(end)<=brightness(color):brightness(end)>=brightness(color))?end:suggestFadeEnd(color,mode)}
function backgroundStops(color){if(state.fadeMode==='card'){return [{offset:0,color:color===state.color?(state.teamDark||suggestFadeEnd(color,'darken')):suggestFadeEnd(color,'darken')},{offset:.7,color:color===state.color?state.accent:suggestFadeEnd(color,'brighten')},{offset:1,color}]}return [{offset:0,color},{offset:1,color:state.fadeMode==='none'?color:color===state.color?state.fadeEndColor:suggestFadeEnd(color,state.fadeMode)}]}
function backgroundCss(color){if(state.fadeMode==='none')return color;return 'linear-gradient(110deg,'+backgroundStops(color).map(stop=>stop.color+' '+Math.round(stop.offset*100)+'%').join(',')+')'}
function paintBackground(ctx,w,h,color){if(state.fadeMode==='none'){ctx.fillStyle=color}else{const angle=110*Math.PI/180,length=Math.abs(w*Math.sin(angle))+Math.abs(h*Math.cos(angle)),dx=Math.sin(angle)*length/2,dy=-Math.cos(angle)*length/2,grad=ctx.createLinearGradient(w/2-dx,h/2-dy,w/2+dx,h/2+dy);backgroundStops(color).forEach(stop=>grad.addColorStop(stop.offset,stop.color));ctx.fillStyle=grad}ctx.fillRect(0,0,w,h)}
function refreshFrameColor(){document.documentElement?.style.setProperty('--photo-frame',state.frameColor)}
function refreshColorPreview(){const end=$('fadeEndColor');if(end)end.value=state.fadeMode==='card'?state.accent:state.fadeMode==='none'?state.color:state.fadeEndColor;if(tab===1)$('designPreview').innerHTML=preview(state.players[chosen],state.design)}
function movieText(txt,x,y,size,color='#fff',align='center',weight=700,group='stats'){mctx.font=canvasFont(state.fonts[group],size,weight);mctx.textAlign=align;mctx.fillStyle=color;mctx.fillText(String(txt),x,y)}
function drawMovie(time){
 const ctx=mctx,w=1280,h=720;ctx.clearRect(0,0,w,h);
 if(!movieTimeline)return 0;
 const {starts,rowIndices,duration:total,barSeconds:secPerBar}=movieTimeline;
 const titleSeconds=movieTimeline.titleSeconds||0;
 if(time<titleSeconds){drawCover('titleCard',movieCanvas);const label=$('moviePlayer');if(label)label.textContent='タイトル';return total}
 const sec=Math.max(0,Math.min(time-titleSeconds,total-titleSeconds-.001));let songIndex=0;
 while(songIndex+1<starts.length&&sec>=starts[songIndex+1])songIndex++;
 const pi=rowIndices[songIndex],local=sec-starts[songIndex],secPerPlayer=(starts[songIndex+1]??(total-titleSeconds))-starts[songIndex],bar=Math.floor(local/secPerBar)+1;
 const originalPlayer=state.players[pi];const seq=state.segments.filter(s=>+s.player===pi&&+s.bar<=bar).sort((a,b)=>+a.bar-+b.bar);
 const seg=seq.at(-1),p=scenePlayer(originalPlayer,seg),design=seg?.design||state.design,noPhoto=design.startsWith('none-')||!p.photoEnabled;
 const light=design.includes('5')||design.includes('10');const base=state.color;
 paintBackground(ctx,w,h,base);
 const sceneStart=seg?(Math.max(1,Number(seg.bar))-1)*secPerBar:0,elapsed=Math.max(0,local-sceneStart),duration=Math.max(0,Number(state.duration)||0),progress=duration?Math.min(1,elapsed/duration):1;
 ctx.save();
 if(state.animation==='fadein'&&progress<1){ctx.globalAlpha=progress}
 else if(state.animation==='slide'&&progress<1){ctx.translate(w*(1-progress),0)}

 const fg=contrastColor(base);let infoX=0,infoW=1280;
 if(!noPhoto){infoX=440;infoW=840;const x=24,y=45,pw=380,ph=630;ctx.fillStyle='#173a5b';ctx.fillRect(x,y,pw,ph);const im=movieImage(p.photo);if(im?.complete&&im.naturalWidth){const sc=Math.max(pw/im.width,ph/im.height),sw=pw/sc,sh=ph/sc;ctx.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,x,y,pw,ph)}else movieText('写真未登録',x+pw/2,y+ph/2,28,'#c5d9eb');ctx.strokeStyle=state.frameColor;ctx.lineWidth=6;ctx.strokeRect(x+3,y+3,pw-6,ph-6)}

 rows.forEach((values,row)=>{const top=statsTop+row*rowHeight;if(yellowStats&&row){ctx.strokeStyle='#ffd43b';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left+width,top);ctx.stroke()}values.forEach(([label,value],i)=>{const cellWidth=width/values.length,x=left+cellWidth*i;if(yellowStats&&i){ctx.strokeStyle='#ffd43b';ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,top+rowHeight);ctx.stroke()}movieText(label,x+cellWidth/2,top+rowHeight*.35,statSize*.65,yellowStats?'#ffd43b':fg);movieText(value,x+cellWidth/2,top+rowHeight*.9,statSize,fg)})});

}
function setMovieBusy(busy){movieBusy=busy;for(const id of ['previewMovie','saveMovie','playMovie'])$(id).disabled=busy;updateTransport()}
function formatTime(seconds){const value=Math.max(0,Math.floor(seconds));return Math.floor(value/60)+':'+String(value%60).padStart(2,'0')}
function movieTime(){return moviePlaying&&movieContext?Math.min(movieTimeline.duration,movieOffset+Math.max(0,movieContext.currentTime-movieStart)):movieOffset}
function updateTransport(position=movieTime()){const total=movieTimeline?.duration||0,seek=$('movieSeek');seek.max=String(total);if(!movieScrubbing)seek.value=String(position);seek.disabled=movieBusy||!total||movieRecorder?.state==='recording';$('movieTime').textContent=formatTime(position)+' / '+formatTime(total);const pause=$('pauseMovie');pause.disabled=movieBusy||!movieContext||movieRecorder?.state==='recording';pause.textContent=moviePlaying?'Ⅱ 一時停止':'▶ 再開'}
function runMovieSource(ctx,offset,generation){
 const source=ctx.createBufferSource();source.buffer=movieTimeline.buffer;source.connect(ctx.destination);movieSource=source;movieOffset=offset;movieStart=ctx.currentTime+0.04;moviePlaying=true;
 source.addEventListener('ended',()=>{if(movieSource!==source||generation!==movieGeneration)return;moviePlaying=false;movieOffset=movieTimeline.duration;movieSource=null;if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=0;drawMovie(movieOffset);updateTransport();$('movieStatus').textContent='再生が終了しました。再生バーで戻れます。'},{once:true});const title=movieTimeline.titleSeconds||0;source.start(movieStart+Math.max(0,title-offset),Math.max(0,offset-title));
 function tick(){if(movieSource!==source||generation!==movieGeneration)return;const time=movieTime();if(!movieScrubbing){drawMovie(time);updateTransport(time)}movieRAF=requestAnimationFrame(tick)}
 if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=requestAnimationFrame(tick);updateTransport();
}
function detachPreviewSource(){const source=movieSource;movieSource=null;if(source){try{source.stop()}catch(e){}source.disconnect()}if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=0}
async function seekMovie(position){if(!movieTimeline||movieBusy||movieRecorder?.state==='recording')return;const time=Math.max(0,Math.min(Number(position)||0,movieTimeline.duration)),wasPlaying=moviePlaying;detachPreviewSource();moviePlaying=false;movieOffset=time;drawMovie(time);updateTransport(time);if(wasPlaying&&movieContext&&time<movieTimeline.duration){await movieContext.resume();runMovieSource(movieContext,time,movieGeneration)}}
async function pauseMovie(){if(!movieContext||movieBusy||movieRecorder?.state==='recording')return;if(moviePlaying){movieOffset=movieTime();detachPreviewSource();moviePlaying=false;updateTransport();$('movieStatus').textContent='一時停止中'}else{if(movieOffset>=movieTimeline.duration)movieOffset=0;await movieContext.resume();runMovieSource(movieContext,movieOffset,movieGeneration);$('movieStatus').textContent='再生中'}}
function stopMovie(){
 movieGeneration++;moviePlaying=false;movieScrubbing=false;movieOffset=0;if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=0;
 if(movieSource){try{movieSource.stop()}catch(e){}movieSource.disconnect();movieSource=null}
 if(movieRecorder?.state==='recording')movieRecorder.stop();
 if(movieContext){movieContext.close().catch(()=>{});movieContext=null}
 if(movieRecorder?.state!=='recording')movieStream?.getTracks().forEach(t=>t.stop());
 setMovieBusy(false);updateTransport(0);
}
async function startMovie(record=false){
 stopMovie();const generation=movieGeneration;setMovieBusy(true);$('moviePanel').style.display='block';$('movieStatus').textContent='1-9の音源を読み込んでいます…';

 try{
  const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)throw new Error('このブラウザは音声再生に対応していません。');

  const timeline=await window.OuenkaStudioAudio.build(ctx,state.players);
  if(generation!==movieGeneration){await ctx.close();return}

  await Promise.all([...state.players,...state.segments,state.titleCard].filter(p=>p.photo).map(p=>new Promise(resolve=>{const im=movieImage(p.photo);if(im.complete)return resolve();im.addEventListener('load',resolve,{once:true});im.addEventListener('error',resolve,{once:true})})));
  if(generation!==movieGeneration){await ctx.close();return}

  if(record){
   if(!movieCanvas.captureStream||!window.MediaRecorder)throw new Error('このブラウザは動画保存に対応していません。プレビューは再生できます。');
   const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm'];const type=types.find(t=>MediaRecorder.isTypeSupported(t));

  }else runMovieSource(ctx,0,generation);

  $('moviePanel').scrollIntoView({behavior:'smooth',block:'start'});

$('previewMovie').onclick=()=>startMovie(false);$('saveMovie').onclick=()=>startMovie(true);$('playMovie').onclick=()=>startMovie(false);$('stopMovie').onclick=()=>{stopMovie();$('movieStatus').textContent='停止しました'};
$('pauseMovie').onclick=pauseMovie;$('movieSeek').addEventListener('input',e=>{movieScrubbing=true;const time=Number(e.target.value);drawMovie(time);$('movieTime').textContent=formatTime(time)+' / '+formatTime(movieTimeline?.duration||0)});$('movieSeek').addEventListener('change',e=>{movieScrubbing=false;seekMovie(e.target.value)});
window.addEventListener('pagehide',stopMovie);
