// 既存1-9エンジンの音源と開始時刻を共有し、AudioContextの時計で描画する。
const movieCanvas=$('movieCanvas'),mctx=movieCanvas.getContext('2d');
let movieRAF=0,movieRecorder=null,movieStream=null,movieContext=null,movieSource=null,movieTimeline=null,movieStart=0,movieGeneration=0,movieBusy=false,movieOffset=0,moviePlaying=false,movieScrubbing=false;
const movieImages=new Map();
function movieImage(src){if(!src)return null;if(!movieImages.has(src)){const im=new Image();movieImages.set(src,im);im.onload=()=>{if(!moviePlaying)refreshColorPreview()};im.src=src}return movieImages.get(src)}
function hexToRgb(h){const v=h.replace('#','');return [0,2,4].map(i=>parseInt(v.slice(i,i+2),16)||0)}
function toHex(rgb){return '#'+rgb.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function mixColor(a,b,t){t=Math.max(0,Math.min(1,t));const x=hexToRgb(a),y=hexToRgb(b);return toHex(x.map((v,i)=>v+(y[i]-v)*t))}
function brightness(color){return hexToRgb(color).reduce((sum,v,i)=>sum+v*[.2126,.7152,.0722][i],0)}
function contrastColor(color){return brightness(color)>145?'#082d57':'#ffffff'}
function suggestFadeEnd(color,mode){const palette=findTeamPalette(state.team);if(palette&&color.toLowerCase()===palette[0].toLowerCase())return mode==='none'?color:mode==='darken'?palette[2]:palette[1];return mode==='none'?color:mixColor(color,mode==='darken'?'#000000':'#ffffff',.42)}
function constrainFadeEnd(color,end,mode){if(mode==='none')return color;return (mode==='darken'?brightness(end)<=brightness(color):brightness(end)>=brightness(color))?end:suggestFadeEnd(color,mode)}
function backgroundStops(color){if(state.fadeMode==='card'){return [{offset:0,color:color===state.color?(state.teamDark||suggestFadeEnd(color,'darken')):suggestFadeEnd(color,'darken')},{offset:.7,color:color===state.color?state.accent:suggestFadeEnd(color,'brighten')},{offset:1,color}]}return [{offset:0,color},{offset:1,color:state.fadeMode==='none'?color:color===state.color?state.fadeEndColor:suggestFadeEnd(color,state.fadeMode)}]}
function backgroundCss(color){if(state.fadeMode==='none')return color;return 'linear-gradient(110deg,'+backgroundStops(color).map(stop=>stop.color+' '+Math.round(stop.offset*100)+'%').join(',')+')'}
function paintBackground(ctx,w,h,color){if(state.fadeMode==='none'){ctx.fillStyle=color}else{const angle=110*Math.PI/180,length=Math.abs(w*Math.sin(angle))+Math.abs(h*Math.cos(angle)),dx=Math.sin(angle)*length/2,dy=-Math.cos(angle)*length/2,grad=ctx.createLinearGradient(w/2-dx,h/2-dy,w/2+dx,h/2+dy);backgroundStops(color).forEach(stop=>grad.addColorStop(stop.offset,stop.color));ctx.fillStyle=grad}ctx.fillRect(0,0,w,h)}
function refreshFrameColor(){document.documentElement?.style.setProperty('--photo-frame',state.frameColor)}
function refreshTemplateChoices(){document.querySelectorAll('[data-template-preview]').forEach(el=>{el.innerHTML=preview(state.players[chosen],el.dataset.templatePreview,'none',true)})}

function movieText(txt,x,y,size,color='#fff',align='center',weight=700,group='stats'){mctx.font=canvasFont(state.fonts[group],size,weight);mctx.textAlign=align;mctx.fillStyle=color;mctx.fillText(String(txt),x,y)}
function drawMovie(time){
 const ctx=mctx,w=1280,h=720;ctx.clearRect(0,0,w,h);
 if(!movieTimeline)return 0;
 const {starts,rowIndices,duration:total,barSeconds:secPerBar}=movieTimeline;
 const titleSeconds=movieTimeline.titleSeconds||0;
 if(time<titleSeconds){drawCover('titleCard',movieCanvas);const label=$('moviePlayer');if(label)label.textContent='タイトル';return total}
 const sec=Math.max(0,Math.min(time-titleSeconds,total-titleSeconds-.001));let songIndex=0;
 while(songIndex+1<starts.length&&sec>=starts[songIndex+1])songIndex++;
 const pi=rowIndices[songIndex],local=sec-starts[songIndex],secPerPlayer=(starts[songIndex+1]??(total-titleSeconds))-starts[songIndex],bar=Math.floor(local/secPerBar)+1;
 const originalPlayer=state.players[pi];const seq=state.segments.filter(s=>+s.player===pi&&+s.bar<=bar).sort((a,b)=>+a.bar-+b.bar);
 const seg=seq.at(-1),p=scenePlayer(originalPlayer,seg),design=seg?.design||state.design,noPhoto=design.startsWith('none-')||!p.photoEnabled;

 const sceneStart=seg?(Math.max(1,Number(seg.bar))-1)*secPerBar:0,elapsed=Math.max(0,local-sceneStart),duration=Math.max(0,Number(state.duration)||0),progress=duration?Math.min(1,elapsed/duration):1;

function setMovieBusy(busy){movieBusy=busy;for(const id of ['previewMovie','saveMovie','playMovie'])$(id).disabled=busy;updateTransport()}
function formatTime(seconds){const value=Math.max(0,Math.floor(seconds));return Math.floor(value/60)+':'+String(value%60).padStart(2,'0')}
function movieTime(){return moviePlaying&&movieContext?Math.min(movieTimeline.duration,movieOffset+Math.max(0,movieContext.currentTime-movieStart)):movieOffset}
function updateTransport(position=movieTime()){const total=movieTimeline?.duration||0,seek=$('movieSeek');seek.max=String(total);if(!movieScrubbing)seek.value=String(position);seek.disabled=movieBusy||!total||movieRecorder?.state==='recording';$('movieTime').textContent=formatTime(position)+' / '+formatTime(total);const pause=$('pauseMovie');pause.disabled=movieBusy||!movieContext||movieRecorder?.state==='recording';pause.textContent=moviePlaying?'Ⅱ 一時停止':'▶ 再開'}

 const source=ctx.createBufferSource();source.buffer=movieTimeline.buffer;source.connect(ctx.destination);movieSource=source;movieOffset=offset;movieStart=ctx.currentTime+0.04;moviePlaying=true;
 source.addEventListener('ended',()=>{if(movieSource!==source||generation!==movieGeneration)return;moviePlaying=false;movieOffset=movieTimeline.duration;movieSource=null;if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=0;drawMovie(movieOffset);updateTransport();$('movieStatus').textContent='再生が終了しました。再生バーで戻れます。'},{once:true});const title=movieTimeline.titleSeconds||0;source.start(movieStart+Math.max(0,title-offset),Math.max(0,offset-title));
 function tick(){if(movieSource!==source||generation!==movieGeneration)return;const time=movieTime();if(!movieScrubbing){drawMovie(time);updateTransport(time)}movieRAF=requestAnimationFrame(tick)}
 if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=requestAnimationFrame(tick);updateTransport();
}
function detachPreviewSource(){const source=movieSource;movieSource=null;if(source){try{source.stop()}catch(e){}source.disconnect()}if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=0}
async function seekMovie(position){if(!movieTimeline||movieBusy||movieRecorder?.state==='recording')return;const time=Math.max(0,Math.min(Number(position)||0,movieTimeline.duration)),wasPlaying=moviePlaying;detachPreviewSource();moviePlaying=false;movieOffset=time;drawMovie(time);updateTransport(time);if(wasPlaying&&movieContext&&time<movieTimeline.duration){await movieContext.resume();runMovieSource(movieContext,time,movieGeneration)}}
async function pauseMovie(){if(!movieContext||movieBusy||movieRecorder?.state==='recording')return;if(moviePlaying){movieOffset=movieTime();detachPreviewSource();moviePlaying=false;updateTransport();$('movieStatus').textContent='一時停止中'}else{if(movieOffset>=movieTimeline.duration)movieOffset=0;await movieContext.resume();runMovieSource(movieContext,movieOffset,movieGeneration);$('movieStatus').textContent='再生中'}}
function stopMovie(){
 movieGeneration++;moviePlaying=false;movieScrubbing=false;movieOffset=0;if(movieRAF)cancelAnimationFrame(movieRAF);movieRAF=0;
 if(movieSource){try{movieSource.stop()}catch(e){}movieSource.disconnect();movieSource=null}

 if(movieContext){movieContext.close().catch(()=>{});movieContext=null}

}
async function startMovie(record=false){

$('previewMovie').onclick=()=>startMovie(false);$('saveMovie').onclick=()=>startMovie(true);$('playMovie').onclick=()=>startMovie(false);$('stopMovie').onclick=()=>{stopMovie();$('movieStatus').textContent='停止しました'};
$('pauseMovie').onclick=pauseMovie;$('movieSeek').addEventListener('input',e=>{movieScrubbing=true;const time=Number(e.target.value);drawMovie(time);$('movieTime').textContent=formatTime(time)+' / '+formatTime(movieTimeline?.duration||0)});$('movieSeek').addEventListener('change',e=>{movieScrubbing=false;seekMovie(e.target.value)});
