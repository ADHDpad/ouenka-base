<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>曲間コール設定 | OUENKA BASE</title><style>body{margin:0;background:#eef4fa;color:#123453;font:16px/1.7 system-ui}header{padding:16px;background:#071d33;color:white;display:flex;justify-content:space-between}main{max-width:800px;margin:auto;padding:15px}section{background:white;padding:18px;margin-bottom:14px;border:1px solid #d0dfed;border-radius:10px}input,select,button{font:inherit;font-size:16px;padding:10px;border:1px solid #b6cde1;border-radius:7px;box-sizing:border-box}select,input{width:100%}label{display:block;margin-bottom:12px}button{cursor:pointer;background:#075daf;color:white}.gap{border-top:1px solid #d2dfec;padding-top:12px;margin-top:12px}.hint{font-size:13px;color:#58718b}.toolbar{display:flex;gap:10px;flex-wrap:wrap}</style><link rel="stylesheet" href="ui-r177.css?v=20261025-r263"><link rel="stylesheet" href="site-theme.css?v=20261025-r263"><script src="site-theme.js?v=20261025-r263"></script><link rel="stylesheet" href="site-settings.css?v=20261025-r263"><script defer src="site-settings.js?v=20261025-r263"></script><link rel="stylesheet" href="shared-navigation.css?v=20261025-r263"><script defer src="shared-navigation.js?v=20261025-r263"></script><link rel="stylesheet" href="titlebar-type.css?v=20261025-r263"><script defer src="field-state.js?v=20261025-r263"></script></head><body><header><b>曲間コール設定</b><button id="back">戻る</button></header><main><section><h1>曲間コール</h1><p>コールの種類を選び、曲と曲の間に入れられます。「なし」では今までの音のつなぎ方を使用します。</p><label>基本のコール<select id="defaultCall"></select></label><p id="notice" class="hint"></p><div id="gaps"></div><p id="status" role="status"></p><button id="save">設定を保存して戻る</button></section><section><h2>使うコールの種類</h2><p class="hint">登録済みのコールは自動で一覧へ追加します。ほかの登録音源を使う場合は、下からコール名を付けて追加できます。</p><label>登録済みの音源を絞り込む<input id="query" type="search" placeholder="コール名・選手名で検索"></label><label>音源<select id="source"></select></label><label>コール名<input id="callName" placeholder="例：かっとばせコール"></label><button id="add">この種類を追加</button><p id="loadStatus" class="hint"></p></section></main><script src="lineup-settings.js?v=20261025-r263"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),api=window.OuenkaLineupSettings;const draft=api.read(api.draftKey(),{rows:[]}),rows=(draft.rows||[]).filter(r=>r.name),prefs=api.read(api.settingsKey(),{defaultId:'',byGap:{}});let items=api.read(api.catalogKey,[]),songs=[];const back=()=>location.href=api.mode()==='medley'?'./medley.html':'./1-9.html';$('back').onclick=back;
function option(value,label){const o=document.createElement('option');o.value=value;o.textContent=label;return o}
function fill(select,value,inherited=false){select.replaceChildren();if(inherited)select.append(option('@default','基本の設定を使用'));select.append(option('','なし'));items.forEach(item=>select.append(option(item.id,item.name)));select.value=value??(inherited?'@default':'');if(select.selectedIndex<0)select.append(option(value,'登録元を確認してください（保存済み設定）')),select.value=value}
function render(){fill($('defaultCall'),prefs.defaultId);$('defaultCall').onchange=e=>prefs.defaultId=e.target.value;$('notice').textContent=items.length?'曲間コールは前曲の終了後に再生します。':'コール音源がまだ登録されていません。登録済み音源から種類を追加してください。';$('gaps').replaceChildren();for(let i=0;i<rows.length-1;i++){const key=OuenkaCalls.gapKey(rows,i),wrap=document.createElement('label');wrap.className='gap';wrap.textContent=rows[i].name+' → '+rows[i+1].name;const select=document.createElement('select');fill(select,Object.hasOwn(prefs.byGap||{},key)?prefs.byGap[key]:'@default',true);select.onchange=()=>{prefs.byGap??={};if(select.value==='@default')delete prefs.byGap[key];else prefs.byGap[key]=select.value};wrap.append(select);$('gaps').append(wrap)}}
function sources(){const q=$('query').value.trim();$('source').replaceChildren(option('','選択してください'));songs.filter(s=>!q||String(s.player_name||s.name).includes(q)).slice(0,100).forEach((s,i)=>$('source').append(option(String(songs.indexOf(s)),(s.player_name||s.name)+' ／ 制作番号 '+(s.production_number||1))))}
function entry(song,label){const name=song.player_name||song.name,no=String(song.production_number||1);return {id:name+'#'+no,name:label||name,url:'https://adhdpad.github.io/ouenka-base/%E3%83%87%E3%83%BC%E3%82%BF/'+encodeURIComponent(name)+'/'+encodeURIComponent(no)+'/audio.m4a'}}
$('query').oninput=sources;$('source').onchange=()=>{const song=songs[Number($('source').value)];if($('source').value!==''&&song)$('callName').value=song.player_name||song.name};$('add').onclick=()=>{if($('source').value===''){alert('音源を選んでください。');return}const song=songs[Number($('source').value)],label=$('callName').value.trim();if(!song||!label)return;const item=entry(song,label);items=items.filter(x=>x.id!==item.id);items.push(item);localStorage.setItem(api.catalogKey,JSON.stringify(items));render()};$('save').onclick=()=>{try{localStorage.setItem(api.settingsKey(),JSON.stringify(prefs));localStorage.setItem(api.catalogKey,JSON.stringify(items));back()}catch(e){$('status').textContent='保存できませんでした。端末の保存容量を確認してください。'}};
render();fetch('https://ouenka-base-data.ninzin5600.workers.dev/songs',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{songs=Array.isArray(data.songs)?data.songs:[];songs.filter(s=>/コール|かっとばせ/.test(s.player_name||s.name||'')).forEach(song=>{const item=entry(song);if(!items.some(x=>x.id===item.id))items.push(item)});localStorage.setItem(api.catalogKey,JSON.stringify(items));sources();render();$('loadStatus').textContent='登録済み音源を読み込みました。'}).catch(e=>$('loadStatus').textContent='音源一覧を取得できませんでした。保存済みの種類は選択できます。');
})();
</script><script src="team-colors.js?v=20261025-r263"></script><script src="popular-sync.js?v=20261025-r263"></script><script src="ui-r177.js?v=20261025-r263"></script></body></html>
