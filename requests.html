<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>応援歌リクエスト箱 | 応援歌BASE</title><link rel="stylesheet" href="features.css?v=20261023-r237"><link rel="stylesheet" href="site-theme.css?v=20261023-r237"><script src="site-theme.js?v=20261023-r237"></script><link rel="stylesheet" href="site-settings.css?v=20261023-r237"><script defer src="site-settings.js?v=20261023-r237"></script><link rel="stylesheet" href="shared-navigation.css?v=20261023-r237"><script defer src="shared-navigation.js?v=20261023-r237"></script><link rel="stylesheet" href="titlebar-type.css?v=20261023-r237"></head><body><header class="feature-header"><a href="index.html">◀戻る</a><b>リクエスト箱</b><button id="requestRefresh">一覧を更新</button></header><main class="feature-main"><div class="feature-hero"><h1>この応援歌、聴きたい。</h1><p>追加してほしい応援歌を投稿。「自分も欲しい」で応援できます。</p></div><p id="requestStatus" role="status" aria-live="polite"></p><section class="feature-panel"><h2>応援歌をリクエスト</h2><form id="requestForm"><div class="feature-filters"><label>選手名・応援歌名<input id="requestName" required maxlength="80" placeholder="選手名、汎用名など"></label><label>球団<input id="requestTeam" required maxlength="100" list="requestTeams" placeholder="球団名"><datalist id="requestTeams"></datalist></label><label>種類<select id="requestKind"><option>個人応援歌</option><option>前奏</option><option>旧応援歌</option><option>汎用応援歌</option><option>データ修正</option></select></label><label>年度・バージョン（任意）<input id="requestVersion" maxlength="60" placeholder="例：2024年版、移籍前"></label></div><label>補足（任意）<textarea id="requestNote" maxlength="600" placeholder="分かる歌詞や、どのバージョンかを書いてください。個人情報は書かないでください。"></textarea></label><button id="requestSubmit" class="feature-button" type="submit">投稿する（自分の1票を含む）</button></form><p class="feature-note">同じ球団・名前・種類・バージョンの投稿は1件にまとめます。投稿はリクエストであり、収録時期を約束するものではありません。</p></section><section class="feature-panel"><div class="feature-filters"><label>投稿を探す<input id="requestQuery" type="search" placeholder="名前・球団・補足"></label><label>表示順<select id="requestSort"><option value="votes">欲しい人が多い順</option><option value="new">新しい順</option></select></label></div><p id="requestCount"></p><ul id="requestList" class="request-list"></ul></section><p class="feature-note">投票はこの端末の匿名IDで記録します。同じIDから同じ投稿への票は1票です。</p></main><script src="team-colors.js?v=20261023-r237"></script><script src="ouenka-catalog.js?v=20261023-r237"></script><script src="requests.js?v=20261023-r237"></script></body></html>
